<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Table Tennis Ultimate — прототип TMA (9:16)</title>
<style>
/* ============================================================
   TOKENS — glassmorphism + casual 2D, dark ink navy
   ============================================================ */
:root{
  /* дефолты совпадают с пресетом logo (js5.part): до applyTheme страница
     не должна мигать старой ареной */
  --bg1:#070B14; --bg2:#0B1322; --bg3:#070B14;
  /* surface — цвет карточки/подложки; раньше в CSS его не было вовсе,
     поэтому var(--surface) роняло объявление целиком */
  --surface:#121C2E;
  --ink:#F2F6FF; --mut:rgba(226,236,248,.68); --dim:rgba(158,177,201,.55);

  --glass:rgba(255,255,255,.065);
  --glass-2:var(--ov-10);
  
  --brd:rgba(255,255,255,.13);
  --brd-2:rgba(255,255,255,.22);

  --coral:#E23B2E; --teal:#35C6F4; --sky:#2C7BF0;
  /* Чистый --coral на тёмной плашке даёт ~3.9:1 — ниже порога 4.5:1 для текста.
     Для надписей используем осветлённый микс; границы и заливки едут на --coral. */
  --coral-txt:color-mix(in srgb, var(--coral) 68%, #fff);
  /* те же смыслы для неба и бирюзы: --sky как текст даёт 4.24:1 на тёмной плашке */
  --sky-txt:color-mix(in srgb, var(--sky) 62%, #fff);
  --teal-txt:color-mix(in srgb, var(--teal) 55%, #fff);
  --gold:#FBBF24; --violet:#A78BFA; --lime:#A3E635;
    
  /* текст поверх заливки акцентом; считает applyTheme() по WCAG-яркости */
  --on-accent:#FFFFFF; --on-accent-2:#151214; --on-accent-3:#151214;
  /* ручки световых пятен (.art .blob) — крутятся панелью под телефоном */
  --blob-blur:24px; --blob-op:.55;
  /* шрифтовые токены и алиас приглушённого текста: в приложении их не было,
     панель под телефоном их придумала — 12 объявлений молча падали */
  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: var(--font-ui);
  --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --muted: var(--mut);

   --r-s:14px; --r:20px; --r-l:26px; --r-xl:34px; --r-p:999px;

  --sh:0 18px 40px rgba(2,6,16,.55);
  --sh-s:0 8px 20px rgba(2,6,16,.45);
  /* дефолты совпадают с тем, что пишет applyTheme при glow=1, plate=1 */
  --glow-k:1; --glass-blur:18px;
  --glow-coral:0 10px 26px rgba(226,59,46,.3);
  --glow-teal:0 10px 26px rgba(53,198,244,.26);
  --glow-sky:0 10px 26px rgba(44,123,240,.26);
  --plate-1:rgba(18,28,46,.88); --plate-2:rgba(7,11,20,.95);

  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-in:cubic-bezier(.4,0,1,1);
  --t-in:260ms; --t-out:180ms; --t-press:120ms;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--ink); font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(900px 620px at 8% -8%, color-mix(in srgb, var(--teal) 13%, transparent), transparent 60%),
    radial-gradient(820px 560px at 102% 30%, color-mix(in srgb, var(--coral) 12%, transparent), transparent 62%),
    radial-gradient(900px 700px at 46% 112%, color-mix(in srgb, var(--sky) 10%, transparent), transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed; -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:inherit}
i,.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i-16{width:16px;height:16px}.i-18{width:18px;height:18px}.i-24{width:24px;height:24px}.i-28{width:28px;height:28px}

/* ============================================================
   APP SHELL: список экранов + телефон 9:16
   ============================================================ */
.app{display:grid;grid-template-columns:280px 1fr;gap:26px;height:100vh;padding:22px;align-items:center}
.rail{
  height:calc(100vh - 44px);overflow:auto;padding:14px;border-radius:var(--rd-xl);
  background:linear-gradient(180deg,var(--ov-07),var(--ov-03));
  border:1px solid var(--brd); backdrop-filter:blur(20px); box-shadow:var(--sh); align-self:start;
}
.rail h1{font-size:15px;margin:0 0 2px;letter-spacing:-.01em}
.rail .sub{font-size:11px;color:var(--dim);margin-bottom:12px;letter-spacing:.06em;text-transform:uppercase}
.rail .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:12px 4px 5px}
.rail button{
  display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;color:var(--mut);
  font-size:12px;padding:7px 9px;border-radius:var(--rd-s);cursor:pointer;transition:background .18s,color .18s,transform .18s var(--ease-out);
}.rail button.on{background:linear-gradient(180deg,color-mix(in srgb, var(--coral) 22%, transparent),color-mix(in srgb, var(--coral) 10%, transparent));color:#fff;box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--coral) 35%, transparent)}
.rail button .id{font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--dim);width:24px;flex:none}
.rail::-webkit-scrollbar{width:6px}.rail::-webkit-scrollbar-thumb{background:var(--ov-14);border-radius:var(--rd-sm)}

.stagebox{display:grid;place-items:center;min-width:0}
.phone{
  position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;flex:none;
  border:1px solid var(--ov-14);
  box-shadow:0 40px 90px rgba(2,6,16,.65), 0 0 0 8px rgba(255,255,255,.028), inset 0 0 0 1px var(--ov-06);
  background:linear-gradient(170deg,var(--bg1),var(--bg1));
  transform:scale(var(--zoom,1)); transform-origin:center center;
}
.phone::after{ /* сканер-полоса-блик */
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(140deg,var(--ov-10),transparent 28%,transparent 72%,var(--ov-05));
  mix-blend-mode:screen;opacity:.55;
}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:22px;border-radius:var(--rd-pill);background:#05080F;z-index:80;opacity:.9}
.statusbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-size:11px;font-weight:700;letter-spacing:.02em;color:rgba(255,255,255,.85);z-index:70;pointer-events:none}

/* ============================================================
   SCREEN
   ============================================================ */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(600px 420px at 100% 0%, color-mix(in srgb, var(--coral) 10%, transparent), transparent 60%),
    radial-gradient(540px 420px at 0% 20%, color-mix(in srgb, var(--teal) 10%, transparent), transparent 62%),
    linear-gradient(180deg,var(--bg1),var(--bg1) 60%,var(--bg1));
}
.screen.enter{animation:scrIn var(--t-in) var(--ease-out) both}
.screen.exit{animation:scrOut 160ms var(--ease-in) both}
@keyframes scrIn{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
@keyframes scrOut{to{opacity:0;transform:translateY(6px)}}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:52px 16px calc(104px + env(safe-area-inset-bottom));scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll.nonav{padding-bottom:24px}

/* top bar */
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
/* уточнение к заголовку — в одну строку с ним, а не второй строкой:
   экономит ~14px вертикали в каждом дочернем экране */
.tbar .tb-sub{font-size:10.5px;font-weight:600;color:var(--dim);margin-left:7px;letter-spacing:0;white-space:nowrap}
.tbar .h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar .who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.ava{position:relative;width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;
  background:linear-gradient(160deg,color-mix(in srgb, var(--surface) 72%, #fff),var(--surface));border:1px solid var(--brd);box-shadow:inset 0 1px 0 var(--ov-16)}
.ava .st{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--teal);border:2px solid var(--bg1)}
.ava.sm{width:32px;height:32px;font-size:11px}
.ava.lg{width:66px;height:66px;font-size:20px}
.ava.xl{width:84px;height:84px;font-size:26px;box-shadow:0 0 0 2px var(--ov-10), inset 0 1px 0 rgba(255,255,255,.2)}
.who .nm{font-size:13px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .rl{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px}
.iconbtn{position:relative;width:38px;height:38px;flex:none;border-radius:var(--rd-s);display:grid;place-items:center;cursor:pointer;
  background:linear-gradient(180deg,var(--ov-10),var(--ov-05));border:1px solid var(--brd);
  color:var(--mut);backdrop-filter:blur(14px);transition:transform var(--t-press) var(--ease-out),background .2s}
.iconbtn:active{transform:scale(.94)}
.iconbtn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--bg1)}
/* в топбаре кнопки и пилюли баланса без рамок: обводка превращала
   строку в «три поля формы», а без неё группа читается как один блок */
.tbar .iconbtn{border-color:transparent;background:rgba(255,255,255,.055)}.currencies{display:flex;gap:4px}
.wallet{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px;border-radius:var(--rd-pill);font-size:11px;font-weight:700;
  background:rgba(255,255,255,.055);color:var(--ink)}
.wallet .i{width:18px;height:18px;stroke-width:1.7}
.wallet.gold .i{color:var(--gold)}
.wallet.gem .i{color:var(--sky)}

/* glass card */
.g{background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));
  border:1px solid var(--brd);border-radius:var(--r);backdrop-filter:blur(18px);box-shadow:var(--sh-s),inset 0 1px 0 var(--ov-12)}
.g.pad{padding:14px}
.g.tight{padding:11px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.mt{margin-top:12px}.mt-s{margin-top:8px}.mt-l{margin-top:18px}

.sec{margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.sec h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0;font-weight:800}
.sec .more{margin-left:auto;font-size:11px;color:var(--sky);cursor:pointer;padding:6px 8px;border-radius:var(--rd-pill)}
.h1{font-size:26px;font-weight:850;letter-spacing:-.03em;line-height:1.1;margin:0}
/* Заголовок раздела: название слева + инструменты (переключатели/фильтр) справа.
   Раньше под h1 висел декоративный подзаголовок, а фильтры занимали
   отдельные строки во всю ширину — список уезжал за первый экран. */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
.page-head>.h1{font-size:21px;flex:0 1 auto;min-width:0}
.page-head-tools{flex:none;display:flex;align-items:center;gap:6px}
.page-head .seg{padding:3px;gap:2px;background:var(--ov-05)}
.page-head .seg button{height:28px;padding:0 10px;font-size:11px;border-radius:var(--rd-s);flex:0 0 auto;white-space:nowrap}
/* компактный селектор-фильтр: одна facets-строка вместо трёх рядов во всю ширину */
.sel-mini{appearance:none;-webkit-appearance:none;box-sizing:border-box;height:28px;max-width:124px;
  border:1px solid var(--brd);border-radius:var(--rd-s);background-color:rgba(255,255,255,.055);color:var(--ink);
  padding:0 22px 0 9px;font-size:11px;font-weight:700;line-height:1;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2393A7C4' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 7px center;background-size:9px}.sel-mini:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.sel-mini option{background:#0F1A2C;color:var(--ice);font-weight:600}
.h2{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:0}
.h3{font-size:14px;font-weight:750;margin:0}
.mut{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:11px}.mono{font-variant-numeric:tabular-nums}
.center{text-align:center}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--rd-xs);font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;
  flex:0 1 auto;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.b-coral{background:color-mix(in srgb, var(--coral) 18%, transparent);color:color-mix(in srgb, var(--coral) 58%, #fff);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--coral) 35%, transparent)}
.b-teal{background:color-mix(in srgb, var(--teal) 16%, transparent);color:color-mix(in srgb, var(--teal) 52%, #fff);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--teal) 32%, transparent)}
.b-sky{background:color-mix(in srgb, var(--sky) 16%, transparent);color:color-mix(in srgb, var(--sky) 52%, #fff);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--sky) 32%, transparent)}
.b-gold{background:color-mix(in srgb, var(--gold) 16%, transparent);color:var(--gold-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--gold) 32%, transparent)}
.b-mut{background:var(--ov-08);color:var(--mut);box-shadow:inset 0 0 0 1px var(--brd)}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 18px;border-radius:var(--r-p);
  border:1px solid transparent;font-size:15px;font-weight:800;letter-spacing:-.01em;cursor:pointer;overflow:hidden;
  transition:transform var(--t-press) var(--ease-out),filter .2s,box-shadow .2s;width:100%;
  background:linear-gradient(180deg,var(--ov-12),var(--ov-05));color:var(--ink);border-color:var(--brd);
  backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 var(--ov-16),var(--sh-s)}
.btn:active{transform:scale(.96)}
.btn.coral{background:linear-gradient(180deg,color-mix(in srgb, var(--coral) 72%, #fff),var(--coral) 52%,color-mix(in srgb, var(--coral) 82%, #000));border-color:rgba(255,255,255,.28);color:var(--on-accent, #fff);
  box-shadow:0 10px 26px color-mix(in srgb, var(--coral) 30%, transparent),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.teal{background:linear-gradient(180deg,color-mix(in srgb, var(--teal) 62%, #fff),var(--teal) 52%,color-mix(in srgb, var(--teal) 80%, #000));border-color:rgba(255,255,255,.28);color:var(--on-accent-2, var(--deep-teal));
  box-shadow:0 10px 26px color-mix(in srgb, var(--teal) 26%, transparent),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.sky{background:linear-gradient(180deg,color-mix(in srgb, var(--sky) 58%, #fff),var(--sky) 52%,color-mix(in srgb, var(--sky) 80%, #000));color:var(--on-accent-3, var(--deep-sea));border-color:rgba(255,255,255,.28);
  box-shadow:0 10px 26px color-mix(in srgb, var(--sky) 26%, transparent),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.ghost{background:transparent;border-color:var(--brd-2);color:var(--mut);box-shadow:none}
.btn.sm{height:40px;font-size:13px;border-radius:var(--rd-m);width:auto;padding:0 14px}
.btn.xs{height:32px;font-size:11px;border-radius:var(--rd-s);width:auto;padding:0 11px}
.btn.icon{width:50px;padding:0;border-radius:var(--rd-m)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
.link{color:var(--sky);font-size:12px;font-weight:700;cursor:pointer}
.press{transition:transform var(--t-press) var(--ease-out)}
.press:active{transform:scale(.97)}

/* bottom nav */
/* нижнее меню: только иконки, без подписей. Активный таб — цвет и короткая
   полоска-индикатор под иконкой, без красного квадрата: плашка спорила
   с таким же красным акцентом вокруг и перегружала нижнюю строку. */
.nav{position:absolute;left:12px;right:12px;bottom:12px;height:58px;border-radius:var(--rd-l);display:flex;align-items:center;gap:2px;
  padding:0 8px;background:linear-gradient(180deg,rgba(22,34,56,.86),rgba(14,24,42,.92));border:1px solid var(--brd);backdrop-filter:blur(24px) saturate(1.4);box-shadow:var(--sh),inset 0 1px 0 var(--ov-14);z-index:40}
.nav a{position:relative;flex:1;display:grid;place-items:center;height:42px;margin:0 1px;border-radius:var(--rd-m);cursor:pointer;color:var(--dim);
  transition:color .2s,background .2s,transform var(--t-press) var(--ease-out)}
.nav a:active{transform:scale(.92)}.nav a.on{color:var(--ink);background:transparent}
.nav a.on::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:18px;height:3px;border-radius:var(--rd-pill);background:var(--coral)}
.nav a.on .i{color:var(--coral);filter:drop-shadow(0 0 8px color-mix(in srgb, var(--coral) 55%, transparent))}

/* progress / bars */
.bar{height:8px;border-radius:var(--rd-pill);background:var(--ov-08);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
.bar>i{display:block;height:100%;border-radius:var(--rd-pill);background:linear-gradient(90deg,var(--teal),var(--sky));box-shadow:0 0 12px color-mix(in srgb, var(--teal) 45%, transparent);transition:width .8s var(--ease-out)}
.bar.coral>i{background:linear-gradient(90deg,color-mix(in srgb, var(--coral) 72%, #fff),var(--coral));box-shadow:0 0 12px color-mix(in srgb, var(--coral) 45%, transparent)}
.ring{position:relative;width:56px;height:56px;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-size:12px}

/* sheet / modal / popup */
.ovl{position:absolute;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:12px;
  background:rgba(4,8,16,.60);backdrop-filter:blur(3px);animation:ovlIn var(--t-in) var(--ease-out) both}
.ovl.mid{align-items:center}
.ovl.closing{animation:ovlOut var(--t-out) var(--ease-in) both}
@keyframes ovlIn{from{opacity:0}to{opacity:1}}
@keyframes ovlOut{to{opacity:0}}
.sheet{width:100%;border-radius:var(--rd-xl);padding:16px;background:linear-gradient(180deg,rgba(30,44,68,.96),rgba(16,26,44,.98));
  border:1px solid var(--brd-2);box-shadow:0 -10px 40px rgba(2,6,16,.6),inset 0 1px 0 rgba(255,255,255,.18);
  animation:sheetIn var(--t-in) var(--ease-out) both}
.ovl.closing .sheet{animation:sheetOut var(--t-out) var(--ease-in) both}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
@keyframes sheetOut{to{opacity:0;transform:translateY(14px) scale(.99)}}
.sheet .handle{width:42px;height:4px;border-radius:var(--rd-pill);background:rgba(255,255,255,.22);margin:0 auto 12px}
.modal{width:100%;max-width:330px;border-radius:var(--rd-xl);padding:18px;background:linear-gradient(180deg,rgba(32,46,70,.97),rgba(17,27,45,.98));
  border:1px solid var(--brd-2);box-shadow:0 24px 60px rgba(2,6,16,.7),inset 0 1px 0 rgba(255,255,255,.18);
  animation:modalIn var(--t-in) var(--ease-out) both}
.ovl.closing .modal{animation:modalOut var(--t-out) var(--ease-in) both}
@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:none}}
@keyframes modalOut{to{opacity:0;transform:scale(.97)}}
.modal .m-ico{width:52px;height:52px;border-radius:var(--rd-m);display:grid;place-items:center;margin:0 auto 12px;background:var(--ov-10);border:1px solid var(--brd)}

/* Плитка: иконка слева, текст справа. Раньше была вертикальная «башня»
   иконка→заголовок→подпись: она раздувала карточки вдвое и ломала
   прокрутку на коротких экранах. Сетка держит оба варианта разметки. */
.tile{padding:11px 12px;border-radius:var(--rd-m);background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));
  border:1px solid var(--brd);display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:10px;row-gap:1px;
  box-shadow:inset 0 1px 0 var(--ov-12);
  cursor:pointer;transition:transform var(--t-press) var(--ease-out),background .2s}
.tile:active{transform:scale(.97)}
.tile .ico{grid-row:1/3;width:34px;height:34px;border-radius:var(--rd-s);display:grid;place-items:center;background:var(--ov-08)}
.tile b{font-size:12.5px;font-weight:800;line-height:1.25}
.tile span{font-size:11px;color:var(--dim);line-height:1.3}
/* смысловой цвет иконки плитки — классом, а не инлайновым color-mix */
.tile .ico.coral{color:color-mix(in srgb, var(--coral) 68%, #fff)}
.tile .ico.teal{color:color-mix(in srgb, var(--teal) 62%, #fff)}
.tile .ico.sky{color:color-mix(in srgb, var(--sky) 62%, #fff)}
.tile .ico.gold{color:var(--gold-soft)}
.tile .ico.violet{color:color-mix(in srgb, var(--violet) 65%, #fff)}
/* Пункты настроек сеткой 2×N: весь раздел целиком влезает в первый экран,
   вместо одиннадцати строк с прокруткой на пол-экрана */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.set-grid .tile{padding:8px 10px}
.set-grid .tile .ico{width:30px;height:30px}
.set-grid .tile b{font-size:12px}
.set-grid .tile span{font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* иконка-слот: один класс вместо десяти инлайновых «34×34, радиус, фон, рамка».
   Инлайн-стили в ~16 местах давали три разных оттенка фона и «плавающую»
   толщину границ — здесь один токен на вариант. */
.islot{width:34px;height:34px;flex:none;border-radius:var(--rd-s);display:grid;place-items:center;
  background:var(--slot-bg, var(--ov-07));border:var(--slot-bd, 0px) solid var(--slot-bdc, var(--brd));color:var(--ink)}
.islot.sm{width:30px;height:30px}
.islot.lg{width:40px;height:40px}
.islot.xl{width:44px;height:44px;font-weight:900}
/* варианты задаются локальными переменными, поэтому складываются: .islot.sm.teal работает */
.islot.brd{--slot-bd:1px}
.islot.mut{--slot-bg:var(--ov-05)}
.islot.coral{--slot-bg:color-mix(in srgb, var(--coral) 16%, transparent);--slot-bd:1px;--slot-bdc:color-mix(in srgb, var(--coral) 35%, transparent)}
.islot.teal{--slot-bg:color-mix(in srgb, var(--teal) 16%, transparent);--slot-bd:1px;--slot-bdc:color-mix(in srgb, var(--teal) 35%, transparent)}
.islot.sky{--slot-bg:color-mix(in srgb, var(--sky) 16%, transparent);--slot-bd:1px;--slot-bdc:color-mix(in srgb, var(--sky) 35%, transparent)}
.islot.gold{--slot-bg:color-mix(in srgb, var(--gold) 18%, transparent)}
/* ячейка «ежедневного входа»: семь равных слотов в ряд */
.streak-row{display:flex;gap:6px;margin-top:8px}
.streak-cell{flex:1;height:38px;min-width:0;border:1px solid var(--brd);border-radius:var(--rd-s);
  display:grid;place-items:center;background:var(--ov-04);color:var(--dim)}
.streak-cell.on{border-color:color-mix(in srgb, var(--teal) 45%, transparent);background:color-mix(in srgb, var(--teal) 12%, transparent);color:color-mix(in srgb, var(--teal) 62%, #fff)}
/* строка выбора режима: подпись тянется, бейдж прижимается вправо и
   переносится на новую строку, а не распирает ряд за границы экрана */
.mode-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mode-row .grow{flex:1 1 140px;min-width:0}

.switch{width:46px;height:27px;border-radius:var(--rd-pill);flex:none;border:1px solid var(--brd);background:var(--ov-08);position:relative;cursor:pointer;transition:background .24s}

.chip.teal.on{background:color-mix(in srgb, var(--teal) 18%, transparent);border-color:color-mix(in srgb, var(--teal) 45%, transparent);color:#9DF3E7}

  background-size:200% 100%;animation:shimmer 1.3s linear infinite}

.match-court { height: 240px; position: relative; }
.arena-serve {

.hud { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 44px 14px 14px; min-height: 100%; }

.hud-pl { display: flex; align-items: center; gap:8px; font-size:11px; font-weight: 750; }

/* ---------- 4. Тренировка ---------- */

}

}

/* ---------- 5. Лидерборд / лиги ---------- */
.lb-row {

/* ---------- 6. Календарь / пропуск ---------- */

.cal-cell {

.tier-l { font-size:10.5px; color: var(--mut); grid-column: 2; }

.war-score { display: flex; align-items: center; justify-content: center; gap: 14px; }
.war-side { text-align: center; }
.war-side b { display: block; font-size: 24px; font-family: var(--font-mono); }
.war-side span { font-size:10.5px; color: var(--dim); }
.war-side.me b { color: var(--teal); }
.war-vs { color: var(--dim); font-size: 18px; }
.war-bar { height: 8px; border-radius:var(--rd-pill); background: color-mix(in srgb, var(--coral) 22%, transparent); overflow: hidden; margin-top: 10px; }
.war-bar i { display: block; height: 100%; background: linear-gradient(90deg, color-mix(in srgb, var(--teal) 62%, #fff), var(--teal)); border-radius:var(--rd-pill); transition: width .3s ease; }
.bracket { display: flex; gap: 10px; overflow-x: auto; padding: 6px 0 10px; }
.br-round { display: flex; flex-direction: column; gap: 8px; min-width: 132px; }
.br-title { letter-spacing: .08em; text-transform: uppercase; }

.tl-row { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--ov-06); }
.tl-time { width: 44px; flex: none; color: var(--sky); font-size: 12px; }
.tl-body { display: flex; flex-direction: column; gap: 2px; }

/* ---------- 8. Уведомления ---------- */
.notif-row.unread { border-color: color-mix(in srgb, var(--coral) 34%, transparent); background: color-mix(in srgb, var(--coral) 7%, transparent); }
/* .n-ico — алиас .islot, коробка объявлена один раз в head.part */
.n-title { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.n-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.n-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--coral); flex: none; }
.notif-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }

/* ---------- 9. Настройки ---------- */
.setrow { padding: 9px 0; border-bottom: 1px solid var(--ov-06); align-items: center; }
.setrow:last-child { border-bottom: 0; }
.setrow.col { display: flex; flex-direction: column; align-items: stretch; gap:8px; }
.set-label { font-size: 12.5px; font-weight: 700; }
/* слайдеры: одна тема на все input[type=range].
   раньше оформлен был только класс .range, а большинство ручек в доке стилей и на экранах
   настроек оставались браузерной белой полосой — и по виду, и по контрасту. */
input.range, input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer;
}
input.range::-webkit-slider-runnable-track, input[type=range]::-webkit-slider-runnable-track {
  height: 6px; border-radius:var(--rd-pill);
  background: linear-gradient(90deg, color-mix(in srgb, var(--teal) 70%, transparent), color-mix(in srgb, var(--sky) 50%, transparent));
}
input.range::-webkit-slider-thumb, input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%;
  background: var(--ice); border: 2px solid color-mix(in srgb, var(--teal) 80%, transparent); box-shadow: 0 2px 6px rgba(0, 0, 0, .4);
}
input.range::-moz-range-track, input[type=range]::-moz-range-track { height: 6px; border-radius:var(--rd-pill); background: color-mix(in srgb, var(--teal) 50%, transparent); }
input.range::-moz-range-thumb, input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--ice); border: 2px solid color-mix(in srgb, var(--teal) 80%, transparent); }
input[type=range]:focus-visible { outline: 2px solid var(--sky); outline-offset: 4px; border-radius:var(--rd-pill); }

/* ---------- 10. Окна с собственным содержимым ---------- */
.pop-custom { max-height: 86vh; overflow: auto; }
.pop-custom-body { padding: 2px 0 4px; }
.engine-pre {

  padding: 10px; max-height: 220px; overflow: auto; white-space: pre-wrap;
}

/* ---------- 11. Уменьшение движения ---------- */
body.rm .war-bar i, body.rm .form-strip i, body.rm .drill-ring { transition: none !important; }

/* ---------------------------------------------------------------------------
   1. ТОКЕНЫ v2: типографика, отступы, радиусы, тени, движение

:root{

  /* радиусы: 4 ступени, все производные от --r — его кручит ручка «Радиус» в теме.
     Раньше шкала --rd-* жила своей жизнью, и половина компонентов не слушалась настройки. */
  --rd-s:calc(var(--r) * .6); --rd-m:calc(var(--r) * .8); --rd-l:var(--r); --rd-xl:calc(var(--r) * 1.35);

  --tx-3:rgba(178,195,218,.78);   /* подписи */

  /* движение */
  --dur-1:120ms; --dur-2:180ms; --dur-3:260ms; --dur-4:320ms;
  --ease-std:cubic-bezier(.2,.8,.2,1);
  

  /* плотность (переключается атрибутом data-density) */

   --------------------------------------------------------------------------- */

.scroll p, .scroll .small, .scroll .pop-text{max-width:62ch; text-wrap:pretty}
.scroll .small.dim, .scroll .small.mut{max-width:62ch}
.h1,.h2,.h3,.lr-title,.tbar .h3{text-wrap:balance}

/* ---------------------------------------------------------------------------
   3. ЦВЕТА ТЕКСТА: четыре уровня вместо двадцати двух оттенков
   --------------------------------------------------------------------------- */
.dim{color:var(--tx-3)}
.mut{color:var(--tx-2)}
.small.dim{color:var(--tx-3)}
.small.mut{color:var(--tx-2)}
.tx-4{color:var(--tx-4)}
a{color:var(--sky)}

/* ---------------------------------------------------------------------------
   4. РАДИУСЫ: сводим компоненты к пяти ступеням
   --------------------------------------------------------------------------- */
.g,.card,.panel{border-radius:var(--rd-l)}
.g.tight{border-radius:var(--rd-m)}
.btn{border-radius:var(--rd-pill)}
.btn.sm{border-radius:var(--rd-m)}
.btn.xs{border-radius:var(--rd-s)}
.iconbtn{border-radius:var(--rd-m)}
.tile{border-radius:var(--rd-m)}
.badge{border-radius:var(--rd-sm)}
.chip{border-radius:var(--rd-pill)}
.nav{border-radius:var(--rd-xl)}
.seg{border-radius:var(--rd-m)}
.seg button{border-radius:var(--rd-s)}
.modal,.sheet{border-radius:var(--rd-xl)}
.toast{border-radius:var(--rd-m)}
.input,.field input,.field textarea{border-radius:var(--rd-s)}

/* ---------------------------------------------------------------------------
   5. ОТСТУПЫ: вертикальный ритм из одного источника
   --------------------------------------------------------------------------- */
.g.pad{padding:var(--density-pad)}
.g.tight{padding:var(--density-row)}
.row{gap:var(--density-gap)}
.between{gap:var(--density-gap)}
.btn-row{gap:var(--sp-2)}
.sec{margin:var(--sp-5) 0 var(--sp-2)}
.grid2,.grid3{gap:var(--sp-2)}
.mt{margin-top:var(--sp-4)}
.mt-s{margin-top:var(--sp-2)}
.mb{margin-bottom:var(--sp-2)}

/* ---------------------------------------------------------------------------
   6. КНОПКИ: иерархия действий, busy, disabled, размеры
   --------------------------------------------------------------------------- */
.btn{font-size:var(--fs-13); font-weight:750; letter-spacing:.1px}
.btn.sm{font-size:var(--fs-12)}
.btn.xs{font-size:var(--fs-11); min-height:30px}
.btn.xs,.btn.sm{min-height:34px}
.btn.ghost{border-color:var(--ov-16)}
/* вторичный primary: сохраняет цвет бренда, но не спорит с главным действием */
.btn.coral-soft{
  background:linear-gradient(180deg,rgba(255,145,135,.22),rgba(226,84,74,.16));
  border:1px solid color-mix(in srgb, var(--coral) 42%, transparent); color:#FFD7D2; box-shadow:none;
}
.btn.teal-soft{
  background:linear-gradient(180deg,rgba(109,235,218,.2),rgba(20,164,147,.16));
  border:1px solid color-mix(in srgb, var(--teal) 40%, transparent); color:color-mix(in srgb, var(--teal) 40%, #fff); box-shadow:none;
}

/* состояние «выполняется»: спиннер вместо текста, кнопка не дёргается */
.btn[data-busy]{pointer-events:none; opacity:.92}
.btn[data-busy]::after{
  content:""; position:absolute; right:14px; width:14px; height:14px; border-radius:50%;
  border:2px solid rgba(255,255,255,.35); border-top-color:#fff; animation:uxSpin .7s linear infinite;
}
.btn[data-busy] .btn-label{opacity:.55}
@keyframes uxSpin{to{transform:rotate(360deg)}}

.btn:disabled,.btn[aria-disabled="true"]{opacity:.42; filter:saturate(.5); pointer-events:none}
.btn:focus-visible{outline:2px solid var(--sky); outline-offset:3px}

/* иконочная кнопка с подписью снизу */
.iconbtn.lbl{width:auto; height:auto; padding:6px 8px; gap:4px; flex-direction:column; font-size:10.5px}

/* ---------------------------------------------------------------------------
   7. ПОЛЯ ВВОДА: label, подсказка, ошибка, состояние
   --------------------------------------------------------------------------- */
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:var(--sp-3)}
.field-lbl{font-size:var(--fs-12); font-weight:700; color:var(--tx-2)}
.field-lbl .req{color:var(--coral-txt)}
.field input,.field textarea,.input{
  width:100%; min-height:44px; padding:11px 13px; color:var(--tx-1);
  background:rgba(8,14,26,.6); border:1px solid var(--ov-14);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.45);
  font:600 var(--fs-13)/1.4 inherit; transition:border-color var(--dur-2) var(--ease-std), box-shadow var(--dur-2) var(--ease-std);
}
.field input::placeholder,.field textarea::placeholder{color:var(--tx-4)}
.field input:focus,.field textarea:focus,.input:focus{
  outline:none; border-color:color-mix(in srgb, var(--sky) 65%, transparent); box-shadow:inset 0 2px 6px rgba(0,0,0,.45), 0 0 0 3px color-mix(in srgb, var(--sky) 18%, transparent);
}
.field-hint{font-size:var(--fs-11); color:var(--tx-4)}
.field-err{display:none; font-size:var(--fs-11); color:#FFA79F}
.field.invalid input{border-color:color-mix(in srgb, var(--coral) 70%, transparent); box-shadow:0 0 0 3px color-mix(in srgb, var(--coral) 16%, transparent)}
.field.invalid .field-err{display:block}
.field.invalid .field-hint{display:none}

/* ---------------------------------------------------------------------------
   8. ХЛЕБНЫЕ КРОШКИ И СВЯЗАННЫЕ ЭКРАНЫ
   --------------------------------------------------------------------------- */
.crumbs{
  display:flex; align-items:center; gap:6px; margin:-6px 0 var(--sp-3);
  font-size:var(--fs-11); color:var(--tx-4); overflow:hidden; white-space:nowrap;
}
.crumbs a,.crumbs span.lnk{color:var(--tx-3); text-decoration:none; cursor:pointer; transition:color var(--dur-1)}.crumbs .sep{opacity:.45}
.crumbs{flex-wrap:nowrap; overflow:hidden; min-height:30px}
.crumbs .lnk,.crumbs .sep{flex:0 0 auto}
.crumbs .lnk{display:inline-flex; align-items:center; min-height:34px; padding:0 4px}
.crumbs .cur{color:var(--tx-2); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:0 1 auto; max-width:52%}

.ux-related{margin:var(--sp-6) 0 var(--sp-2)}
.ux-related .ttl{font-size:var(--fs-11); letter-spacing:.12em; text-transform:uppercase; color:var(--tx-4); margin-bottom:8px}
.ux-related .lnks{display:flex; flex-wrap:wrap; gap:6px}
.ux-related .lnk{
  display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 12px;
  border-radius:var(--rd-pill); font-size:var(--fs-11); font-weight:700; color:var(--tx-2);
  background:var(--ov-05); border:1px solid var(--ov-12); cursor:pointer;
  transition:background var(--dur-1), transform var(--dur-1);
}.ux-related .lnk:active{transform:scale(.96)}

/* ---------------------------------------------------------------------------
   9. «ЕЩЁ N ДЕЙСТВИЙ»: разгрузка перегруженных экранов
   --------------------------------------------------------------------------- */
.ux-more{margin-top:var(--sp-2)}
.ux-more>summary{
  list-style:none; cursor:pointer; font-size:var(--fs-12); font-weight:700; color:var(--sky);
  padding:10px 0; display:flex; align-items:center; gap:6px;
}
.ux-more>summary::-webkit-details-marker{display:none}
.ux-more>summary::before{content:"⋯"; font-size:15px; line-height:1}
.ux-more[open]>summary::before{content:"▴"}
.ux-more .inner{display:flex; flex-direction:column; gap:8px; padding-top:4px}

/* ---------------------------------------------------------------------------
   10. ПУСТЫЕ / ОШИБОЧНЫЕ / ОФЛАЙН СОСТОЯНИЯ
   --------------------------------------------------------------------------- */
.empty-v2{display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:26px 14px}
.empty-v2 .ic{width:54px; height:54px; border-radius:50%; display:grid; place-items:center;
  background:var(--ov-06); border:1px solid var(--ov-12); color:var(--tx-3)}
.empty-v2 .ttl{font-size:var(--fs-15); font-weight:800; color:var(--tx-1)}
.empty-v2 .txt{font-size:var(--fs-12); color:var(--tx-3); max-width:34ch}
.err-v2{border-color:color-mix(in srgb, var(--coral) 34%, transparent)!important; background:linear-gradient(180deg,color-mix(in srgb, var(--coral) 10%, transparent),var(--ov-03))}
.err-v2 .code{font-family:ui-monospace,monospace; font-size:var(--fs-11); color:rgba(255,167,159,.9)}

/* ---------------------------------------------------------------------------
   11. СКЕЛЕТОНЫ: единая анимация и форма
   --------------------------------------------------------------------------- */
.skel{height:12px; border-radius:var(--rd-sm); background:var(--ov-08); overflow:hidden; position:relative}
.skel::after{
  content:""; position:absolute; inset:0; transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);
  animation:uxShimmer 1.5s infinite;
}
.skel-card{min-height:84px}
@keyframes uxShimmer{100%{transform:translateX(100%)}}

/* ---------------------------------------------------------------------------
   12. ОКНА v2: шапка с заголовком и закрытием, липкий футер
   --------------------------------------------------------------------------- */
.modal,.sheet{max-height:88%; display:flex; flex-direction:column; overflow:hidden}
.pop-hd{
  display:flex; align-items:flex-start; gap:10px; padding-bottom:10px;
  border-bottom:1px solid var(--ov-08); margin-bottom:12px;
}
.pop-hd .ttl{font-size:var(--fs-15); font-weight:800; color:var(--tx-1); line-height:1.25}
.pop-hd .sub{font-size:var(--fs-11); color:var(--tx-4); margin-top:2px}
.pop-hd .x{
  margin-left:auto; width:34px; height:34px; flex:none; border-radius:var(--rd-s); display:grid; place-items:center;
  background:var(--ov-06); border:1px solid var(--ov-12); color:var(--tx-2); cursor:pointer;
}.pop-ft{position:sticky; bottom:0; padding-top:10px; margin-top:10px; background:linear-gradient(180deg,transparent,rgba(12,20,34,.92) 40%)}
.pop-custom-body{overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin}
.pop-custom-body::-webkit-scrollbar{width:5px}
.pop-custom-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18); border-radius:var(--rd-pill)}

/* ---------------------------------------------------------------------------
   13. ТОСТЫ v2: действие и «отменить»
   --------------------------------------------------------------------------- */
.toast.action{pointer-events:auto}
.toast .t-act{
  margin-left:auto; flex:none; height:26px; padding:0 10px; border-radius:var(--rd-s);
  background:var(--ov-14); border:1px solid rgba(255,255,255,.2);
  color:var(--tx-1); font-size:var(--fs-11); font-weight:800; cursor:pointer;
}.toast .t-bar{position:absolute; left:0; bottom:0; height:2px; background:rgba(255,255,255,.4); animation:uxToastBar linear forwards}
@keyframes uxToastBar{from{width:0}to{width:100%}}

/* ---------------------------------------------------------------------------
   14. СПИСКИ, KPI, ГРАФИКИ
   --------------------------------------------------------------------------- */
.list{display:flex; flex-direction:column; gap:8px}
.list-row{
  display:flex; align-items:center; gap:var(--density-gap); padding:var(--density-row) var(--density-pad);
  border-radius:var(--rd-m); background:linear-gradient(180deg,var(--ov-07),var(--ov-03));
  border:1px solid rgba(255,255,255,.1); cursor:pointer; transition:transform var(--dur-1), background var(--dur-2);
}.list-row:active{transform:scale(.985)}
.list-row .chev{color:var(--tx-4); flex:none}

.kpi-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
.kpi{
  padding:12px; border-radius:var(--rd-m); background:linear-gradient(180deg,var(--ov-08),var(--ov-03));
  border:1px solid rgba(255,255,255,.1);
}
.kpi .l{font-size:var(--fs-11); color:var(--tx-3); font-weight:700; letter-spacing:.04em; text-transform:uppercase}
.kpi .v{font-size:var(--fs-22); font-weight:850; letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin-top:2px}
.kpi .d{font-size:var(--fs-11); color:var(--teal); margin-top:2px}
.kpi .d.neg{color:var(--coral-txt)}
.spark{display:flex; align-items:flex-end; gap:4px; height:34px}
.spark i{flex:1; border-radius:var(--rd-2xs) 3px 0 0; background:linear-gradient(180deg,color-mix(in srgb, var(--teal) 85%, transparent),color-mix(in srgb, var(--teal) 25%, transparent)); min-height:3px; transition:height var(--dur-4) var(--ease-std)}
.spark.coral i{background:linear-gradient(180deg,color-mix(in srgb, var(--coral) 85%, transparent),color-mix(in srgb, var(--coral) 25%, transparent))}

/* ---------------------------------------------------------------------------
   15. СЕГМЕНТЫ v2: прокрутка с растворением по краям
   --------------------------------------------------------------------------- */
.seg{position:relative}
.seg-wrap{position:relative}
.seg-wrap::after{
  content:""; position:absolute; right:2px; top:2px; bottom:2px; width:26px; pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(10,17,31,.85)); border-radius:0 var(--rd-m) var(--rd-m) 0; opacity:0;
  transition:opacity var(--dur-2);
}
.seg-wrap.scrollable::after{opacity:1}

/* ---------------------------------------------------------------------------
   16. ПЕРЕКЛЮЧАТЕЛИ: размеры и состояние
   --------------------------------------------------------------------------- */
.switch{position:relative; width:46px; height:32px; border-radius:var(--rd-pill); flex:none; cursor:pointer;
  background:var(--ov-12); border:1px solid var(--ov-16); transition:background var(--dur-2)}
.switch::after{content:""; position:absolute; top:2px; left:2px; width:26px; height:26px; border-radius:50%;
  background:#0B1220; box-shadow:0 1px 3px rgba(0,0,0,.5); transition:transform var(--dur-2) var(--ease-std)}
.switch.on{background:linear-gradient(180deg,color-mix(in srgb, var(--teal) 62%, #fff),var(--teal)); border-color:rgba(255,255,255,.3)}
.switch.on::after{transform:translateX(14px); background:var(--on-accent-2, var(--deep-teal))}

/* ---------------------------------------------------------------------------
   17. НАВИГАЦИЯ: активное состояние, тень, безопасная зона
   --------------------------------------------------------------------------- */
.nav{padding-bottom:env(safe-area-inset-bottom)}
.nav a{transition:color var(--dur-2), background var(--dur-2), transform var(--dur-1)}
/* точка-индикатор рядом с иконкой: таб без подписи, поэтому привязка к центру */
.nav a .dot{position:absolute; left:calc(50% + 9px); top:8px; width:6px; height:6px; border-radius:50%; background:var(--coral)}
.nav a{position:relative}

/* прогресс чтения экрана */
.ux-progress{position:absolute; left:0; right:0; top:0; height:2px; z-index:40; background:transparent}
.ux-progress i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--teal),var(--sky)); opacity:.85; transition:width 80ms linear}

/* тень у прилипшей шапки */
.scroll.at-top .tbar{box-shadow:none}
.scroll:not(.at-top) .tbar{
  position:sticky; top:0; z-index:20; margin:0 -16px 12px; padding:12px 16px;
  background:linear-gradient(180deg,rgba(10,17,31,.92),rgba(10,17,31,.72)); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--ov-07);
}

/* ---------------------------------------------------------------------------
   18. ПОЯВЛЕНИЕ ПРИ СКРОЛЛЕ (бюджет: максимум 3 анимации на экран)
   --------------------------------------------------------------------------- */
.rv{opacity:0; transform:translateY(10px); transition:opacity var(--dur-3) var(--ease-std), transform var(--dur-3) var(--ease-std)}
.rv.in{opacity:1; transform:none}
body.rm .rv{opacity:1; transform:none; transition:none}
@media (prefers-reduced-motion: reduce){
  .rv{opacity:1!important; transform:none!important; transition:none!important}
  .skel::after{animation:none}
}

/* ---------------------------------------------------------------------------
   19. ДОСТУПНОСТЬ: skip-link, фокус, скрытый текст
   --------------------------------------------------------------------------- */
.skip-link{
  position:absolute; left:12px; top:-60px; z-index:120; padding:10px 14px; border-radius:var(--rd-s);
  background:var(--sky); color:var(--on-accent-3, var(--deep-sea)); font-weight:800; font-size:var(--fs-12); text-decoration:none;
  transition:top var(--dur-2) var(--ease-std);
}
.skip-link:focus{top:12px}
#screen:focus{outline:none}
:focus-visible{outline:2px solid var(--sky); outline-offset:2px}
::selection{background:color-mix(in srgb, var(--sky) 30%, transparent)}

/* ---------------------------------------------------------------------------
   20. МИКРО-ДЕТАЛИ: разделители, стек аватаров, чипы-фильтры, бейджи
   --------------------------------------------------------------------------- */
.divider{height:1px; background:var(--ov-08); margin:var(--sp-3) 0}
.avatars{display:flex}
.avatars .ava{width:26px; height:26px; font-size:10.5px; margin-left:-8px; border:2px solid var(--bg1)}
.avatars .ava:first-child{margin-left:0}
.chip-bar{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; margin-bottom:var(--sp-2)}
.chip-bar::-webkit-scrollbar{display:none}
.chip-bar .chip{flex:0 0 auto}
.badge.b-soft{background:rgba(255,255,255,.09); color:var(--tx-2); border:1px solid var(--ov-12)}

/* плотность: компактный режим сжимает списки, но не тап-зоны */
:root[data-density="compact"] .list-row{padding:8px 12px}
:root[data-density="compact"] .sec{margin:14px 0 6px}
:root[data-density="compact"] .h1{font-size:24px}

/* ---------------------------------------------------------------------------
   21. UX-ЭКРАН: таблица метрик
   --------------------------------------------------------------------------- */
.ux-row{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--ov-06)}
.ux-row .nm{font-size:var(--fs-12); color:var(--tx-2); min-width:0}
.ux-row .vl{font-size:var(--fs-12); font-family:ui-monospace,monospace; color:var(--tx-1)}
.ux-row .ok{color:var(--teal)}
.ux-row .bad{color:var(--coral-txt)}
.ux-score{display:flex; align-items:baseline; gap:8px}
.ux-score b{font-size:var(--fs-28); letter-spacing:-.03em}

/* ---------------------------------------------------------------------------
   22. МАТЧ: HUD розыгрыша
   --------------------------------------------------------------------------- */
.ux-hud{margin-bottom:10px}
.hud-dot{
  width:9px; height:9px; border-radius:50%; display:inline-block;
  background:var(--ov-16); transition:background var(--dur-2), transform var(--dur-2);
}
.hud-dot.win{background:var(--teal); box-shadow:0 0 8px color-mix(in srgb, var(--teal) 60%, transparent)}
.hud-dot.lose{background:var(--coral); box-shadow:0 0 8px color-mix(in srgb, var(--coral) 50%, transparent)}
.hud-dot:not(.win):not(.lose){animation:hudIdle 2.4s ease-in-out infinite}
@keyframes hudIdle{0%,100%{opacity:.5}50%{opacity:.9}}

/* ---------------------------------------------------------------------------
   23. ПРОФИЛЬ: KPI и график формы
   --------------------------------------------------------------------------- */
.ux-kpi{margin-bottom:12px}
.ux-kpi .kpi-grid{margin-bottom:0}
.ux-kpi .spark{margin-top:2px}

/* ---------------------------------------------------------------------------
   24. БЕЙДЖИ (панель управления магазином и поиск по настройкам убраны —
     фильтры переехали в заголовок раздела, см. sectionHead/miniSelect)
   --------------------------------------------------------------------------- */
.badge{font-size:10.5px}

/* ---------------------------------------------------------------------------
   26. ФИНАЛЬНЫЕ ДЕТАЛИ: длинные тексты, кнопки в ряд, состояния
   --------------------------------------------------------------------------- */
.scroll .g>.small:last-child{max-width:60ch}
.btn-row .btn{min-width:0}
.btn-row .btn .btn-label{overflow:hidden; text-overflow:ellipsis}
.ux-state-block+.g{margin-top:8px}
.g.pad.ux-empty{padding:6px}
.g.pad.ux-skel{background:none; border:0; padding:0; margin-bottom:10px}

/* контраст в режиме высокой контрастности подхватывает новые токены */
html[data-contrast="high"]{--tx-2:#EEF4FC; --tx-3:#D6E2F3; --tx-4:#B9C9DE}
html[data-contrast="high"] .kpi .l,html[data-contrast="high"] .small.dim{color:var(--tx-3)}

/* ---------------------------------------------------------------------------
   27. УВЕДОМЛЕНИЯ И ЛИДЕРБОРД
   --------------------------------------------------------------------------- */
.ux-notif .sec{margin:12px 0 6px}
.ux-notif .sec h2{font-size:10.5px}
.ux-notif .list-row{margin-bottom:6px}
.ux-board{margin-bottom:12px}
.ux-board .seg{width:100%}
.ux-board .seg button{flex:1 1 0}

/* ---------------------------------------------------------------------------
   28. ПОДСКАЗКИ И СОСТОЯНИЯ ЗАГРУЗКИ
   --------------------------------------------------------------------------- */
.ux-hint{
  display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border-radius:var(--rd-m);
  background:linear-gradient(180deg,color-mix(in srgb, var(--sky) 14%, transparent),color-mix(in srgb, var(--sky) 5%, transparent));
  border:1px solid color-mix(in srgb, var(--sky) 28%, transparent); font-size:var(--fs-12); color:var(--tx-2);
}
.ux-hint .i{color:var(--sky); flex:none; margin-top:1px}
.ux-loading{display:flex; align-items:center; gap:8px; font-size:var(--fs-12); color:var(--tx-3)}
.ux-loading .sp{
  width:14px; height:14px; border-radius:50%; flex:none;
  border:2px solid color-mix(in srgb, var(--sky) 30%, transparent); border-top-color:var(--sky); animation:uxSpin .8s linear infinite;
}

/* ---------------------------------------------------------------------------
   29. ТРЕНИРОВКА: кольцо прогресса
   --------------------------------------------------------------------------- */
.ux-ring{margin-bottom:10px}
.ux-ring .ring{flex:none}
.ux-ring circle[stroke="var(--teal)"]{transition:stroke-dashoffset var(--dur-4) var(--ease-std)}

/* ---------------------------------------------------------------------------
   30. ФИНАЛЬНЫЕ ПРАВИЛА ЧИТАЕМОСТИ
   --------------------------------------------------------------------------- */
.kv{padding:5px 0}
.kv+.kv{border-top:1px solid var(--ov-05)}
.stat-b{padding:10px 12px}
.lr-sub,.lr-title{line-height:1.35}
.badge{letter-spacing:.03em}

/* ============================================================================
   36. АКЦЕНТЫ СЛЕДУЮ ТОКЕНАМ ТЕМЫ
   В head.part кнопки, бейджи и полосы закрашены захардкоженными кораллом /
   тилом / ски, поэтому смена акцента в теме до них не доходила. Здесь те же
   заливки выводятся из var(--coral / --teal / --sky) через color-mix: если
   браузер color-mix не умеет, объявление отбрасывается и остаётся базовый
   градиент — деградация без костылей. Текст на заливке берётся из --on-accent
   (его считает applyTheme по яркости акцента).
   ============================================================================ */
.btn.coral{background:linear-gradient(180deg, color-mix(in srgb, var(--coral) 74%, #fff), var(--coral) 52%, color-mix(in srgb, var(--coral) 78%, #000));
  border-color:color-mix(in srgb, var(--coral) 40%, #fff); color:var(--on-accent, #fff);
  box-shadow:0 12px 30px color-mix(in srgb, var(--coral) 34%, transparent), inset 0 1px 0 rgba(255,255,255,.42)}
.btn.teal{background:linear-gradient(180deg, color-mix(in srgb, var(--teal) 74%, #fff), var(--teal) 52%, color-mix(in srgb, var(--teal) 78%, #000));
  border-color:color-mix(in srgb, var(--teal) 40%, #fff); color:var(--on-accent-2, var(--on-accent-2, var(--deep-teal)));
  box-shadow:0 12px 30px color-mix(in srgb, var(--teal) 30%, transparent), inset 0 1px 0 rgba(255,255,255,.42)}
.btn.sky{background:linear-gradient(180deg, color-mix(in srgb, var(--sky) 74%, #fff), var(--sky) 52%, color-mix(in srgb, var(--sky) 78%, #000));
  border-color:color-mix(in srgb, var(--sky) 40%, #fff); color:var(--on-accent-3, var(--on-accent-3, var(--deep-sea)));
  box-shadow:0 12px 30px color-mix(in srgb, var(--sky) 30%, transparent), inset 0 1px 0 rgba(255,255,255,.42)}

.b-coral{background:color-mix(in srgb, var(--coral) 16%, transparent); color:color-mix(in srgb, var(--coral) 58%, #fff); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--coral) 32%, transparent)}
.b-teal{background:color-mix(in srgb, var(--teal) 15%, transparent); color:color-mix(in srgb, var(--teal) 58%, #fff); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--teal) 30%, transparent)}
.b-sky{background:color-mix(in srgb, var(--sky) 15%, transparent); color:color-mix(in srgb, var(--sky) 58%, #fff); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--sky) 30%, transparent)}

.chip.on{background:color-mix(in srgb, var(--coral) 17%, transparent); border-color:color-mix(in srgb, var(--coral) 44%, transparent); color:color-mix(in srgb, var(--coral) 56%, #fff)}

/* мягкие (вторичные) варианты — тоже из токенов, иначе ценовые чипы
   остаются лососёвыми при любом акценте */
.btn.coral-soft{background:linear-gradient(180deg, color-mix(in srgb, var(--coral) 24%, transparent), color-mix(in srgb, var(--coral) 13%, transparent));
  border-color:color-mix(in srgb, var(--coral) 42%, transparent); color:color-mix(in srgb, var(--coral) 38%, #fff)}

  border-color:color-mix(in srgb, var(--teal) 40%, transparent); color:color-mix(in srgb, var(--teal) 38%, #fff)}

.bar>i{background:linear-gradient(90deg, var(--teal), var(--sky)); box-shadow:0 0 12px color-mix(in srgb, var(--teal) 42%, transparent)}
.bar.coral>i{background:linear-gradient(90deg, color-mix(in srgb, var(--coral) 72%, #fff), var(--coral)); box-shadow:0 0 12px color-mix(in srgb, var(--coral) 42%, transparent)}

/* фон экрана внутри телефона и свечение активного таба — в head.part они
   зафиксированы тёмно-синими/коралловыми, из-за чего тема не становилась
   единой: под экраном проглядывал чужой navy */
.screen{background:
  radial-gradient(620px 420px at 50% -6%, color-mix(in srgb, var(--sky) 14%, transparent), transparent 62%),
  radial-gradient(540px 420px at 100% 100%, color-mix(in srgb, var(--coral) 9%, transparent), transparent 60%),
  linear-gradient(180deg, var(--bg2), var(--bg1) 58%, var(--bg1))}
.nav a.on .i{filter:drop-shadow(0 0 8px color-mix(in srgb, var(--coral) 55%, transparent))}
.rail button.on{background:linear-gradient(180deg, color-mix(in srgb, var(--coral) 22%, transparent), color-mix(in srgb, var(--coral) 10%, transparent));
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--coral) 35%, transparent)}

/* 37. ПОДЛОЖКИ, КОТОРЫЕ ОСТАВАЛИСЬ «СТАРЫМИ»
   Навигация, аватар, кольцо нотификейна и гема в head.part закрашены
   конкретными navy-значениями (var(--surface), var(--bg1), var(--sky)) — они не менялись
   ни при какой теме и выдавали «разные страницы». --blob-blur / --blob-op —
   ручки интенсивности световых пятен, их крутит панель под телефоном. */
.nav{background:linear-gradient(180deg, color-mix(in srgb, var(--surface) 86%, transparent), color-mix(in srgb, var(--bg1) 94%, transparent))}
.ava{background:linear-gradient(160deg, color-mix(in srgb, var(--surface) 84%, #fff), color-mix(in srgb, var(--bg1) 72%, var(--surface)))}
.ava .st{border-color:var(--bg1)}

.iconbtn .dot{box-shadow:0 0 0 2px var(--bg1)}
.wallet{background:color-mix(in srgb, var(--surface) 78%, var(--ov-06))}
.art .blob{filter:blur(var(--blob-blur, 24px)); opacity:var(--blob-op, .55)}

/* 38. РУЧКИ ТОНКОЙ НАСТРОЙКИ (панель под телефоном)
   applyTheme вычисляет --glass-blur / --glow-* / --tab-glow / --plate-* из
   THEME; здесь эти токены подставляются в конкретные свойства. В var() стоит
   фолбэк «как в head.part», поэтому без JS картинка не меняется. */
.g,.btn,.iconbtn,.matchbar{backdrop-filter:blur(var(--glass-blur, 18px)) saturate(1.15)}
/* подложку меню слегка подкрашиваем кораллом: раньше висело нейтрально-синим
   пятном рядом с красными акцентами и выбивалось из палитры. --plate-*
   от ручки «Подложки нав/топ» при этом продолжает работать */
.nav{background:linear-gradient(180deg, color-mix(in srgb, var(--coral) 8%, var(--plate-1, rgba(18,28,46,.88))), color-mix(in srgb, var(--coral) 4%, var(--plate-2, rgba(7,11,20,.95))))}
.btn.coral{box-shadow:var(--glow-coral, 0 10px 26px color-mix(in srgb, var(--coral) 30%, transparent)), inset 0 1px 0 rgba(255,255,255,.45)}
.btn.teal{box-shadow:var(--glow-teal, 0 10px 26px color-mix(in srgb, var(--teal) 26%, transparent)), inset 0 1px 0 rgba(255,255,255,.45)}
.btn.sky{box-shadow:var(--glow-sky, 0 10px 26px color-mix(in srgb, var(--sky) 26%, transparent)), inset 0 1px 0 rgba(255,255,255,.45)}

.bar>i{box-shadow:0 0 calc(12px * var(--glow-k, 1)) color-mix(in srgb, var(--teal) calc(42% * var(--glow-k, 1)), transparent)}

/* hover-эффекты только для устройств с курсором: на тач-экранах 
   :hover залипает после тапа и даёт лишнюю подсветку */
@media (hover:hover) and (pointer:fine){

.toast .t-act:hover{background:rgba(255,255,255,.24)}

.iconbtn:hover{background:rgba(255,255,255,.1)}}
</style>
<style>

<style>

   39. ХАБ: HERO-КАРУСЕЛЬ, ПУШ-ПРИГЛАШЕНИЕ, РЕФЕРАЛКА, ВАРИАНТЫ СЕТКИ

  transition:transform 240ms var(--ease-out)}
.push-inv.swiping .pi-face{transition:none}
.pi-face .pi-timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:11px;color:var(--sky)}
.pi-arrow{width:34px;height:34px;flex:none;border-radius:var(--rd-s);display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--brd-2);background:color-mix(in srgb, var(--surface) 80%, transparent);color:var(--mut);
  transition:transform var(--t-press) var(--ease-out),background .2s,color .2s}
.pi-arrow:active{transform:scale(.9)}
.pi-arrow.accept{background:color-mix(in srgb, var(--teal) 18%, transparent);border-color:color-mix(in srgb, var(--teal) 40%, transparent);color:var(--teal)}
.pi-hint{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--dim);white-space:nowrap}
.pi-chips{display:none;gap:6px;flex-wrap:wrap;padding:0 2px 8px}
.push-inv.reply .pi-chips{display:flex}
.push-inv.reply{max-height:150px}
.pi-chip{border:1px solid var(--brd-2);border-radius:var(--rd-pill);background:color-mix(in srgb, var(--surface) 80%, var(--ov-05));
  color:var(--mut);font-size:11px;font-weight:700;padding:6px 11px;cursor:pointer;transition:transform var(--t-press) var(--ease-out),border-color .2s,color .2s}
.pi-chip:active{transform:scale(.95)}
/* ---- реферальная панель: раскрывается на месте из кнопки в блоке друзей ---- */
#hubInviteBtn .i{transition:transform .28s var(--ease-out)}
#hubInviteBtn.is-open{background:linear-gradient(180deg, color-mix(in srgb, var(--coral) 24%, transparent), color-mix(in srgb, var(--coral) 12%, transparent));
  border-color:color-mix(in srgb, var(--coral) 45%, transparent); color:color-mix(in srgb, var(--coral) 45%, #fff)}
#hubInviteBtn.is-open .i{transform:rotate(20deg) scale(.92)}
.rp-link{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:var(--rd-s);
  background:color-mix(in srgb, var(--bg1) 70%, transparent);border:1px dashed color-mix(in srgb, var(--sky) 45%, transparent)}
.rp-link code{font:700 11px/1.3 var(--font-mono, ui-monospace, monospace);color:var(--sky);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}

/* ---- панель «пригласить» в блоке друзей (раскрытие на месте) ---- */
.inv-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows 300ms var(--ease-out)}
.inv-panel>div{overflow:hidden}
.inv-panel.open{grid-template-rows:1fr}
.inv-panel .ip-card{margin-top:8px;padding:11px;border-radius:var(--r-s);
  background:linear-gradient(180deg, color-mix(in srgb, var(--surface) 82%, transparent), color-mix(in srgb, var(--bg1) 92%, transparent));
  border:1px solid var(--brd)}
.inv-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:var(--rd-s);cursor:pointer;transition:background .18s}.inv-row .ava{width:30px;height:30px;font-size:10.5px}

/* ---- варианты верстки хаба: tall / duo / narrow ---- */
.hub-start{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:12px}
[data-hub-layout="tall"] .hub-start{grid-template-columns:1fr}
[data-hub-layout="narrow"] .hub-start{grid-template-columns:1fr;width:72%}
.hub-stats{display:grid;gap:8px;grid-template-columns:1fr 1fr 1fr}
.hub-stats .hs{padding:9px 10px;border-radius:var(--r-s);text-align:center;
  background:linear-gradient(180deg, color-mix(in srgb, var(--surface) 78%, transparent), color-mix(in srgb, var(--bg1) 92%, transparent));
  border:1px solid var(--brd)}
.hub-stats .hs b{display:block;font-size:15px;letter-spacing:-.02em}
.hub-stats .hs span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
[data-hub-layout="narrow"] .hub-stats{grid-template-columns:1fr 1fr}

/* ===================== Слой после 120 анализов =====================
   Утилитарные классы: 379 мест вида style="font-size:12.5px" свёрнуты в
   классы. Блок стоит в конце каскада — как и инлайн-стиль, поэтому вид
   не меняется там, где размер был задан вручную. */
:root{--ui-t1:11px;--ui-t2:12px;--ui-t3:12.5px;--ui-t4:13px;--ui-t5:14px}
.u-t-xxs{font-size:var(--ui-t1)}.u-t-xs{font-size:var(--ui-t2)}.u-t-s{font-size:var(--ui-t3)}
.u-t-m{font-size:var(--ui-t4)}.u-t-l{font-size:var(--ui-t5)}
.u-minw0{min-width:0}.u-grow{flex:1}.u-full{width:100%}.u-between{justify-content:space-between}
.u-mb8{margin-bottom:8px}.u-mb10{margin-bottom:10px}.u-mt8{margin-top:8px}
.u-g6{gap:6px}.u-g8{gap:8px}.u-g10{gap:10px}.u-wrap{flex-wrap:wrap}.u-center{text-align:center}

/* заглушки состояний: раньше disabled нигде не был описан */
button:disabled,[disabled],.u-dis{opacity:.45;pointer-events:none;filter:saturate(.45)}
button:not(:disabled):active,[role="button"]:active{transform:scale(.97)}

/* крупная типографика масштабируется по вьюпорту, а не сидит на 28px */
.h1{font-size:clamp(22px,6.4vw,28px)}

/* подписи под цифрами — основной читаемый текст, нужен leading */
.stat-b .d,.note,.sub,.chat-bubble,.row .s{line-height:1.42}

/* hover-эффекты только для устройств с курсором: на тач-экранах 
   :hover залипает после тапа и даёт лишнюю подсветку */
@media (hover:hover) and (pointer:fine){
.pi-chip:hover{border-color:color-mix(in srgb, var(--sky) 55%, transparent);color:var(--ink)}
.inv-row:hover{background:var(--ov-06)}}

/* Слои-оверлеи: один и тот же белый поверх тёмной плашки встречался 
   90+ раз литералом rgba(255,255,255,.0X). Теперь это шкала --ov-*. */
:root{--ov-03:rgba(255,255,255,.03);--ov-04:rgba(255,255,255,.04);--ov-05:rgba(255,255,255,.05);--ov-06:rgba(255,255,255,.06);--ov-07:rgba(255,255,255,.07);--ov-08:rgba(255,255,255,.08);--ov-10:rgba(255,255,255,.10);--ov-12:rgba(255,255,255,.12);--ov-14:rgba(255,255,255,.14);--ov-16:rgba(255,255,255,.16)}

/* Малые радиусы: 1-3 px = --rd-2xs, 4-7 = --rd-xs, 8-10 = --rd-sm, pills = --rd-pill.
   До этого в CSS лежало 51 литерального значения, и радиусы не слушались ползунка темы. */
:root{--rd-2xs:3px;--rd-xs:6px;--rd-sm:8px;--rd-pill:999px}
/* Новые цвета палитры были захардкожены в градиентах — вынесены, чтобы тема их перекрывала */
:root{--deep-teal:#04231f;--deep-sea:#03202e;--gold-soft:#ffd98a;--ice:#eaf1fa;--mist:#c7d4e6}

.u-top{align-items:flex-start}.u-fc{display:flex;align-items:center}
.u-fcb{display:flex;align-items:center;justify-content:space-between}
/* Задания: раньше каждый квест был отдельной карточкой — список растягивался
   на 3.2 экрана. Теперь одна карточка, строки разделены волосяными линиями. */
.q-list .q-item{padding:10px 0;border-bottom:1px solid var(--brd);align-items:flex-start}
.q-list .q-item:first-child{padding-top:0}
.q-list .q-item:last-child{border-bottom:0;padding-bottom:0}
.q-list .q-item .bar{height:4px}

function loadState() {
  try { const raw = localStorage.getItem('ttu-state-v1'); if (raw) return { ...DEFAULTS, ...JSON.parse(raw) }; } catch (e) {}
  return { ...DEFAULTS };
}
function saveState() { try { localStorage.setItem('ttu-state-v1', JSON.stringify(S)); } catch (e) {} }
function setState(patch) { S = { ...S, ...patch }; saveState(); applyGlobalFlags(); }

function applyGlobalFlags() {
  document.body.classList.toggle('rm', !!S.reducedMotion);
  document.documentElement.dataset.contrast = S.highContrast ? 'high' : 'normal';
}

/* haptics */
function haptic(kind = 'light') {
  if (!S.vibro) return;
  try {
    if (TG && TG.HapticFeedback) {
      if (kind === 'success' || kind === 'error' || kind === 'warning') TG.HapticFeedback.notificationOccurred(kind);
      else TG.HapticFeedback.impactOccurred(kind === 'heavy' ? 'medium' : 'light');
    } else if (navigator.vibrate) navigator.vibrate(kind === 'heavy' ? 18 : 8);
  } catch (e) {}
}

/* компактный select для фасетных фильтров в заголовке раздела.
   нативный контрол короче и привычнее, чем 5 кнопок сегмента во всю ширину */
function miniSelect(group, label, opts, cur) {
  return `<select class="sel-mini" data-sel="${group}" data-refresh aria-label="${label}" onchange="selPick(this)">${
    opts.map(([v, t]) => `<option value="${v}"${String(v) === String(cur) ? ' selected' : ''}>${t}</option>`).join('')}</select>`;
}

/* FAB «Играть» убран из меню: пустая подложка ломала сетку табов,
   а клик по нему уводил на online-entry без нижнего меню.
   Быстрый вход в онлайн — кнопки на экране «Хаб».
   Подписи табов убраны: иконки читаются быстрее, текст — лишний шум.
   Профиль вынесен из навигации: он открывается тапом по аватарке
   в топбаре, а его раздел настроек живёт в табе-шестерёнке. */
const NAV_TABS = [
  { id: 'hub', label: 'Хаб', icon: 'home' },
  { id: 'tournaments', label: 'Турниры', icon: 'trophy' },
  { id: 'shop', label: 'Магазин', icon: 'shop' },
  { id: 'settings', label: 'Настройки', icon: 'gear' }
];
function bottomNav(active = 'hub') {
  return `<nav class="nav" role="tablist" aria-label="Основная навигация">${NAV_TABS.map(t =>
    `<a class="${active === t.id ? 'on' : ''}" role="tab" aria-selected="${active === t.id ? 'true' : 'false'}" aria-label="${t.label}" title="${t.label}" tabindex="0" onclick="go('${t.id}')">${ico(t.icon, 'i i-24')}</a>`
  ).join('')}</nav>`;
}
/* Табы без подписей, и название держится только в aria-label: `<a>` нативно
   с клавиатуры не «нажимается», поэтому Enter/Space ловим делегированием. */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target && e.target.closest && e.target.closest('.nav a[role="tab"], [onclick][role="button"]');
  if (!el) return;
  /* у нативных <button>/<a> Enter и так работает, а пробел ещё и скроллит */
  if (el.tagName === 'BUTTON') return;
  if (el.tagName === 'A' && !el.classList.contains('nav') && !(e.target.closest('.nav'))) return;
  e.preventDefault(); el.click();
});

/* ---------- роутер ---------- */
let CURRENT = null;
const SCREEN_REGISTRY = [];
function defineScreen(def) { SCREEN_REGISTRY.push(def); }

function renderScreen(id) {
  const def = SCREEN_REGISTRY.find(s => s.id === id) || SCREEN_REGISTRY[0];
  CURRENT = def.id;
  const host = $('#screen');
  const nav = typeof def.nav === 'string' ? def.nav : (def.nav ? def.id : '');
  host.innerHTML = `<div class="screen enter">${def.render()}</div>`;
  if (nav) host.querySelector('.screen').insertAdjacentHTML('beforeend', bottomNav(nav));
  renderRailActive();
  // прогрессивная подстановка «живых» значений
  if (def.after) def.after();
}
function go(id, opts = {}) { if (!SCREEN_REGISTRY.some(s => s.id === id)) { toast('Экран в разработке: ' + id, 'warn'); return; } closePop(true); renderScreen(id); const sc = $('#screen .scroll'); if (sc) sc.scrollTop = 0; }
window.go = go;

function openPop(id, vars = {}) {
  if (!POPUP_DEFS[id]) { toast('Попап ' + id + ' не найден', 'warn'); return; }
  if (RALLY_LOCKED && !POPUP_DEFS[id].lockIgnore) { return; }         // запрет во время розыгрыша
  if (popOpenId) { popQueue = [id]; return; }                          // очередь максимум 1
  popOpenId = id;
  const def = POPUP_DEFS[id];
  const host = $('#overlay');

  if (def.kind === 'toast') { toastFromDef(def, id); popOpenId = null; return; }
  if (def.kind === 'flash') { flashCard(def.tone); popOpenId = null; return; }
  if (def.kind === 'frame') { frameGlow(); popOpenId = null; return; }
  if (def.kind === 'countdown') { runCountdown(); popOpenId = null; return; }
  if (def.kind === 'banner') { bannerIn(def, id); return; }

  const strings = def.text ? popStrings(def.text, { ...(def.vars ? def.vars() : {}), ...vars }) : { title: '', text: '', primary: '', secondary: '' };
  const isSheet = def.kind === 'sheet';

  /* окна с собственным содержимым (def.render) — панели, списки, формы */
  if (typeof def.render === 'function') {
    let body = '';
    try { body = def.render(); } catch (err) { body = '<div class="small dim">Не удалось открыть окно</div>'; }
    host.innerHTML = `
      <div class="ovl ${isSheet ? '' : 'mid'}" id="ovlRoot" onclick="if(event.target.id==='ovlRoot') closePop()">
        <div class="${isSheet ? 'sheet' : 'modal'} pop-custom" role="dialog" aria-modal="true">
          ${isSheet ? '<div class="handle"></div>' : ''}
          <div class="pop-custom-body">${body}</div>
        </div>
      </div>`;
    if (def.confetti) confettiBurst();
    if (def.autoClose) setTimeout(() => closePop(), def.autoClose);
    return;
  }
  host.innerHTML = `
    <div class="ovl ${isSheet ? '' : 'mid'}" id="ovlRoot" onclick="if(event.target.id==='ovlRoot') closePop()">
      <div class="${isSheet ? 'sheet' : 'modal'}">
        ${isSheet ? '<div class="handle"></div>' : ''}
        <div class="m-ico">${ico(def.icon, 'i i-24')}</div>
        <h3 class="pop-title">${strings.title}</h3>
        <p class="pop-text">${strings.text}</p>
        ${S.lang === 'ru' && EN.pop[def.text] ? `<p class="pop-en">EN · ${popStringsEn(def)}</p>` : ''}
        <div class="btn-row">
          ${strings.primary ? `<button class="btn ${def.tone === 'err' ? 'ghost' : 'coral'}" onclick="popPrimary('${id}')">${strings.primary}</button>` : ''}
          ${strings.secondary ? `<button class="btn ghost" onclick="popSecondary('${id}')">${strings.secondary}</button>` : ''}
        </div>
        ${def.kind === 'modal' && !strings.secondary && !strings.primary ? `<button class="btn ghost" onclick="closePop()">Закрыть</button>` : ''}
      </div>
    </div>`;
  if (def.confetti) confettiBurst();
  if (def.autoClose) setTimeout(() => closePop(), def.autoClose);
}
window.openPop = openPop;

function popStringsEn(def) {
  const v = EN.pop[def.text] || [];
  if (!v.length) return '';
  const vars = def.vars ? def.vars() : {};
  const f = (str) => String(str || '').replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : k));
  return [f(v[0]), f(v[1])].filter(Boolean).join(' · ');
}
function popPrimary(id) { const d = POPUP_DEFS[id]; haptic('light'); d.primary ? d.primary() : closePop(); }
function popSecondary(id) { const d = POPUP_DEFS[id]; d.secondary ? d.secondary() : closePop(); }
window.popPrimary = popPrimary; window.popSecondary = popSecondary;

function closePop(instant = false) {
  const host = $('#overlay');
  if (!host.firstElementChild) { popOpenId = null; return; }
  if (instant) { host.innerHTML = ''; popOpenId = null; nextPop(); return; }
  const root = $('#ovlRoot'); if (root) root.classList.add('closing');
  setTimeout(() => { host.innerHTML = ''; popOpenId = null; nextPop(); }, 180);
}
window.closePop = closePop;
function nextPop() { if (popQueue.length && !popOpenId) { const id = popQueue.shift(); openPop(id); } }

/* toast */
function toast(text, type = 'ok', ms = 2200) {
  const host = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (type === 'ok' ? '' : type);
  el.innerHTML = `<span class="tico">${ico(type === 'ok' ? 'check' : type === 'warn' ? 'warn' : 'x', 'i i-16')}</span><span>${text}</span>`;
  host.appendChild(el);
  if (ms > 0) setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 200); }, ms);
  haptic(type === 'ok' ? 'light' : type);
}
window.toast = toast;
function toastFromDef(def, id) {
  const s = popStrings(def.text, def.vars ? def.vars() : {});
  toast(s.title + (s.text ? ' — ' + s.text : ''), def.tone === 'err' ? 'err' : 'ok', def.autoClose || 2400);
}
function bannerIn(def, id) {
  const s = popStrings(def.text, def.vars ? def.vars() : {});
  const host = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.background = 'linear-gradient(180deg,color-mix(in srgb, var(--coral) 28%, transparent),rgba(30,20,30,.95))';
  el.style.borderColor = 'var(--coral)';
  el.innerHTML = `<span class="tico">${ico(def.icon, 'i i-16')}</span>
    <div class="u-minw0 grow"><b class="u-t-xs">${s.title}</b><div class="small dim">${s.text}</div></div>
    <button class="btn xs coral" onclick="go('pre-match')">${s.primary || 'OK'}</button>`;
  host.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 200); }, 8000);
  popOpenId = null;
}
function flashCard(tone) {
  const host = $('#screen'); if (!host) return;
  const f = document.createElement('div'); f.className = 'flash';
  f.style.background = tone === 'coral' ? 'radial-gradient(circle at 50% 45%,color-mix(in srgb, var(--coral) 55%, transparent),transparent 62%)' : 'radial-gradient(circle at 50% 45%,color-mix(in srgb, var(--teal) 50%, transparent),transparent 62%)';
  host.appendChild(f); setTimeout(() => f.remove(), 500);
}
function frameGlow() {
  const sc = $('#screen .screen'); if (!sc) return;
  // keyframes WAAPI var() не раскрывает — берём конкретный цвет из темы
  const on = themeRgba('--coral', .5), off = themeRgba('--coral', 0);
  sc.animate([{ boxShadow: `inset 0 0 0 0 ${off}` }, { boxShadow: `inset 0 0 60px 8px ${on}` }, { boxShadow: `inset 0 0 0 0 ${off}` }], { duration: 1400, iterations: 2 });
}
function confettiBurst() {
  const host = $('#overlay'); if (!host) return;
  const wrap = document.createElement('div'); wrap.className = 'confetti';
  const colors = ['var(--coral)', 'var(--teal)', 'var(--sky)', 'var(--gold)', 'var(--violet)'];
  for (let i = 0; i < 26; i++) {
    const p = document.createElement('i');
    p.style.left = (6 + Math.random() * 88) + '%'; p.style.top = '-16px';
    p.style.background = colors[i % colors.length];
    p.style.animationDelay = (Math.random() * 0.35) + 's';
    p.style.animationDuration = (1.1 + Math.random() * 0.7) + 's';
    p.style.transform = `rotate(${Math.random() * 180}deg)`;
    wrap.appendChild(p);
  }
  host.appendChild(wrap);
  setTimeout(() => wrap.remove(), 2000);
}
function runCountdown() {
  const host = $('#overlay');
  host.innerHTML = `<div class="ovl mid" style="background:transparent;pointer-events:none">
    <div class="u-center count-pop">
      <div id="cdNum" style="font-size:84px;font-weight:900;letter-spacing:-.05em;background:linear-gradient(180deg,#fff,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 30px color-mix(in srgb, var(--teal) 50%, transparent))">3</div>
      <div class="small dim">${PLATFORM.mobile ? 'Приготовься' : 'Приготовься · M1 — удар'}</div>
    </div></div>`;
  let n = 3;
  const step = () => {
    const el = $('#cdNum'); if (!el) return;
    if (n === 0) { el.textContent = 'GO'; el.style.animation = 'pulse .4s ease-out'; haptic('success'); setTimeout(() => { host.innerHTML = ''; popOpenId = null; nextPop(); }, 420); return; }
    el.textContent = n; el.animate([{ transform: 'scale(1.5)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }, { transform: 'scale(1.06)', opacity: 1 }], { duration: 420, easing: 'cubic-bezier(.16,1,.3,1)' });
    haptic('light'); n--; setTimeout(step, 700);
  };
  step();
}
function countUp(el, to, ms = 900) {
  const from = 0; const t0 = performance.now();
  const tick = (t) => { const p = Math.min(1, (t - t0) / ms); el.textContent = Math.round(from + (to - from) * p); if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

/* уведомления */
function readNotif(id) {
  const n = NOTIFS.find(x => x.id === id); if (!n) return;
  n.unread = false; S.unread = NOTIFS.filter(x => x.unread).length; saveState();

}
function readAll() {
  NOTIFS.forEach(n => n.unread = false); S.unread = 0; saveState(); openPop('notifPanel'); toast('Все уведомления прочитаны');
}

/* ============================================================
   PERFORMANCE: FPS-контроль и автоснижение качества
   ============================================================ */
let QUALITY = S.motionLevel;
let lowFramesSince = 0;
function startFpsWatch() {
  let last = performance.now(), frames = 0, fps = 60;
  const badge = $('#railList') ? document.createElement('div') : null;
  const meter = document.createElement('div');
  meter.id = 'perfMeter';
  meter.className = 'perf-meter';
  meter.setAttribute('role', 'status');
  meter.setAttribute('aria-label', 'Счётчик кадров');
  meter.title = 'Счётчик FPS · P — скрыть';
  meter.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:9999;font:600 10px/1 ui-monospace,monospace;color:#8FA6C4;background:rgba(11,18,32,.72);border:1px solid rgba(255,255,255,.12);padding:5px 7px;border-radius:8px;backdrop-filter:blur(8px)';
  meter.textContent = 'FPS 60';
  document.body.appendChild(meter);
  const loop = (t) => {
    frames++;
    if (t - last >= 1000) {
      fps = Math.round(frames * 1000 / (t - last)); frames = 0; last = t;
      meter.textContent = 'FPS ' + fps + (QUALITY !== 'high' ? ' · ' + QUALITY : '');
      meter.style.color = fps < 45 ? '#FF7166' : fps < 55 ? '#FBBF24' : '#8FA6C4';
      if (fps < 45) { lowFramesSince += 1; if (lowFramesSince >= 3) autoDegrade(); } else lowFramesSince = 0;
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
function autoDegrade() {
  const order = ['high', 'medium', 'low'];
  const i = order.indexOf(QUALITY);
  if (i < order.length - 1) {
    QUALITY = order[i + 1];
    document.documentElement.dataset.quality = QUALITY;
    if (QUALITY === 'low') document.body.classList.add('lite');
    if (QUALITY === 'medium') document.body.classList.add('rm');
    toast('FPS < 45 · качество эффектов снижено до «' + (QUALITY === 'medium' ? 'среднего' : 'низкого') + '»', 'warn');
  }
  lowFramesSince = 0;
}
