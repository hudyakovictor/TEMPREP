/* ============================================================
   ПАНЕЛЬ ТЕМЫ: все цвета и стиль через CSS-переменные
   ============================================================ */
/* Дефолт — палитра по лого «Table Tennis Ultimate»: красная накладка
   ракетки как главный акцент, лучи арены (циан и синий) как вторичные,
   угольно-синие поверхности. Оттенки в фоне — сверху синь, снизу лёгкий
   красный. Прежняя арена доступна пресетом arena. */
const THEME_DEFAULTS = { bg1:'#070B14', bg2:'#0B1322', surface:'#121C2E', accent:'#E23B2E', accent2:'#35C6F4', accent3:'#2C7BF0', ink:'#F2F6FF', gold:'#FBBF24', violet:'#A78BFA', lime:'#A3E635', radius:20, blur:18, alpha:0.055, bw:1, depth:1, glow:1, plate:1, blobOp:0.55, blobBlur:24 };
const THEME_PRESETS = {
  logo:   { accent:'#E23B2E', accent2:'#35C6F4', accent3:'#2C7BF0', bg1:'#070B14', bg2:'#0B1322', surface:'#121C2E' },
  carbon: { accent:'#E23A57', accent2:'#23C48E', accent3:'#1E9BFF', bg1:'#101219', bg2:'#171A23', surface:'#22252F' },
  arena:  { accent:'#FF7166', accent2:'#2DD4BF', accent3:'#38BDF8', bg1:'#0A1020', bg2:'#0E1A2E', surface:'#131E3A' },
  teal:   { accent:'#2DD4BF', accent2:'#38BDF8', accent3:'#FF7166', bg1:'#081A1C', bg2:'#0C2530', surface:'#0F2B33' },
  ember:  { accent:'#FF8A5B', accent2:'#FBBF24', accent3:'#FF7166', bg1:'#170E14', bg2:'#241318', surface:'#2A1820' },
  indigo: { accent:'#38BDF8', accent2:'#A78BFA', accent3:'#2DD4BF', bg1:'#0A1026', bg2:'#111A3A', surface:'#151F44' },
  ice:    { accent:'#38BDF8', accent2:'#2DD4BF', accent3:'#FF7166', bg1:'#0B1A28', bg2:'#122436', surface:'#16303F' }
};
let THEME = (() => {
  try { const raw = localStorage.getItem('ttu-theme-v1'); return raw ? { ...THEME_DEFAULTS, ...JSON.parse(raw) } : { ...THEME_DEFAULTS }; }
  catch (e) { return { ...THEME_DEFAULTS }; }
})();

/* Тёмный или светлый текст поверх заливки цвета. Берём относительную
   яркость по WCAG и сравниваем контраст к белому и к угольному; белый
   выигрывает, если не проигрывает больше 1.2 единицы — так малиновый
   остаётся с белым текстом (как в референсе), а мята/лазурь/золото
   получают тёмный. */
function inkOn(hex) {
  const c = String(hex || '').replace('#', '');
  const n = c.length === 3 ? c.split('').map((x) => x + x).join('') : c;
  if (n.length < 6) return '#FFFFFF';
  const lin = (v) => { const s = v / 255; return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4); };
  const L = 0.2126 * lin(parseInt(n.slice(0, 2), 16)) + 0.7152 * lin(parseInt(n.slice(2, 4), 16)) + 0.0722 * lin(parseInt(n.slice(4, 6), 16));
  const onWhite = 1.05 / (L + 0.05);
  const onDark = (L + 0.05) / 0.057;      // #151214 имеет яркость ~0.007
  return onWhite + 1.2 >= onDark ? '#FFFFFF' : '#151214';
}

function rgbaOf(hex, a) {
  const c = String(hex || '').replace('#', '');
  const n = c.length === 3 ? c.split('').map((x) => x + x).join('') : c;
  if (n.length < 6) return hex;
  return `rgba(${parseInt(n.slice(0, 2), 16)},${parseInt(n.slice(2, 4), 16)},${parseInt(n.slice(4, 6), 16)},${a})`;
}

function applyTheme(save = true) {
  const r = document.documentElement.style;
  r.setProperty('--bg1', THEME.bg1);
  r.setProperty('--bg2', THEME.bg2);
  r.setProperty('--bg3', THEME.bg1);
  r.setProperty('--surface', THEME.surface);
  r.setProperty('--ink', THEME.ink);
  r.setProperty('--accent', THEME.accent);
  r.setProperty('--coral', THEME.accent);
  r.setProperty('--teal', THEME.accent2);
  r.setProperty('--sky', THEME.accent3);
  r.setProperty('--on-accent', inkOn(THEME.accent));
  r.setProperty('--on-accent-2', inkOn(THEME.accent2));
  r.setProperty('--on-accent-3', inkOn(THEME.accent3));
  r.setProperty('--r', THEME.radius + 'px');
  r.setProperty('--r-s', Math.round(THEME.radius * 0.7) + 'px');
  r.setProperty('--r-l', Math.round(THEME.radius * 1.3) + 'px');
  r.setProperty('--r-xl', Math.round(THEME.radius * 1.7) + 'px');
  r.setProperty('--glass', `rgba(255,255,255,${THEME.alpha})`);
  // подмешиваем цвет поверхности в стекло (если браузер умеет color-mix)
  try { r.setProperty('--glass', `color-mix(in srgb, ${THEME.surface} 58%, rgba(255,255,255,${THEME.alpha}))`); } catch (e) {}
  r.setProperty('--glass-2', `rgba(255,255,255,${(THEME.alpha * 1.55).toFixed(3)})`);
  r.setProperty('--brd', `rgba(255,255,255,${(0.06 + THEME.bw * 0.07).toFixed(3)})`);
  r.setProperty('--sh', `0 ${18 * THEME.depth}px ${40 * THEME.depth}px rgba(2,6,16,.55)`);
  // дополнительные акценты — тоже из темы, а не только из :root
  r.setProperty('--gold', THEME.gold);
  r.setProperty('--violet', THEME.violet);
  r.setProperty('--lime', THEME.lime);
  /* тонкая настройка эффектов (панель под телефоном):
     blur — расфокус стекла, glow — свечение кнопок и активного таба,
     plate — плотность подложек нав/топбара, blob — световые пятна */
  r.setProperty('--glass-blur', (THEME.blur ?? 18) + 'px');
  const gw = THEME.glow ?? 1;
  const pl = THEME.plate ?? 1;
  r.setProperty('--glow-k', gw);
  r.setProperty('--glow-coral', `0 10px 26px ${rgbaOf(THEME.accent, +(0.30 * gw).toFixed(3))}`);
  r.setProperty('--glow-teal', `0 10px 26px ${rgbaOf(THEME.accent2, +(0.26 * gw).toFixed(3))}`);
  r.setProperty('--glow-sky', `0 10px 26px ${rgbaOf(THEME.accent3, +(0.26 * gw).toFixed(3))}`);
  r.setProperty('--tab-glow', `drop-shadow(0 0 ${(8 * gw).toFixed(1)}px ${rgbaOf(THEME.accent, +(0.55 * gw).toFixed(3))})`);
  r.setProperty('--plate-1', rgbaOf(THEME.surface, +(0.88 * pl).toFixed(3)));
  r.setProperty('--plate-2', rgbaOf(THEME.bg1, +(0.95 * pl).toFixed(3)));
  r.setProperty('--blob-blur', (THEME.blobBlur ?? 24) + 'px');
  r.setProperty('--blob-op', THEME.blobOp ?? 0.55);
  // сцена: синь сверху (как лучи на лого), лёгкий красный снизу справа
  document.body.style.background = `radial-gradient(1100px 620px at 50% -14%, ${THEME.accent3}2E, transparent 62%), radial-gradient(880px 560px at 4% 26%, ${THEME.accent2}14, transparent 60%), radial-gradient(820px 520px at 96% 94%, ${THEME.accent}1C, transparent 62%), linear-gradient(168deg, ${THEME.bg1}, ${THEME.bg2} 46%, ${THEME.bg1})`;
  document.querySelectorAll('.phone, .screen').forEach(el => { el.style.background = el.classList.contains('phone') ? `linear-gradient(170deg, ${THEME.bg2}, ${THEME.bg1})` : ''; });
  if (save) { try { localStorage.setItem('ttu-theme-v1', JSON.stringify(THEME)); } catch (e) {} }
}

/* Значение токена темы как конкретный цвет — для мест, где var() не
   работает: keyframes WAAPI, canvas. themeVar('--coral') -> '#E23B2E',
   themeRgba('--coral', .5) -> 'rgba(226,59,46,.5)'. */
function themeVar(name) {
  return (getComputedStyle(document.documentElement).getPropertyValue(name) || '').trim();
}
function themeRgba(name, a) {
  const v = themeVar(name);
  const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(v);
  if (!m) return v || 'transparent';
  const n = m[1].length === 3 ? m[1].split('').map((c) => c + c).join('') : m[1];
  return `rgba(${parseInt(n.slice(0, 2), 16)},${parseInt(n.slice(2, 4), 16)},${parseInt(n.slice(4, 6), 16)},${a})`;
}

function renderThemePanel() {

      ${label}</label>`;
  const slider = (k, label, min, max, step, unit = '') => `<label style="display:block;margin:8px 0 2px;font:600 10.5px/1.3 inherit;color:#8FA2BB">${label}

      <input type="range" min="${min}" max="${max}" step="${step}" value="${THEME[k]}" oninput="THEME.${k}=+this.value; applyTheme(); renderThemePanel()" style="margin-top:4px"></label>`;
  host.innerHTML = `

    ${slider('blur', 'Blur стекла', 4, 34, 1, 'px')}
    ${slider('glow', 'Свечение', 0, 2, 0.05)}
    ${slider('plate', 'Плотность подложек', 0.3, 1, 0.05)}
    ${slider('blobOp', 'Световые пятна', 0, 1, 0.05)}
    <div style="display:flex;gap:5px;margin-top:10px;flex-wrap:wrap">

    </div>
    <button class="ritem" style="margin-top:6px;justify-content:center;border:1px solid rgba(255,255,255,.12)" onclick="resetTheme()">Сбросить</button>`;

function usePreset(k) { THEME = { ...THEME, ...THEME_PRESETS[k] }; applyTheme(); renderThemePanel(); renderScreen(CURRENT); }
function resetTheme() { THEME = { ...THEME_DEFAULTS }; applyTheme(); renderThemePanel(); renderScreen(CURRENT); }
window.usePreset = usePreset; window.resetTheme = resetTheme; window.applyTheme = applyTheme;

/* ============================================================
   ИТЕРАЦИЯ 6 · ЯДРО
   Роутер с историей, движок матча, палитра команд, a11y,
   магазин состояний, экспорт темы, панель производительности.
   ============================================================ */

/* ---------- 1. РОУТЕР С ИСТОРИЕЙ И ПЕРЕХОДАМИ ---------- */
const Router = {
  stack: [],
  busy: false,
  pending: null,
  scrollMem: {},
  push(id, opts = {}) {
    /* во время перехода (150 мс) новые тапы раньше молча терялись — тап по
     «назад» не срабатывал. Копим последний запрос: выигрывает последний тап. */
    if (Router.busy) { Router.pending = { id, opts }; return; }
    if (CURRENT) {
      Router.scrollMem[CURRENT] = ($('#screen .scroll') || {}).scrollTop || 0;
    }
    const def = SCREEN_REGISTRY.find(s => s.id === id);
    if (!def) { toast('Экран не найден: ' + id, 'err'); return; }
    if (CURRENT && CURRENT !== id) Router.stack.push(CURRENT);
    if (Router.stack.length > 40) Router.stack.shift();
    Router.busy = true;
    const host = $('#screen');
    const old = host.querySelector('.screen');
    const paint = () => {
      if (opts.replace) Router.stack.pop();
      renderScreen(id);
      const sc = $('#screen .scroll');
      if (sc) sc.scrollTop = opts.keepScroll ? (Router.scrollMem[id] || 0) : 0;
      location.hash = 'screen=' + id;
      Router.busy = false;
      if (Router.pending) { const p = Router.pending; Router.pending = null; Router.push(p.id, p.opts); }
    };
    if (old && !document.body.classList.contains('rm')) {
      old.classList.add('exit');
      setTimeout(paint, 150);
    } else paint();
  },
  back() {
    const prev = Router.stack.pop();
    if (prev) { Router.busy = false; Router.push(prev); }
    else go('hub');
  },
  reset() { Router.stack = []; }
};

/* ---------- 2. ХРАНИЛИЩЕ ПРОГРЕССА ---------- */
const Store = {
  listeners: [],
  get() { return S; },
  subscribe(fn) { Store.listeners.push(fn); return () => { Store.listeners = Store.listeners.filter(f => f !== fn); }; },
  emit() { Store.listeners.forEach(f => { try { f(S); } catch (e) {} }); },
  patch(obj, opts = {}) {
    S = { ...S, ...obj };
    saveState();
    Store.emit();
    if (opts.rerender) renderScreen(CURRENT);
    if (opts.currency) pulseCurrencies();
    return S;
  },
  addCoins(n) { Store.patch({ coins: Math.max(0, S.coins + n) }, { currency: true }); toast((n > 0 ? '+' : '') + n + ' ₵', n > 0 ? 'ok' : 'warn'); },
  addGems(n) { Store.patch({ gems: Math.max(0, S.gems + n) }, { currency: true }); toast((n > 0 ? '+' : '') + n + ' ◈', n > 0 ? 'ok' : 'warn'); },
  addXp(n) {
    let xp = S.xp + n, lvl = S.level, xpMax = S.xpMax, levelUp = false;
    while (xp >= xpMax) { xp -= xpMax; lvl += 1; xpMax = Math.round(xpMax * 1.15 / 10) * 10; levelUp = true; }
    Store.patch({ xp, level: lvl, xpMax }, { currency: false });
    if (levelUp) { setTimeout(() => openPop('levelUp'), 500); }
    toast('+' + n + ' XP');
  },
  spend(amount, currency = 'coins') {
    const key = currency === 'coins' ? 'coins' : 'gems';
    if (S[key] < amount) return false;
    Store.patch({ [key]: S[key] - amount }, { currency: true });
    return true;
  }
};

function pulseCurrencies() {
  $$('.currencies .wallet').forEach(el => {
    el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.14)' }, { transform: 'scale(1)' }], { duration: 320, easing: 'cubic-bezier(.16,1,.3,1)' });
  });
  $$('.currencies .count').forEach((el, i) => {
    const target = i === 0 ? S.coins : S.gems;
    const from = Number(el.textContent) || 0;
    countUp(el, target, 420, from);
  });
}

/* ---------- 3. ТОСТЫ: ОЧЕРЕДЬ И ТИПЫ ---------- */
const ToastQueue = { items: [], max: 2, timers: {} };
function toast2(text, type = 'ok', ms = 2400, opts = {}) {
  const key = (opts.key || text);
  if (ToastQueue.items.includes(key)) return;
  ToastQueue.items.push(key);
  while (ToastQueue.items.length > ToastQueue.max) {
    const oldest = ToastQueue.items.shift();
    const el = document.querySelector('[data-toast="' + oldest + '"]');
    if (el) el.remove();
  }
  const host = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (type === 'ok' ? '' : type);
  el.dataset.toast = key;
  el.innerHTML = '<span class="tico">' + ico(type === 'ok' ? 'check' : type === 'warn' ? 'warn' : type === 'info' ? 'info' : 'x', 'i i-16') + '</span>' +
    '<span class="u-minw0 grow">' + text + '</span>' +
    (opts.action ? '<button class="btn xs ghost" onclick="' + opts.action + '">' + (opts.actionLabel || 'OK') + '</button>' : '');
  host.appendChild(el);
  const kill = () => {
    el.classList.add('out');
    ToastQueue.items = ToastQueue.items.filter(i => i !== key);
    setTimeout(() => el.remove(), 200);
  };
  if (ms > 0) setTimeout(kill, ms);
  return el;
}

/* ---------- 4. ДВИЖОК МАТЧА ---------- */
const Match = {
  active: false,
  timer: null,
  s: null,
  reset(opts = {}) {
    this.s = {
      me: 0, opp: 0, set: 1, setsMe: opts.setsMe || 0, setsOpp: opts.setsOpp || 0,
      scoreSets: opts.scoreSets || [[11, 9]],
      serve: 'me', serveLeft: 2, rally: false, finished: false,
      target: opts.target || 11, bestOf: opts.bestOf || 3, mode: opts.mode || 'casual'
    };
    this.render();
  },
  start() { this.active = true; this.loop(); },
  stop() { this.active = false; RALLY_LOCKED = false; clearTimeout(this.timer); },
  loop() {
    if (!this.active || CURRENT !== 'match') return;
    this.serveRally();
    this.timer = setTimeout(() => { this.serveRally(); }, 2600);
  },
  serveRally() {
    const ball = document.querySelector('#court .ball');
    const s = this.s;
    if (!ball || !s) return;
    RALLY_LOCKED = true;             // окна во время розыгрыша заблокированы
    s.rally = true;
    const dir = s.serve === 'me' ? 1 : -1;
    const x0 = 38 + (Math.random() * 6 - 3);
    const x1 = 50 + (Math.random() * 10 - 5) * dir;
    ball.animate([
      { left: x0 + '%', top: '56%', transform: 'scale(1)' },
      { left: (x0 + 12) + '%', top: '30%', transform: 'scale(1.12)' },
      { left: x1 + '%', top: '46%', transform: 'scale(1)' }
    ], { duration: 1100, easing: 'cubic-bezier(.3,.1,.4,1)', fill: 'forwards' });
    haptic('light');
    setTimeout(() => { RALLY_LOCKED = false; s.rally = false; }, 1150);
  },
  hit() {
    if (!this.s || this.s.finished) return;
    haptic('light');
    this.serveRally();
    toast2('Удар · спин ' + (Math.floor(Math.random() * 40) + 60), 'info', 900);
  },
  addPoint(who) {
    if (!this.s || this.s.finished) return;
    const s = this.s;
    if (who === 'me') s.me += 1; else s.opp += 1;
    haptic(who === 'me' ? 'success' : 'warning');
    this.render();
    openPop(who === 'me' ? 'pointWin' : 'pointLose');
    const lead = Math.abs(s.me - s.opp);
    const top = Math.max(s.me, s.opp);
    if ((s.me >= s.target - 1 && s.opp >= s.target - 1 && lead === 0) || (top >= s.target && lead >= 2)) this.closeSet();
    else if (s.me >= s.target - 1 && lead >= 1 && s.me !== s.target) { if (s.me > s.opp) openPop('matchPoint'); }
    s.serveLeft -= 1;
    if (s.serveLeft <= 0) { s.serveLeft = 2; s.serve = s.serve === 'me' ? 'opp' : 'me'; this.render(); }
  },
  closeSet() {
    const s = this.s;
    const my = s.me, op = s.opp;
    s.scoreSets.push([my, op]);
    if (my > op) s.setsMe += 1; else s.setsOpp += 1;
    openPop('setEnd');
    const need = Math.ceil(s.bestOf / 2);
    if (s.setsMe >= need || s.setsOpp >= need) { this.finish(); return; }
    s.me = 0; s.opp = 0; s.set += 1;
    setTimeout(() => { this.render(); }, 900);
  },
  finish() {
    const s = this.s;
    s.finished = true; this.stop();
    const win = s.setsMe > s.setsOpp;
    Store.addXp(win ? 180 : 60);
    Store.addCoins(win ? 90 : 30);
    S.rating = Math.max(0, S.rating + (win ? 24 : -18));
    saveState();
    setTimeout(() => openPop(win ? 'win' : 'lose'), 650);
  },
  render() {
    const s = this.s; if (!s) return;
    const bar = $('.matchbar'); if (!bar) return;
    const scoreEl = bar.querySelector('.sc b');
    if (scoreEl) {
      const lead = s.me >= s.opp;
      scoreEl.innerHTML = '<span class="' + (lead ? 'win' : 'op') + '">' + s.me + '</span><i>:</i><span class="' + (lead ? 'op' : 'win') + '">' + s.opp + '</span>';
    }
    const sub = bar.querySelector('.sc > span');
    if (sub) sub.textContent = 'сет ' + s.set + ' · сеты ' + s.setsMe + ':' + s.setsOpp;
    bar.querySelectorAll('.serve i').forEach((i, idx) => i.classList.toggle('on', idx < s.serveLeft && s.serve === 'me'));
    const sts = bar.querySelectorAll('.pl .st');
    if (sts[0]) sts[0].textContent = (s.serve === 'me' ? 'подача' : 'приём') + ' · ' + (PLATFORM.mobile ? 'mobile' : 'desktop');
    if (sts[1]) sts[1].textContent = (s.serve === 'opp' ? 'подача' : 'приём') + ' · 2210';
  }
};

/* ---------- 5. ДВИЖОК ПРАКТИКИ ---------- */
const Practice = {
  hits: 0, goal: 30, streak: 0, best: 0, startedAt: 0, timer: null,
  start(goal = 30) {
    this.hits = 0; this.streak = 0; this.best = 0; this.goal = goal; this.startedAt = Date.now();
    clearInterval(this.timer);
    this.timer = setInterval(() => {
      const el = $('#pTime'); if (!el) return;
      const t = Math.floor((Date.now() - this.startedAt) / 1000);
      el.textContent = String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
    }, 500);
  },
  stop() { clearInterval(this.timer); },
  hit() {
    this.hits += 1; this.streak += 1; this.best = Math.max(this.best, this.streak);
    const ball = document.querySelector('#court .ball');
    if (ball) ball.animate([{ transform: 'scale(1.3)', opacity: 1 }, { transform: 'scale(.92)', opacity: .85 }, { transform: 'scale(1)', opacity: 1 }], { duration: 220, easing: 'ease-out' });
    haptic('light');
    const p = $('#pCount'), b = $('#pBar'), pct = $('#pPct');
    if (p) p.textContent = this.hits;
    if (b) b.style.width = Math.min(100, this.hits / this.goal * 100) + '%';
    if (pct) pct.textContent = Math.round(Math.min(100, this.hits / this.goal * 100)) + '%';
    if (this.hits === Math.ceil(this.goal / 2)) toast2('Половина цели · не сбавляй', 'info', 1600);
    if (this.hits >= this.goal) { this.stop(); go('practice-result'); }
  }
};

/* ---------- 6. ПАЛИТРА КОМАНД (⌘K / Ctrl+K) ---------- */
let Palette = { open: false, idx: 0, items: [] };
function buildPaletteItems(q = '') {
  const screens = SCREEN_REGISTRY.map((s, i) => ({ kind: 'screen', id: s.id, label: s.title, group: s.group, n: i + 1 }));
  const pops = POP_IDS.map(p => ({ kind: 'pop', id: p.key, label: p.key, group: 'Попап ' + p.id }));
  const all = screens.concat(pops);
  if (!q) return all.slice(0, 40);
  const needle = q.toLowerCase();
  return all.filter(x => (x.label + ' ' + x.id + ' ' + x.group).toLowerCase().includes(needle)).slice(0, 40);
}
function openPalette() {
  if (Palette.open) return;
  Palette.open = true;
  const host = $('#overlay');
  host.innerHTML = `
    <div class="ovl mid pal-ovl" id="ovlRoot" onclick="if(event.target.id==='ovlRoot') closePalette()">
      <div class="pal" role="dialog" aria-label="Палитра команд">
        <div class="pal-input">
          ${ico('help', 'i i-16')}
          <input id="palQ" placeholder="Экран, попап или действие…" oninput="paletteFilter(this.value)"
                 onkeydown="paletteKey(event)" autocomplete="off" spellcheck="false">
          <span class="badge b-mut mono">esc</span>
        </div>
        <div class="pal-list" id="palList"></div>
        <div class="pal-foot small dim"><span>↑↓ навигация</span><span>↵ открыть</span><span>${SCREEN_REGISTRY.length} экранов · ${POP_IDS.length} попапов</span></div>
      </div>
    </div>`;
  Palette.items = buildPaletteItems('');
  Palette.idx = 0;
  paintPalette();
  setTimeout(() => { const i = $('#palQ'); if (i) i.focus(); }, 40);
}
function closePalette() { Palette.open = false; $('#overlay').innerHTML = ''; }
function paletteFilter(q) { Palette.items = buildPaletteItems(q); Palette.idx = 0; paintPalette(); }
function paintPalette() {
  const host = $('#palList'); if (!host) return;
  host.innerHTML = Palette.items.length ? Palette.items.map((it, i) => `
    <button class="pal-item ${i === Palette.idx ? 'on' : ''}" data-i="${i}" onclick="palettePick(${i})">
      <span class="pal-ico">${ico(it.kind === 'pop' ? 'bell' : 'arrow-r', 'i i-16')}</span>
      <span class="grow" style="text-align:left"><b>${it.label}</b><span class="small dim">${it.group}</span></span>
      <span class="pal-n mono">${it.kind === 'pop' ? popIdOf(it.id) : String(it.n).padStart(2, '0')}</span>
    </button>`).join('') : '<div class="empty" style="padding:20px"><b>Ничего не найдено</b><span>Попробуй «турнир», «настройки» или POP-018</span></div>';
}
function paletteKey(e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); Palette.idx = Math.min(Palette.items.length - 1, Palette.idx + 1); paintPalette(); scrollPalette(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); Palette.idx = Math.max(0, Palette.idx - 1); paintPalette(); scrollPalette(); }
  if (e.key === 'Enter') { e.preventDefault(); palettePick(Palette.idx); }
  if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
}
function scrollPalette() { const el = document.querySelector('.pal-item.on'); if (el) el.scrollIntoView({ block: 'nearest' }); }
function palettePick(i) {
  const it = Palette.items[i]; if (!it) return;
  closePalette();
  if (it.kind === 'pop') { openPop(it.id); }
  else {
    // если экран в другом разделе — просто переходим (история сохраняет контекст)
    Router.push(it.id);
  }
}
window.openPalette = openPalette; window.closePalette = closePalette;
window.paletteFilter = paletteFilter; window.paletteKey = paletteKey; window.palettePick = palettePick;

/* ---------- 7. ДОСТУПНОСТЬ ОВЕРЛЕЕВ ---------- */
let lastFocused = null;
function trapFocus(container) {
  const sel = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
  const nodes = Array.from(container.querySelectorAll(sel)).filter(n => !n.disabled);
  if (!nodes.length) return;
  nodes[0].focus({ preventScroll: true });
  container.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    const first = nodes[0], last = nodes[nodes.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
}
function rememberFocus() { lastFocused = document.activeElement; document.querySelector('.screen')?.setAttribute('aria-hidden', 'true'); }
function restoreFocus() { if (lastFocused && lastFocused.focus) lastFocused.focus({ preventScroll: true }); document.querySelector('.screen')?.removeAttribute('aria-hidden'); }

/* ---------- 8. ПАНЕЛЬ ПРОИЗВОДИТЕЛЬНОСТИ ---------- */
const Perf = {
  samples: [], budgetMs: 16.7, drops: 0, el: null, visible: false,
  init() {
    let last = performance.now();
    const tick = (t) => {
      const dt = t - last; last = t;
      Perf.samples.push(dt);
      if (Perf.samples.length > 120) Perf.samples.shift();
      if (dt > 32) Perf.drops += 1;
      if (Perf.el && Perf.visible) Perf.paint();
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  },
  toggle() {
    Perf.visible = !Perf.visible;
    if (!Perf.el) {
      Perf.el = document.createElement('div');
      Perf.el.className = 'perf';
      document.body.appendChild(Perf.el);
    }
    Perf.el.style.display = Perf.visible ? 'block' : 'none';
    Perf.paint();
  },
  paint() {
    if (!Perf.el) return;
    const s = Perf.samples;
    const avg = s.reduce((a, b) => a + b, 0) / Math.max(1, s.length);
    const fps = Math.round(1000 / avg);
    const worst = Math.round(Math.max.apply(null, s.slice(-30).concat([0])));
    Perf.el.innerHTML = `
      <div class="perf-row"><b>FPS</b><span style="color:${fps < 45 ? 'var(--coral-txt)' : fps < 55 ? 'var(--gold)' : 'var(--teal)'}">${fps}</span></div>
      <div class="perf-row"><b>frame</b><span>${avg.toFixed(1)} ms</span></div>
      <div class="perf-row"><b>worst</b><span>${worst} ms</span></div>
      <div class="perf-row"><b>drops</b><span>${Perf.drops}</span></div>
      <div class="perf-row"><b>quality</b><span>${QUALITY}</span></div>
      <div class="perf-bar">${s.slice(-40).map(x => `<i style="height:${Math.min(18, x)}px;background:${x> 32 ? 'var(--coral)' : x > 20 ? 'var(--gold)' : 'var(--teal)'}"></i>`).join('')}</div>`;
  }
};

function copyText(text, okMsg) {
  const done = () => toast2(okMsg || 'Скопировано', 'ok', 1800);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast2('Копирование недоступно', 'err'); }

}

function initShortcuts() {
  window.addEventListener('keydown', (e) => {
    const typing = /input|textarea/i.test((document.activeElement || {}).tagName || '');
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
    if (typing) return;
    if (e.key === '?') { e.preventDefault(); openPop('shortcuts'); return; }
    if (e.key === 'p' || e.key === 'P') { Perf.toggle(); return; }
    if (e.key === 't' || e.key === 'T') { document.querySelector('.app').classList.toggle('show-rail'); return; }
    if (e.key === 'Escape') { if (Palette.open) closePalette(); else closePop(); return; }
    const map = { '1': 'hub', '2': 'tournaments', '3': 'shop', '4': 'profile' };
    if (map[e.key]) { Router.push(map[e.key]); }
  });
}
function initSystemPrefs() {
  try {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (mq.matches && !S.reducedMotion) Store.patch({ reducedMotion: true });
    mq.addEventListener && mq.addEventListener('change', (ev) => { Store.patch({ reducedMotion: ev.matches }); });
  } catch (e) {}
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { Match.stop(); } else if (CURRENT === 'match' && Match.s && !Match.s.finished) { Match.start(); }
  });
}
function initHashRouting() {
  const read = () => {
    const m = (location.hash || '').match(/screen=([\w-]+)/);
    if (m) {
      const id = m[1];
      if (SCREEN_REGISTRY.some(s => s.id === id) && id !== CURRENT) renderScreen(id);
    }
  };
  window.addEventListener('hashchange', read);
  read();
}

/* ---------- графические хелперы ---------- */
function sparkline(values, opts = {}) {
  const w = opts.w || 300, h = opts.h || 90;
  const max = Math.max.apply(null, values), min = Math.min.apply(null, values);
  const range = max - min || 1;
  const pts = values.map((v, i) => [i / (values.length - 1) * w, h - ((v - min) / range) * (h - 10) - 5]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const id = 'sp' + Math.random().toString(36).slice(2, 7);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="${opts.color || 'var(--teal)'}" stop-opacity=".5"/><stop offset="1" stop-color="${opts.color || 'var(--teal)'}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${d} L${w} ${h} L0 ${h}Z" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${opts.color || 'var(--teal)'}" stroke-width="2.4" stroke-linecap="round"/>
    ${pts.filter((_, i) => i % 4 === 0).map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.4" fill="${opts.color || 'var(--teal)'}"/>`).join('')}
  </svg>`;
}
function ringChart(pct, label, color = 'var(--teal)', size = 64) {
  const r = size / 2 - 5, c = 2 * Math.PI * r;
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>
    <b class="u-t-xxs">${pct}%</b>${label ? `<span>${label}</span>` : ''}</div>`;
}
function barsChart(items, color = 'var(--sky)') {
  const max = Math.max.apply(null, items.map(i => i.v)) || 1;
  return `<div class="bars">${items.map(i => `
    <div class="bars-i"><div class="bars-b" style="height:${Math.round(i.v / max * 100)}%;background:${i.c || color}"></div><span>${i.l}</span></div>`).join('')}</div>`;
}
function donutLegend(items) {
  return `<div class="row" style="gap:10px;flex-wrap:wrap">${items.map(i => `
    <div class="row" style="gap:5px"><i style="width:8px;height:8px;border-radius:3px;background:${i.c}"></i><span class="small dim">${i.l} ${i.v}%</span></div>`).join('')}</div>`;
}

/* ---------- a11y-обёртка над openPop / closePop ---------- */
const openPopBase = openPop;
openPop = function (id, vars = {}) {
  rememberFocus();
  const before = popOpenId;
  openPopBase(id, vars);
  if (popOpenId && popOpenId !== before) {
    const box = document.querySelector('.ovl .modal, .ovl .sheet');
    if (box) {
      box.setAttribute('role', 'dialog');
      box.setAttribute('aria-modal', 'true');
      const title = box.querySelector('.pop-title');
      if (title) { title.id = 'popTitle'; box.setAttribute('aria-labelledby', 'popTitle'); }
      box.setAttribute('tabindex', '-1');
      trapFocus(box);
    }
  }
};
const closePopBase = closePop;
closePop = function (instant) {
  const had = !!popOpenId || !!document.querySelector('.ovl');
  closePopBase(instant);
  if (had) setTimeout(restoreFocus, 60);
};

let railQuery = '';

function renderRail() {
  if (!VISITED.has(CURRENT) && CURRENT) VISITED.add(CURRENT);
  const groups = {};
  SCREEN_REGISTRY.forEach((s, i) => { (groups[s.group] = groups[s.group] || []).push({ ...s, n: String(i).padStart(2, '0') }); });
  const q = railQuery.trim().toLowerCase();
  const match = (s) => !q || (s.title + ' ' + s.id + ' ' + s.group).toLowerCase().includes(q);
  $('#railList').innerHTML = `
    <input id="railSearch" placeholder="Поиск по экранам…" value="${railQuery}"
      oninput="railQuery=this.value; renderRail(); setTimeout(()=>{const el=document.getElementById('railSearch'); if(el){el.focus(); el.setSelectionRange(el.value.length,el.value.length);}},0)"
      style="width:100%;margin:8px 0 4px;padding:8px 10px;border-radius:var(--rd-s);border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);color:#DCE7F5;font:600 11.5px/1 inherit;outline:none">
    ${Object.entries(groups).map(([g, items]) => {
      const shown = items.filter(match);
      if (!shown.length) return '';
      return `<div class="rgroup">${g} <span>${shown.length}/${items.length}</span></div>
        ${shown.map(s => `<button class="ritem ${VISITED.has(s.id) ? 'seen' : ''}" data-screen="${s.id}" onclick="go('${s.id}'); document.querySelector('.app').classList.remove('show-rail')"><i>${s.n}</i>${s.title}</button>`).join('')}`;
    }).join('')}
    ${q && !SCREEN_REGISTRY.some(match) ? `<div class="small dim" style="padding:8px">Ничего не найдено</div>` : ''}`;
  $('#railPops').innerHTML = POP_IDS.map(p => {
    const label = p.key;
    const shown = !q || label.toLowerCase().includes(q) || p.id.toLowerCase().includes(q);
    return shown ? `<button class="ritem" onclick="openPop('${p.key}'); document.querySelector('.app').classList.remove('show-rail')"><i class="mono" style="font-size:9.5px">${p.id}</i>${label}</button>` : '';
  }).join('');
  renderRailActive();
}

function coachStart() {
  coachStep = 0;
  const st = $('#coachStage'); if (!st) return;
  st.classList.add('coaching');
  coachPaint();
}
function coachPaint() {
  const st = $('#coachStage'); if (!st) return;
  const step = COACH_STEPS[coachStep];
  if (!step) { coachSkip(); return; }
  st.querySelectorAll('.coached').forEach(el => el.classList.remove('coached'));
  const el = st.querySelector('[data-coach="' + step.target + '"]');
  if (el) el.classList.add('coached');
  const tip = $('#coachTip');
  if (tip) {
    tip.style.display = 'flex';
    tip.classList.toggle('top', step.place === 'top');
    $('#coachTitle').textContent = step.title;
    $('#coachText').textContent = step.text;
    $('#coachCount').textContent = (coachStep + 1) + ' / ' + COACH_STEPS.length;
  }
}
function coachNext() {
  coachStep += 1;
  if (coachStep >= COACH_STEPS.length) { coachSkip(); toast2('Обучение завершено', 'ok'); return; }
  coachPaint();
}
function coachSkip() {
  const st = $('#coachStage');
  if (st) { st.classList.remove('coaching'); st.querySelectorAll('.coached').forEach(el => el.classList.remove('coached')); }
  const tip = $('#coachTip'); if (tip) tip.style.display = 'none';
  coachStep = 0;
}
window.coachStart = coachStart; window.coachNext = coachNext; window.coachSkip = coachSkip;

/* ============================================================
   ИТЕРАЦИЯ 7 · АУДИТ И ИСПРАВЛЕНИЯ
   1. SEG      — рабочие сегмент-контролы и чипы
   2. Enhance  — пост-обработка КАЖДОГО экрана (тап-зоны, aria, страховка ссылок)
   3. Chat     — живой чат: отправка, автоответ, реакции, липкий композер
   4. Фиксы    — history / inventory / stats / gift-history / club-chat / dm-thread
   5. QA       — экран «Аудит прототипа» с живой самопроверкой 118 экранов
   ============================================================ */

/* ---------- 1. SEG: состояние сегментов и чипов ---------- */
const SEG = {};
const segVal = (group, def) => (SEG[group] === undefined ? def : SEG[group]);
const SEG_LABELS = {};

function segPick(btn) {
  const box = btn.closest('.seg');
  if (!box) return;
  const group = box.dataset.seg || '';
  const val = btn.dataset.val !== undefined ? btn.dataset.val : (btn.textContent || '').trim();
  if (SEG[group] === val) return;
  SEG[group] = val;
  SEG_LABELS[group] = (btn.textContent || '').trim();
  Array.from(box.querySelectorAll('button')).forEach((b) => {
    const on = b === btn;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  haptic('light');
  if (box.dataset.refresh !== undefined) {
    renderScreen(CURRENT);
  } else if (box.dataset.toast !== 'off') {
    toast2('Фильтр: ' + (btn.textContent || '').trim(), 'ok', 1500);
  }
}
/* то же состояние SEG, что у сегментов, но для компактных <select> в заголовках */
window.selPick = function (el) {
  const group = el.dataset.sel || '';
  if (!group) return;
  SEG[group] = el.value;
  SEG_LABELS[group] = el.options[el.selectedIndex].textContent;
  haptic('light');
  if (el.dataset.refresh !== undefined) renderScreen(CURRENT);
};

window.segPick = segPick;
window.segVal = segVal;

document.addEventListener('click', (e) => {
  const b = e.target.closest('.seg button');
  if (b && !b.hasAttribute('onclick')) segPick(b);
}, true);

/* ---------- 2. Enhance: пост-обработка экрана ---------- */
const ENHANCE_BY_ID = {};

const Enhance = {
  run(id) {
    const root = document.querySelector('#screen .screen');
    if (!root) return;
    root.dataset.screen = id;

    // сегменты: роль и исходное состояние
    root.querySelectorAll('.seg').forEach((box) => {
      box.setAttribute('role', 'tablist');
      const g = box.dataset.seg || '';
      const cur = segVal(g, null);
      box.querySelectorAll('button').forEach((b) => {
        b.setAttribute('role', 'tab');
        const val = b.dataset.val !== undefined ? b.dataset.val : (b.textContent || '').trim();
        const on = cur === null ? b.classList.contains('on') : String(cur) === String(val);
        b.classList.toggle('on', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        if (b.dataset.val === undefined) b.dataset.val = val;
      });
    });

    // тап-зоны меньше 44 px получают увеличенную область нажатия
    root.querySelectorAll('button, .chip, .reaction, .badge[onclick], .press[onclick]').forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.height > 0 && r.height < 40) el.classList.add('hit44');
      if (!el.hasAttribute('aria-label') && !(el.textContent || '').trim() && !el.querySelector('.sr')) {
        const icon = el.querySelector('use');
        if (icon) el.setAttribute('aria-label', (icon.getAttribute('href') || '').replace('#i-', ''));
      }
    });

    // страховка: мёртвые переходы не «молчат», а объясняют
    root.querySelectorAll('[onclick]').forEach((el) => {
      /* кликательные div/span без роли кнопки невидимы для скринридера
         и недоступны с клавиатуры — дотягиваем роль и tabindex один раз */
      if (el.tagName !== 'BUTTON' && el.tagName !== 'A' && !el.hasAttribute('role') && !el.querySelector('button, a, [onclick]')) {
        el.setAttribute('role', 'button');
        if (!el.hasAttribute('tabindex')) el.tabIndex = 0;
      }
      const m = (el.getAttribute('onclick') || '').match(/go\('([^']+)'\)/);
      if (m && !SCREEN_REGISTRY.some((s) => s.id === m[1])) {
        el.classList.add('dead-link');
        el.setAttribute('onclick', `toast2('Экран в разработке: ${m[1]}', 'warn')`);
      }
      const p = (el.getAttribute('onclick') || '').match(/openPop\('([^']+)'\)/);
      if (p && !POPUP_DEFS[p[1]]) {
        el.setAttribute('onclick', `toast2('Окно в разработке: ${p[1]}', 'warn')`);
      }
    });

    // переполнение по горизонтали: помечаем для отладки, не ломая вид
    const sc = root.querySelector('.scroll');
    if (sc) {
      root.dataset.overflow = sc.scrollWidth > sc.clientWidth + 2 ? 'x' : 'no';
    }

    (ENHANCE_BY_ID[id] || []).forEach((fn) => { try { fn(root); } catch (err) { /* не роняем экран */ } });
  },

  /* Самопроверка: проходит по всем экранам и собирает отчёт */
  audit() {
    const report = { screens: 0, issues: 0, rows: [] };
    const ids = SCREEN_REGISTRY.map((s) => s.id);
    const keep = CURRENT || 'qa-audit';
    if (SPLASH_TIMER) { clearInterval(SPLASH_TIMER); SPLASH_TIMER = null; }
    AUDIT_RUNNING = true;
    window.__quiet = true;
    SCREEN_REGISTRY.forEach((def) => {
      try {
        renderScreen(def.id);
        const root = document.querySelector('#screen .screen');
        const row = { id: def.id, group: def.group, title: def.title, issues: [] };
        const html = root.innerHTML;
        const goIds = [...html.matchAll(/go\('([^']+)'/g)].map((m) => m[1]);
        const popIds = [...html.matchAll(/openPop\('([^']+)'/g)].map((m) => m[1]);
        const deadGo = [...new Set(goIds)].filter((x) => !ids.includes(x));
        const deadPop = [...new Set(popIds)].filter((x) => !POPUP_DEFS[x]);
        if (deadGo.length) row.issues.push('мёртвый переход: ' + deadGo.join(', '));
        if (deadPop.length) row.issues.push('мёртвое окно: ' + deadPop.join(', '));
        const noHandler = Array.from(root.querySelectorAll('button')).filter((b) => {
          if (!b.offsetParent) return false;
          if (b.getAttribute('onclick')) return false;
          if (b.classList.contains('seg-btn')) return false;
          return !b.closest('.seg');
        }).length;
        if (noHandler > 6) row.issues.push('кнопок без действия: ' + noHandler);
        const small = Array.from(root.querySelectorAll('button, .chip, .reaction')).filter((el) => {
          if (!el.offsetParent) return false;
          const r = el.getBoundingClientRect();
          return r.height > 0 && r.height < 28 && !el.classList.contains('hit44');
        }).length;
        if (small) row.issues.push('мелкие тап-зоны: ' + small);
        if (!root.querySelector('button, [onclick]')) row.issues.push('нет ни одного действия');
        if (root.dataset.overflow === 'x') row.issues.push('горизонтальное переполнение');
        report.screens++;
        report.issues += row.issues.length;
        report.rows.push(row);
      } catch (err) {
        report.rows.push({ id: def.id, group: def.group, title: def.title, issues: ['падение рендера: ' + err.message] });
        report.issues++;
      }
    });
    report.rows.sort((a, b) => b.issues.length - a.issues.length);
    AUDIT_LAST = report;
    AUDIT_RUNNING = false;
    window.__quiet = false;
    renderScreen(keep);
    return report;
  }
};

const CHAT_LOG = { 'club-chat': [], 'dm-thread': [] };
const CHAT_REPLIES = {
  'club-chat': ['Я за, давайте в 20:00', 'Тогда стол 2, ссылка в закрепе', 'Го bo3, успеем до рейтинга', 'Кто-нибудь свободен в 21:30?'],

};
const CHAT_R = { 'club-chat': 0, 'dm-thread': 0 };

function chatTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function chatBubble(author, text, time, me, ticks) {
  return `<div class="chat-row ${me ? 'me' : ''}">
    ${me ? '' : `<div class="ava sm">${author}</div>`}
    <div class="chat-bubble">
      ${me ? '' : `<b>${author}</b>`}
      <span>${text}</span>
      <i>${time}${me ? `<span class="ticks">${ticks || '✓✓'}</span>` : ''}</i>
    </div>
  </div>`;
}

const Chat = {
  send(text) {
    const screen = CURRENT;
    if (!CHAT_LOG[screen]) return;
    const input = document.querySelector('#chatField');
    const value = (text !== undefined ? text : (input ? input.value : '')).trim();
    if (!value) {
      toast2('Введите сообщение', 'warn', 1600);
      if (input) input.focus();
      return;
    }
    haptic('light');
    CHAT_LOG[screen].push({ a: 'АС', t: value, time: chatTime(), me: true, ticks: '✓' });
    if (input) input.value = '';
    Chat.paint(screen);
    setTimeout(() => Chat.reply(screen), 900);
  },

  paint(screen) {
    const box = document.querySelector('#chatList');
    if (!box) return;
    box.insertAdjacentHTML('beforeend', CHAT_LOG[screen].map((m) => chatBubble(m.a, m.t, m.time, m.me, m.ticks)).join(''));
    const sc = document.querySelector('#screen .scroll');
    CHAT_LOG[screen].length = 0;
    if (sc) sc.scrollTop = sc.scrollHeight;
    const me = box.querySelector('.chat-row.me:last-of-type .ticks');
    if (me) setTimeout(() => { if (me) me.textContent = '✓✓'; }, 700);
  },

  reply(screen) {
    const typing = document.querySelector('#chatTyping');
    if (typing) typing.style.display = 'flex';
    setTimeout(() => {
      const pool = CHAT_REPLIES[screen] || ['👍'];
      const text = pool[CHAT_R[screen] % pool.length];
      CHAT_R[screen]++;
      if (typing) typing.style.display = 'none';
      const box = document.querySelector('#chatList');
      if (box) {
        box.insertAdjacentHTML('beforeend', chatBubble('МД', text, chatTime(), false));
        const sc = document.querySelector('#screen .scroll');
        if (sc) sc.scrollTop = sc.scrollHeight;
        haptic('light');
      }
    }, 1100);
  },

  react(el) {
    const on = el.classList.toggle('on');
    const n = el.querySelector('b');
    if (n) n.textContent = String(Number(n.textContent) + (on ? 1 : -1));
    haptic('light');
  }
};
window.Chat = Chat;

   ИТЕРАЦИЯ 8 · ДВИЖКИ (js14)
   Здесь заканчиваются все «недописанные» участки:
   звук, сеть, настройки, рейтинг, матч, тренировки, история,
   аналитика, задания, пропуск, лидерборд, календарь, ачивки,

   Всё состояние живёт в Store (S) и переживает перезагрузку.

/* ------------------------------------------------------------
   1. УТИЛИТЫ
   ------------------------------------------------------------ */
const QUIET = () => !!window.__quiet;
const autoPop = (id) => { if (!QUIET()) openPop(id); };
/* отложенное окно: тихий режим проверяется в момент постановки, а не срабатывания */
const autoPopLater = (id, ms) => { const q = QUIET(); setTimeout(() => { if (!q && !QUIET()) openPop(id); }, ms); };

const U = {
  clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
  lerp: (a, b, t) => a + (b - a) * t,
  round: (v, d = 0) => { const p = Math.pow(10, d); return Math.round(v * p) / p; },
  uid: (p = 'id') => p + '-' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3),
  pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  shuffle: (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  rng(seed) {
    let s = seed >>> 0;
    return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  },
  range(n, from = 0) { return Array.from({ length: n }, (_, i) => i + from); },
  sum(a) { return a.reduce((x, y) => x + y, 0); },
  avg(a) { return a.length ? U.sum(a) / a.length : 0; },
  group(arr, key) {
    return arr.reduce((acc, it) => { const k = typeof key === 'function' ? key(it) : it[key]; (acc[k] = acc[k] || []).push(it); return acc; }, {});
  },
  num(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); },
  pad(n, len = 2) { return String(n).padStart(len, '0'); },
  timeShort(sec) { return U.pad(Math.floor(sec / 60)) + ':' + U.pad(Math.round(sec % 60)); },
  dateShort(d = new Date()) {
    const months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
    return d.getDate() + ' ' + months[d.getMonth()];
  },
  clock(d = new Date()) { return U.pad(d.getHours()) + ':' + U.pad(d.getMinutes()); },
  plural(n, forms) {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return forms[2];
    if (b > 1 && b < 5) return forms[1];
    if (b === 1) return forms[0];
    return forms[2];
  },
  matches(n, one, few, many) { return n + ' ' + U.plural(n, [one, few, many]); },
  pct(a, b) { return b ? Math.round(a / b * 100) : 0; },
  initials(name) { return String(name || '').split(' ').slice(0, 2).map((w) => w[0] || '').join('').toUpperCase(); },
  escape(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
};

/* ------------------------------------------------------------
   2. ЗВУК: синтез через WebAudio, без внешних файлов
   ------------------------------------------------------------ */
const Sound = {
  ctx: null,
  unlocked: false,
  last: 0,

  init() {
    if (this.ctx) return this.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; }
    return this.ctx;
  },

  unlock() {
    if (this.unlocked) return;
    const ctx = this.init();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    this.unlocked = true;
  },

  get enabled() { return S.settings.audio.master > 0 && S.settings.audio.sfx > 0; },
  level(channel = 'sfx') {
    const a = S.settings.audio;
    return U.clamp((a.master / 100) * (a[channel] / 100), 0, 1);
  },

  tone(freq, dur, opts = {}) {
    if (!this.enabled) return;
    const ctx = this.init();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(freq, now);
    if (opts.slideTo) osc.frequency.exponentialRampToValueAtTime(opts.slideTo, now + dur);
    const vol = U.clamp((opts.gain || .18) * this.level(opts.channel || 'sfx'), 0, .6);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(vol, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  },

  noise(dur = .05, opts = {}) {
    if (!this.enabled) return;
    const ctx = this.init();
    if (!ctx) return;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const gain = ctx.createGain();
    gain.gain.value = U.clamp((opts.gain || .1) * this.level(), 0, .4);
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = opts.freq || 2400;
    src.connect(filter).connect(gain).connect(ctx.destination);
    src.start();
  },

  play(name) {
    if (!this.enabled) return;
    const now = performance.now();
    if (now - this.last < 24) return;         // защита от очереди одинаковых звуков
    this.last = now;
    switch (name) {
      case 'click': this.tone(520, .06, { type: 'triangle', gain: .1 }); break;
      case 'hit': this.noise(.05, { freq: 2600, gain: .12 }); this.tone(880, .05, { type: 'triangle', gain: .08 }); break;
      case 'point': this.tone(660, .09, { type: 'sine', gain: .14 }); this.tone(990, .12, { type: 'sine', gain: .1, slideTo: 1180 }); break;
      case 'lose': this.tone(320, .16, { type: 'sawtooth', gain: .09, slideTo: 200 }); break;
      case 'win': [0, 90, 180].forEach((d, i) => setTimeout(() => this.tone(520 + i * 180, .16, { type: 'triangle', gain: .13 }), d)); break;
      case 'level': [0, 80, 160, 260].forEach((d, i) => setTimeout(() => this.tone(440 + i * 220, .18, { type: 'sine', gain: .12 }), d)); break;
      case 'coin': this.tone(1200, .07, { type: 'square', gain: .08 }); this.tone(1600, .09, { type: 'square', gain: .06 }); break;
      case 'open': this.tone(300, .12, { type: 'sine', gain: .08, slideTo: 520 }); break;
      case 'error': this.tone(220, .18, { type: 'square', gain: .07 }); break;
      default: this.tone(440, .06, { gain: .08 });
    }
  },

  /* Музыка: очень тихий арпеджио-луп, включается только если музыка > 0 */
  music: { timer: null, step: 0 },
  startMusic() {
    if (!S.settings.audio.music) return;
    if (this.music.timer) return;
    const scale = [220, 261.6, 293.7, 349.2, 392, 523.2];
    this.music.timer = setInterval(() => {
      if (!S.settings.audio.music || S.reducedMotion) return;
      const note = scale[this.music.step % scale.length];
      this.music.step++;
      this.tone(note, .9, { type: 'sine', gain: .035, channel: 'music' });
    }, 1400);
  },
  stopMusic() { clearInterval(this.music.timer); this.music.timer = null; }
};
window.Sound = Sound;

/* ------------------------------------------------------------
   4. СЕТЬ: имитация API с задержкой, кэшем, повторами и статусом
   ------------------------------------------------------------ */
const Net = {
  online: true,
  latency: 240,
  calls: 0,
  cache: {},
  pending: 0,
  listeners: [],
  failNext: {},

  on(fn) { this.listeners.push(fn); return () => { this.listeners = this.listeners.filter((f) => f !== fn); }; },
  emit() { this.listeners.forEach((f) => { try { f(Net.state()); } catch (e) {} }); },
  state() { return { online: this.online, latency: this.latency, pending: this.pending, calls: this.calls }; },

  setOnline(v) {
    this.online = !!v;
    this.emit();
    toast2(v ? 'Соединение восстановлено' : 'Нет сети · офлайн-режим', v ? 'ok' : 'warn', 2200);
  },

  async request(path, payload = {}, opts = {}) {
    this.calls++;
    this.pending++;
    this.emit();
    const started = performance.now();
    const key = path + ':' + JSON.stringify(payload);
    try {
      if (!this.online && !opts.offlineOk) throw Object.assign(new Error('E_NET_1001'), { code: 'E_NET_1001' });
      if (this.failNext[path]) { this.failNext[path]--; throw Object.assign(new Error('E_SRV_500'), { code: 'E_SRV_500' }); }
      const delay = opts.latency !== undefined ? opts.latency : this.latency + Math.random() * 120;
      await new Promise((r) => setTimeout(r, delay));
      if (opts.raw) return payload;
      this.cache[key] = { at: Date.now(), data: payload };
      return { ok: true, data: payload, ms: Math.round(performance.now() - started) };
    } catch (err) {
      if (this.cache[key] && opts.staleOk) return { ok: true, stale: true, data: this.cache[key].data };
      return { ok: false, error: err.code || 'E_UNKNOWN', message: err.message };
    } finally {
      this.pending--;
      this.emit();
    }
  },

  async retry(path, payload, opts = {}, attempts = 2) {
    let last = null;
    for (let i = 0; i <= attempts; i++) {
      last = await this.request(path, payload, opts);
      if (last.ok) return last;
      await new Promise((r) => setTimeout(r, 260 * (i + 1)));
    }
    return last;
  }
};
window.Net = Net;

  ensure() {

      const def = {};

    });
    S.settings.audio = S.settings.audio || {};

  },
  get(section, key) { this.ensure(); return S.settings[section] ? S.settings[section][key] : undefined; },
  set(section, key, value) {
    this.ensure();
    S.settings[section][key] = value;
    saveState();
    this.apply();
    return value;
  },
  toggle(section, key) { return this.set(section, key, !this.get(section, key)); },
  apply() {

  reset() {

    saveState();
    this.apply();
    toast2('Настройки сброшены к стандартным', 'ok');
  }
};

const RANKED_TIERS = [
  { id: 'wood', name: 'Дерево', min: 0, color: 'gold', icon: 'medal' },
  { id: 'bronze', name: 'Бронза', min: 900, color: 'coral', icon: 'medal' },
  { id: 'silver', name: 'Серебро', min: 1400, color: 'mut', icon: 'medal' },
  { id: 'gold', name: 'Золото', min: 1800, color: 'gold', icon: 'crown' },
  { id: 'pro', name: 'Лига Про', min: 2100, color: 'teal', icon: 'crown' },
  { id: 'super', name: 'Суперлига', min: 2400, color: 'violet', icon: 'star' },
  { id: 'legend', name: 'Легенда', min: 2700, color: 'sky', icon: 'fire' }
];

const Ranked = {
  tierOf(rating) {
    let cur = RANKED_TIERS[0];
    RANKED_TIERS.forEach((t) => { if (rating >= t.min) cur = t; });
    return cur;
  },
  next(rating) {
    return RANKED_TIERS.find((t) => t.min > rating) || null;
  },
  progress(rating) {
    const cur = this.tierOf(rating);
    const nx = this.next(rating);
    if (!nx) return 100;
    return U.clamp(Math.round((rating - cur.min) / (nx.min - cur.min) * 100), 0, 100);
  },
  delta(win, oppRating) {
    const diff = (oppRating || S.rating) - S.rating;
    const base = win ? 22 : -16;
    const bonus = U.clamp(diff / 60, -6, 6);
    const streak = win ? Math.min(6, (S.streak || 0)) : 0;
    return Math.round(win ? base + bonus + streak : base + bonus);
  },
  apply(win, oppRating) {
    const d = this.delta(win, oppRating);
    const before = S.rating;
    const after = Math.max(0, before + d);
    const beforeTier = this.tierOf(before);
    const afterTier = this.tierOf(after);
    Store.patch({ rating: after, streak: win ? (S.streak || 0) + 1 : 0 }, { currency: true });
    return { delta: d, before, after, beforeTier: beforeTier.id, afterTier: afterTier.id, promoted: afterTier.id !== beforeTier.id };
  }
};
window.Ranked = Ranked;

const MM = {
  active: false,
  startedAt: 0,
  range: 120,

  pool: () => (S.mode === 'ranked' ? 'ranked-' + PLATFORM.input : 'mixed'),

  tick() {

    if (typeof this.onTick === 'function') this.onTick();
    if (sec >= 3 && sec % 7 === 0 && CURRENT === 'matchmaking') this.found();
  },
  found() {
    if (!this.active) return;
    this.stop();
    if (CURRENT === 'matchmaking') go('opponent-found');
    else openPop('found');
  },
  stop() {

/* ------------------------------------------------------------
   8. МАТЧ: полный движок счёта, подачи и статистики
   ------------------------------------------------------------ */
const MatchStats = { hits: 0, misses: 0, smashes: 0, longest: 0, current: 0 };

const MatchEngine = {
  s: null,

  newMatch(opts = {}) {
    Settings.ensure();
    const target = opts.target || Settings.get('gameplay', 'target') || 11;
    const bestOf = opts.bestOf || Settings.get('gameplay', 'bestOf') || 3;
    const opp = opts.opponent || MM.opponent();
    return {
      id: U.uid('match'),
      mode: opts.mode || 'casual',
      target, bestOf,
      me: 0, opp: 0,
      setsMe: 0, setsOpp: 0,
      sets: [],
      set: 1,
      serve: opts.serve || 'me',
      serveLeft: Settings.get('gameplay', 'serveRule') === '1' ? 1 : 2,
      rally: null,
      running: false,
      paused: false,
      finished: false,
      startedAt: Date.now(),
      duration: 0,
      oppRating: opp.rating,
      oppName: opp.name,
      log: [],
      stats: { hits: 0, misses: 0, smashes: 0, longest: 0, pointsWon: 0, pointsLost: 0, aces: 0 }
    };
  },

  start(host) {
    this.stop();
    const h = host || this.s;
    if (!h) return;
    this.s = h;
    h.running = true;
    h.paused = false;
    this.tick();
  },

  stop() {
    if (this.s) this.s.running = false;
    clearInterval(this._t);
    clearTimeout(this._rally);
  },

  tick() {
    clearInterval(this._t);
    this._t = setInterval(() => {
      const s = this.s;
      if (!s || !s.running || s.paused || s.finished) return;
      s.duration += 1;
      const el = document.querySelector('[data-match-clock]');
      if (el) el.textContent = U.timeShort(s.duration);
      if (s.duration % 9 === 0 && Math.random() > .45) this.simulateRally();
    }, 1000);
  },

  /* Автоматический розыгрыш: ИИ соперника + наши настройки */
  simulateRally() {
    const s = this.s;
    if (!s || s.finished || s.paused || s.rally) return;
    s.rally = true;
    RALLY_LOCKED = true;
    const skill = U.clamp((S.settings.controls.sensitivity || 60) / 100, .3, .95);
    const oppSkill = .45 + Math.random() * .35;
    const myChance = U.clamp(.5 + (skill - oppSkill) * .6, .18, .82);
    const iWin = Math.random() < myChance;
    const ball = document.querySelector('#court .ball, [data-ball]');
    if (ball && !S.reducedMotion && S.settings.a11y.effectLevel !== 'low') {
      ball.animate([
        { transform: 'translate(0,0) scale(1)' },
        { transform: 'translate(' + (iWin ? 42 : -38) + 'px,-26px) scale(1.12)' },
        { transform: 'translate(' + (iWin ? 18 : -14) + 'px,6px) scale(.96)' }
      ], { duration: 620, easing: 'cubic-bezier(.3,.1,.4,1)' });
    }
    Sound.play(S.settings.audio.matchSounds ? 'hit' : 'click');
    Haptics.emit('light');
    this._rally = setTimeout(() => {
      s.rally = false;
      RALLY_LOCKED = false;
      this.point(iWin ? 'me' : 'opp', 'auto');
    }, 640);
  },

  /* Игрок бьёт: считается попадание, влияет на исход розыгрыша */
  hit() {
    const s = this.s;
    if (!s || s.finished) return { ok: false };
    if (s.paused) { toast2('Матч на паузе', 'warn', 1400); return { ok: false }; }
    const acc = U.clamp((S.settings.controls.sensitivity || 60) / 100 + (Math.random() - .5) * .3, .15, .97);
    const good = Math.random() < acc;
    s.stats.hits++;
    if (good) {
      s.stats.longest = Math.max(s.stats.longest, ++s.stats.current);
      if (Math.random() > .75) s.stats.smashes++;
    } else {
      s.stats.misses++;
      s.stats.current = 0;
    }
    Sound.play('hit');
    if (S.settings.controls.vibrationInRally) Haptics.emit(good ? 'light' : 'warning');
    this.render();
    if (!good) this.point('opp', 'miss');
    return { ok: good, accuracy: Math.round(acc * 100) };
  },

  point(who, reason = 'manual') {
    const s = this.s;
    if (!s || s.finished) return;
    if (who === 'me') { s.me++; s.stats.pointsWon++; if (reason === 'serve') s.stats.aces++; }
    else { s.opp++; s.stats.pointsLost++; }

    s.log.push({ set: s.set, me: s.me, opp: s.opp, who, reason, t: s.duration });

    if (!S.reducedMotion) openPop(who === 'me' ? 'pointWin' : 'pointLose');
    Sound.play(who === 'me' ? 'point' : 'lose');
    Haptics.emit(who === 'me' ? 'success' : 'warning');

    /* смена подачи: по 2 очка, при 10:10 — по одному */
    const deuce = s.me >= s.target - 1 && s.opp >= s.target - 1;
    s.serveLeft--;
    if (deuce || s.serveLeft <= 0) {
      s.serve = s.serve === 'me' ? 'opp' : 'me';
      s.serveLeft = deuce ? 1 : (Settings.get('gameplay', 'serveRule') === '1' ? 1 : 2);
    }

    this.render();
    if (this.setOver()) this.closeSet();
    else if (this.matchBall()) openPop('matchPoint');
  },

  setOver() {
    const s = this.s;
    if (!s) return false;
    const lead = Math.abs(s.me - s.opp);
    return (s.me >= s.target || s.opp >= s.target) && lead >= 2;
  },

  matchBall() {
    const s = this.s;
    const need = Math.ceil(s.bestOf / 2);
    const oneAway = (x) => x >= s.target - 1;
    return (s.setsMe === need - 1 && oneAway(s.me)) || (s.setsOpp === need - 1 && oneAway(s.opp));
  },

  closeSet() {
    const s = this.s;
    const mine = s.me > s.opp;
    s.sets.push({ me: s.me, opp: s.opp, won: mine });
    if (mine) s.setsMe++; else s.setsOpp++;
    openPop('setEnd');
    Sound.play(mine ? 'point' : 'lose');
    const need = Math.ceil(s.bestOf / 2);
    s.me = 0; s.opp = 0; s.set++;
    s.stats.current = 0;
    this.render();
    if (s.setsMe >= need || s.setsOpp >= need) this.finish();
  },

  finish() {
    const s = this.s;
    if (!s || s.finished) return;
    s.finished = true;
    s.running = false;
    this.stop();
    const win = s.setsMe > s.setsOpp;
    const rating = Ranked.apply(win, s.oppRating);
    const xp = win ? 150 + s.setsMe * 25 : 60;
    const coins = win ? 80 + s.setsMe * 20 : 30;
    const acc = U.pct(s.stats.hits, s.stats.hits + s.stats.misses);

    Log.add({
      id: s.id, res: win ? 'win' : 'lose',
      score: s.setsMe + ':' + s.setsOpp,
      sets: s.sets.slice(),
      opp: s.oppName, oppRating: s.oppRating,
      mode: s.mode === 'ranked' ? 'Рейтинг' : s.mode === 'tour' ? 'Турнир' : 'Блиц',
      date: U.dateShort(), dur: U.timeShort(s.duration),
      delta: rating.delta, acc, stats: s.stats, target: s.target
    });
    Store.addXp(xp);
    Store.addCoins(coins);
    Quests.progress('match', 1);
    Quests.progress(win ? 'win' : 'play', 1);
    Achievements.check();
    Daily.progress();
    if (rating.promoted) autoPopLater('rankChange', 1200);
    autoPopLater(win ? 'win' : 'lose', 650);
    this.render();
  },

  pause() {
    const s = this.s;
    if (!s) return;
    s.paused = true;
    RALLY_LOCKED = false;
    openPop('pause');
  },

  resume() {
    const s = this.s;
    if (!s) return;
    s.paused = false;
    closePop();
    toast2('Продолжаем', 'ok', 1400);
  },

  undo() {
    const s = this.s;
    const last = s && s.log[s.log.length - 1];
    if (!last) { toast2('Нечего отменять', 'warn', 1400); return; }
    s.log.pop();
    if (last.who === 'me') s.me = Math.max(0, s.me - 1); else s.opp = Math.max(0, s.opp - 1);
    toast2('Очко отменено', 'info', 1400);
    this.render();
  },

  render() {
    const s = this.s;
    if (!s) return;
    const bar = $('.matchbar');
    if (bar) {
      const sc = bar.querySelector('.sc b');
      if (sc) {
        const lead = s.me >= s.opp;
        sc.innerHTML = '<span class="' + (lead ? 'win' : 'op') + '">' + s.me + '</span><i>:</i><span class="' + (lead ? 'op' : 'win') + '">' + s.opp + '</span>';
      }
      const sub = bar.querySelector('.sc > span');
      if (sub) sub.textContent = 'сет ' + s.set + ' · сеты ' + s.setsMe + ':' + s.setsOpp + (s.target !== 11 ? ' · до ' + s.target : '');
      bar.querySelectorAll('.serve i').forEach((i, idx) => i.classList.toggle('on', idx < s.serveLeft && s.serve === 'me'));
      const sts = bar.querySelectorAll('.pl .st');
      if (sts[0]) sts[0].textContent = (s.serve === 'me' ? 'подача' : 'приём') + ' · ' + (PLATFORM.mobile ? 'mobile' : 'desktop');
      if (sts[1]) sts[1].textContent = (s.serve === 'opp' ? 'подача' : 'приём') + ' · ' + Ranked.tierOf(s.oppRating).name;
    }
    const hud = document.querySelector('[data-hud]');
    if (hud) {
      const meEl = hud.querySelector('[data-hud-me]');
      const opEl = hud.querySelector('[data-hud-opp]');
      if (meEl) meEl.textContent = s.me;
      if (opEl) opEl.textContent = s.opp;
      const setsEl = hud.querySelector('[data-hud-sets]');
      if (setsEl) setsEl.textContent = s.setsMe + ':' + s.setsOpp;
      const clock = hud.querySelector('[data-match-clock]');
      if (clock) clock.textContent = U.timeShort(s.duration);
    }
    const accEl = document.querySelector('[data-match-acc]');
    if (accEl) accEl.textContent = U.pct(s.stats.hits, s.stats.hits + s.stats.misses) + '%';

    /* живая статистика партии на экране матча */
    const live = [
      ['[data-st-hits]', s.stats.hits],
      ['[data-st-misses]', s.stats.misses],
      ['[data-st-smashes]', s.stats.smashes],
      ['[data-st-longest]', s.stats.longest]
    ];
    live.forEach(([sel, val]) => { const el = document.querySelector(sel); if (el) el.textContent = val; });
    const accBox = document.querySelector('[data-st-acc]');
    if (accBox) accBox.textContent = U.pct(s.stats.hits, s.stats.hits + s.stats.misses) + '% точность';
    const clockEl = document.querySelector('.serve-row .mono');
    if (clockEl) clockEl.textContent = U.timeShort(s.duration);
  }
};
window.MatchEngine = MatchEngine;

/* Подменяем старый объект Match на движок, сохраняя прежний API */
Match.reset = function (opts = {}) { this.s = MatchEngine.newMatch(opts); MatchEngine.s = this.s; this.render(); };
Match.start = function () { if (!this.s) this.reset(); MatchEngine.start(this.s); this.active = true; };
Match.stop = function () { MatchEngine.stop(); this.active = false; RALLY_LOCKED = false; };
Match.hit = function () { return MatchEngine.hit(); };
Match.addPoint = function (who) { MatchEngine.point(who, 'manual'); };
Match.closeSet = function () { MatchEngine.closeSet(); };
Match.finish = function () { MatchEngine.finish(); };
Match.render = function () { MatchEngine.render(); };
Match.pause = function () { MatchEngine.pause(); };
Match.resume = function () { MatchEngine.resume(); };
Match.undo = function () { MatchEngine.undo(); };
window.Match = Match;

const DRILLS = {

  smash: { name: 'Смэш-серия', icon: 'bolt', accent: 'coral', goal: 12, hint: '5 смэшей подряд в левый угол', xp: 60, coins: 35 },
  serve: { name: 'Подача-обманка', icon: 'target', accent: 'sky', goal: 12, hint: '12 подач без ошибки', xp: 25, coins: 15 },
  reaction: { name: 'Реакция', icon: 'clock', accent: 'violet', goal: 20, hint: 'Отбей 20 быстрых мячей', xp: 35, coins: 20 },
  footwork: { name: 'Работа ног', icon: 'sword', accent: 'gold', goal: 16, hint: 'Успей к 16 коротким мячам', xp: 45, coins: 30 }
};

const Drill = {
  active: null,
  start(kind = 'spiral', goal) {
    const base = DRILLS[kind] || DRILLS.spiral;
    this.active = {
      kind,
      name: base.name,
      goal: goal || base.goal,
      hits: 0, misses: 0, streak: 0, best: 0,
      startedAt: Date.now(), elapsed: 0, done: false
    };
    clearInterval(this._t);
    this._t = setInterval(() => {
      if (!this.active || CURRENT !== 'practice') return;
      this.active.elapsed = Math.floor((Date.now() - this.active.startedAt) / 1000);
      const el = $('#pTime');
      if (el) el.textContent = U.timeShort(this.active.elapsed);
    }, 500);
    return this.active;
  },
  stop() { clearInterval(this._t); },
  hit() {
    const a = this.active;
    if (!a || a.done) return null;
    const good = Math.random() < U.clamp((S.settings.controls.sensitivity || 60) / 100 + .18, .3, .96);
    if (good) { a.hits++; a.streak++; a.best = Math.max(a.best, a.streak); }
    else { a.misses++; a.streak = 0; }
    Sound.play('hit');
    Haptics.emit(good ? 'light' : 'warning');
    const p = $('#pCount'), bar = $('#pBar'), pct = $('#pPct'), acc = $('#pAcc');
    if (p) p.textContent = a.hits;
    if (bar) bar.style.width = U.clamp(a.hits / a.goal * 100, 0, 100) + '%';
    if (pct) pct.textContent = U.clamp(Math.round(a.hits / a.goal * 100), 0, 100) + '%';
    if (acc) acc.textContent = U.pct(a.hits, a.hits + a.misses) + '%';
    if (a.hits >= a.goal) {
      a.done = true;
      this.stop();
      const base = DRILLS[a.kind] || DRILLS.spiral;
      Log.addDrill({ id: U.uid('drill'), name: a.name, hits: a.hits, misses: a.misses, acc: U.pct(a.hits, a.hits + a.misses), best: a.best, dur: U.timeShort(a.elapsed), xp: base.xp });
      Store.addXp(base.xp);
      Store.addCoins(base.coins);
      Quests.progress('train', 1);
      Daily.progress();
      Achievements.check();
      setTimeout(() => go('practice-result'), 420);
    }
    return { good, hits: a.hits, goal: a.goal };
  }
};

/* ------------------------------------------------------------
   11. АНАЛИТИКА: считается из реальных матчей
   ------------------------------------------------------------ */
const Analytics = {
  metrics() {
    const all = Log.all();
    const accs = all.map((m) => m.acc || 0).filter(Boolean);
    const durations = all.map((m) => { const p = String(m.dur || '0:0').split(':'); return (+p[0]) * 60 + (+p[1] || 0); });
    const byMode = U.group(all, (m) => m.mode);
    return {
      accuracy: Math.round(U.avg(accs)) || 0,
      avgDuration: U.timeShort(U.avg(durations)),
      modes: Object.keys(byMode).map((k) => ({ mode: k, count: byMode[k].length, winrate: U.pct(byMode[k].filter((m) => m.res === 'win').length, byMode[k].length) })),
      form: all.slice(0, 10).map((m) => (m.res === 'win' ? 1 : 0)),
      best: all.filter((m) => m.acc).sort((a, b) => b.acc - a.acc)[0] || null
    };
  },
  ratingSeries(points = 12) {
    const all = Log.all().slice(0, points).reverse();
    let r = S.rating - U.sum(all.map((m) => m.delta || 0));
    return all.map((m) => { r += (m.delta || 0); return Math.max(0, r); }).concat([S.rating]).slice(-points);
  },
  sparkPath(values, w = 300, h = 90) {
    if (!values.length) return '';
    const min = Math.min(...values), max = Math.max(...values);
    const span = max - min || 1;
    return values.map((v, i) => {
      const x = (i / Math.max(1, values.length - 1)) * w;
      const y = h - ((v - min) / span) * (h - 14) - 7;
      return (i ? 'L' : 'M') + U.round(x, 1) + ' ' + U.round(y, 1);
    }).join(' ');
  }
};
window.Analytics = Analytics;

  ensure() {
    if (!S.quests || !S.quests.daily || !S.quests.daily.length) {
      S.quests = { daily: QUEST_POOL.daily.map((q) => ({ ...q, progress: 0, claimed: false })), weekly: QUEST_POOL.weekly.map((q) => ({ ...q, progress: 0, claimed: false })), resetAt: Date.now() + 86400000 };
    }
    return S.quests;
  },
  progress(kind, n = 1) {
    const q = this.ensure();
    ['daily', 'weekly'].forEach((bucket) => {
      q[bucket].forEach((quest) => {
        if (quest.claimed || quest.progress >= quest.goal) return;
        if (quest.kind === kind) {
          quest.progress = Math.min(quest.goal, quest.progress + n);
          if (quest.progress >= quest.goal) autoPopLater('questComplete', 700);
        }
      });
    });
    saveState();
  },
  claim(bucket, id) {
    const q = this.ensure();
    const quest = q[bucket].find((x) => x.id === id);
    if (!quest || quest.claimed) return false;
    if (quest.progress < quest.goal) { toast2('Ещё не выполнено', 'warn'); return false; }
    quest.claimed = true;
    if (quest.reward.coins) Store.addCoins(quest.reward.coins);
    if (quest.reward.gems) Store.addGems(quest.reward.gems);
    if (quest.reward.xp) Store.addXp(quest.reward.xp);
    saveState();
    renderScreen(CURRENT);
    return true;
  },
  resetsIn() {
    const q = this.ensure();
    const ms = Math.max(0, q.resetAt - Date.now());
    return Math.floor(ms / 3600000) + ' ч ' + Math.floor((ms % 3600000) / 60000) + ' мин';
  }
};

   21. ТУРНИРЫ: сетка, симуляция, призы
   ------------------------------------------------------------ */
const Cup = {
  ensure() {
    if (!S.cups) {
      S.cups = TOURNAMENTS.map((t) => ({
        ...t,
        entrants: TOURNAMENTS.length ? U.range(t.max).map((i) => (i === 0 ? 'Ты' : BOTS[i % BOTS.length].name)) : [],
        bracket: null,
        myPlace: null
      }));
    }
    return S.cups;
  },
  byId(id) { return this.ensure().find((c) => c.id === id) || this.ensure()[0]; },
  register(id) {
    const c = this.byId(id);
    if (c.joined) { toast2('Ты уже зарегистрирован', 'info'); return; }
    const fee = 60;
    if (!Store.spend(fee)) { openPop('buyErr'); return; }
    c.joined = true;
    c.players = Math.min(c.max, c.players + 1);
    if (!c.entrants.includes('Ты')) c.entrants.push('Ты');
    saveState();
    openPop('tournamentReg');
  },
  buildBracket(id) {
    const c = this.byId(id);
    if (c.bracket) return c.bracket;
    const players = U.shuffle(c.entrants.slice(0, c.max));
    const rounds = [];
    let current = players.map((p) => ({ a: p, b: null, score: null }));
    let roundNo = 1;
    while (current.length > 0) {
      rounds.push({ name: current.length === 1 ? 'Финал' : current.length === 2 ? '1/2' : 'R' + roundNo, pairs: current });
      const next = [];
      for (let i = 0; i < current.length; i += 2) {
        next.push({ a: null, b: null, score: null });
      }
      if (next.length === 1 && current.length === 1) break;
      current = next;
      roundNo++;
      if (roundNo > 6) break;
    }
    c.bracket = rounds;
    saveState();
    return rounds;
  },
  simulate(id) {
    const c = this.byId(id);
    const rounds = this.buildBracket(id);
    rounds.forEach((round) => {
      round.pairs.forEach((p) => {
        if (!p.a) return;
        if (!p.b) { p.winner = p.a; return; }
        const win = Math.random() > .45 ? p.a : p.b;
        p.winner = win;
        p.score = win === p.a ? '11:8' : '8:11';
      });
    });
    let idx = 0;
    for (let r = 0; r < rounds.length; r++) {
      if (r === 0) continue;
      let k = 0;
      for (let i = 0; i < rounds[r].pairs.length; i++) {
        const prev = rounds[r - 1].pairs.slice(k, k + 2).map((p) => p.winner);
        rounds[r].pairs[i].a = prev[0] || null;
        rounds[r].pairs[i].b = prev[1] || null;
        const win = !rounds[r].pairs[i].b ? rounds[r].pairs[i].a : (Math.random() > .5 ? rounds[r].pairs[i].a : rounds[r].pairs[i].b);
        rounds[r].pairs[i].winner = win;
        rounds[r].pairs[i].score = !rounds[r].pairs[i].b ? '—' : (win === rounds[r].pairs[i].a ? '11:9' : '9:11');
        k += 2;
        idx++;
      }
    }
    const final = rounds[rounds.length - 1].pairs[0];
    c.champion = final.winner;
    const myRound = rounds.findIndex((r) => r.pairs.some((p) => (p.a === 'Ты' || p.b === 'Ты') && p.winner !== 'Ты'));
    c.myPlace = myRound === -1 ? 1 : myRound;
    S.tourBest = Math.min(S.tourBest || 99, c.myPlace);
    saveState();
    return c;
  },
  prizes(id) {
    const c = this.byId(id);
    return [
      { place: 1, reward: c.prize, points: 250 },
      { place: 2, reward: '50% призовых', points: 150 },
      { place: '3–4', reward: '25% призовых', points: 90 },
      { place: '5–8', reward: '120 монет', points: 40 }
    ];
  }
};

  },
  step(d) {
    const frames = this.frames(this.matchId);
    this.pos = U.clamp(this.pos + d, 0, frames.length - 1);
    renderScreen('replay');
  },
  current() {
    const frames = this.frames(this.matchId);
    return frames[U.clamp(this.pos, 0, frames.length - 1)] || frames[0];
  }
};

function exportHistory() {
  const rows = Log.all();
  const csv = ['дата;соперник;режим;счёт;рейтинг;точность;длительность']
    .concat(rows.map((m) => [m.date, m.opp, m.mode, m.score, (m.delta > 0 ? '+' : '') + m.delta, (m.acc || 0) + '%', m.dur].join(';')))
    .join('\n');
  copyText(csv);
  toast2('CSV скопирован в буфер (' + rows.length + ' матчей)', 'ok', 2400);
}

overrideRender('match-review', function () {
  const m = Log.all()[0];
  const st = (m && m.stats) || {};
  const acc = m ? m.acc : 0;
  const tips = [];
  if (acc < 70) tips.push(['Удары уходят в аут', 'Держи ракетку ниже: точность растёт на 8–12% при подготовке за 0.2 с']);
  if ((st.misses || 0) > 4) tips.push(['Много промахов на приёме', 'Попробуй тренировку «Реакция» — она тренирует короткий замах']);
  if ((st.smashes || 0) < 3) tips.push(['Мало агрессии', 'Смэш с 3-й зоны: включай в розыгрыш хотя бы один за сет']);
  if (!tips.length) tips.push(['Хорошая игра', 'Точность выше 70% — можно переходить в рейтинговый пул']);
  return wrap(`
  ${topBar({ back: 'post-summary', title: 'Разбор', sub: m ? m.opp + ' · ' + m.score : 'матч' })}
  <div class="row mt-s">
    ${ui.stat('Точность', acc + '%', 'по ударам', acc >= 70 ? 'teal' : 'coral')}

    ${ui.stat('Серия', st.longest || 0, 'лучшая', 'sky')}

  ${ui.section('Что улучшить')}

      ${p.premium ? `<span class="badge ${prem ? 'b-gold' : 'b-mut'}" onclick="event.stopPropagation(); Pass.claim(${tier}, true)">${prem ? ico('check', 'i i-14') + ' premium' : 'premium'}</span>` : ''}

  };

function sendDM() {
  const input = document.querySelector('#chatField');
  const text = (input && input.value || '').trim();
  if (!text) { toast2('Введите сообщение', 'warn', 1400); return; }
  Social.send('dm-maxim', text);
  const box = document.querySelector('#chatList');
  const typing = document.querySelector('#chatTyping');
  if (box) box.insertAdjacentHTML('beforeend', chatBubble('АС', U.escape(text), U.clock(), true, '✓'));
  if (input) input.value = '';
  Haptics.emit('light');
  Sound.play('click');
  if (typing) typing.style.display = 'flex';
  setTimeout(() => {
    const reply = U.pick(['Ок, создаю лобби', 'Даю 5 минут и стартуем', 'Готов, отправляй вызов', 'Только не короткие подачи']);
    Social.send('dm-maxim-reply', reply);
    if (box) box.insertAdjacentHTML('beforeend', chatBubble('МД', U.escape(reply), U.clock(), false));
    if (typing) typing.style.display = 'none';
    Sound.play('point');
  }, 1100);
}
window.sendDM = sendDM;
