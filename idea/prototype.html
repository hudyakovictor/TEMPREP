function runEngineTests() {
  window.__quiet = true;
  const list = [
    ['Матч: счёт и сеты', () => { Match.reset({ target: 11, bestOf: 3 }); Match.addPoint('me'); Match.addPoint('opp'); Match.addPoint('me'); const ok = MatchEngine.s.me === 2 && MatchEngine.s.opp === 1; Match.stop(); return ok; }],
    ['Подача: смена очков', () => { Match.reset(); const before = MatchEngine.s.serve; MatchEngine.point('me'); MatchEngine.point('me'); const ok = MatchEngine.s.serve !== before; Match.stop(); return ok; }],
    ['Мачбол определяется', () => { Match.reset({ bestOf: 3 }); MatchEngine.s.setsMe = 1; MatchEngine.s.me = 10; MatchEngine.s.opp = 5; return MatchEngine.matchBall(); }],
    ['Тренировка: удары', () => { Drill.start('spiral', 30); for (let i = 0; i < 5; i++) Drill.hit(); const a = Drill.active; const ok = a.hits + a.misses === 5; Drill.stop(); return ok; }],
    ['Задания: прогресс', () => { const q = Quests.ensure().daily[0]; q.progress = 0; Quests.progress('match', 1); return Quests.ensure().daily[0].progress >= 1; }],
    ['Пропуск: уровень', () => { const l = Pass.level(); Pass.add(240); return Pass.level() >= l; }],
    ['Лидерборд', () => Board.list('global').some((x) => x.isMe)],
    ['Рейтинг: дельта', () => typeof Ranked.delta(true, 2200) === 'number'],
    ['Соцсеть: ЛС', () => { Social.send('test-thread', 'ping'); return Social.messages('test-thread').some((m) => m.t === 'ping'); }],
    ['Клуб: война', () => { const before = Club.ensure().war.mine; Club.addPoints(10); return Club.ensure().war.mine === before + 10; }],
    ['Турнир: сетка', () => { const c = Cup.ensure()[0]; Cup.simulate(c.id); return (c.bracket || []).length >= 2 && !!c.champion; }],
    ['Настройки', () => { Settings.set('gameplay', 'target', 21); const ok = Settings.get('gameplay', 'target') === 21; Settings.set('gameplay', 'target', 11); return ok; }],
    ['Календарь', () => { const d = Daily.ensure(); return Array.isArray(d.days) && d.days.length === 7; }]
  ];
  window.__engineResults = list.map(([name, fn]) => {
    try { return { name, ok: !!fn() }; } catch (err) { return { name, ok: false, err: err.message }; }
  });
  setTimeout(() => { window.__quiet = false; }, 900);
  const ok = window.__engineResults.filter((x) => x.ok).length;
  toast2('Проверки: ' + ok + ' / ' + list.length, ok === list.length ? 'ok' : 'warn', 2600);
  renderScreen('engine-console');
}
window.runEngineTests = runEngineTests;

/* ------------------------------------------------------------
   1. РЕЕСТР: дубликаты экранов (6 настроек определялись дважды)
   ------------------------------------------------------------ */
function dedupeRegistry() {
  const lastById = new Map();
  SCREEN_REGISTRY.forEach((s, i) => lastById.set(s.id, i));
  const out = [];
  const seen = new Set();
  SCREEN_REGISTRY.forEach((s) => {
    if (seen.has(s.id)) return;
    seen.add(s.id);
    out.push(SCREEN_REGISTRY[lastById.get(s.id)]);   // позиция первого, реализация последнего
  });
  SCREEN_REGISTRY.length = 0;
  out.forEach((s) => SCREEN_REGISTRY.push(s));
  return out.length;
}

/* дальше defineScreen всегда заменяет существующий экран, а не дублирует */
const defineScreenRaw = defineScreen;
defineScreen = function (def) {
  const i = SCREEN_REGISTRY.findIndex((s) => s.id === def.id);
  if (i >= 0) SCREEN_REGISTRY[i] = def;
  else defineScreenRaw(def);
};
window.defineScreen = defineScreen;

const REGISTRY_BEFORE = SCREEN_REGISTRY.length;
dedupeRegistry();
const REGISTRY_DEDUPED = REGISTRY_BEFORE - SCREEN_REGISTRY.length;

const ICON_FALLBACKS = {
  gold: 'coin', crystal: 'gem', money: 'coin', coin2: 'coin', rank: 'medal', card: 'cards',
  layer: 'cards', rocket: 'fire', energy: 'bolt', net: 'wifi', trophy2: 'trophy', spark: 'star'
};

function ensureIcon(name) {
  const clean = String(name || '').replace(/^#i-/, '');
  if (!clean) return 'info';
  if (document.querySelector('#i-' + clean)) return clean;
  const sprite = document.querySelector('#sprite, body > svg');
  const base = document.querySelector('#i-' + (ICON_FALLBACKS[clean] || 'info'));
  if (sprite && base) {
    const clone = base.cloneNode(true);
    clone.id = 'i-' + clean;
    sprite.appendChild(clone);
    return clean;
  }
  return ICON_FALLBACKS[clean] || 'info';
}
window.ensureIcon = ensureIcon;

function healIcons(root) {
  let fixed = 0;
  root.querySelectorAll('svg use').forEach((u) => {
    const href = u.getAttribute('href') || '';
    if (!href || document.querySelector(href)) return;
    const name = ensureIcon(href);
    u.setAttribute('href', '#i-' + name);
    fixed++;
  });
  return fixed;
}

   ------------------------------------------------------------ */
let fixLastFocused = null;
const focusTrap = {
  el: null,
  onKey(e) {
    if (e.key !== 'Tab' || !focusTrap.el) return;
    const items = Array.from(focusTrap.el.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
      .filter((x) => x.offsetParent && !x.disabled);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
};
document.addEventListener('keydown', focusTrap.onKey);

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') { e.target.blur(); return; }
  if (typeof Palette !== 'undefined' && Palette.open) { closePalette(); return; }

};

function downloadText(filename, text, mime = 'text/plain;charset=utf-8') {
  try {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    return true;
  } catch (e) { return false; }
}

const STATE_VERSION = 9;
(function migrateState() {
  try {
    const raw = localStorage.getItem('ttu-state-v1');
    if (!raw) { localStorage.setItem('ttu-state-version', String(STATE_VERSION)); return; }
    const parsed = JSON.parse(raw);
    const ver = Number(parsed.__v || 1);
    if (ver < STATE_VERSION) {
      parsed.__v = STATE_VERSION;
      if (!parsed.settings) parsed.settings = null;
      if (!Array.isArray(parsed.matches)) parsed.matches = null;
      localStorage.setItem('ttu-state-v1', JSON.stringify(parsed));
      localStorage.setItem('ttu-state-version', String(STATE_VERSION));
    }
  } catch (e) {
    try { localStorage.removeItem('ttu-state-v1'); } catch (e2) {}
  }
})();

  else s.opp = Math.max(0, s.opp - 1);
  if (s.sets.length && s.me === 0 && s.opp === 0) {

    if (set.won) s.setsMe = Math.max(0, s.setsMe - 1); else s.setsOpp = Math.max(0, s.setsOpp - 1);
    s.me = set.me; s.opp = set.opp; s.set = Math.max(1, s.set - 1);

/* ---------------------------------------------------------------------------
   3. НОРМАЛИЗАЦИЯ ЦВЕТА ТЕКСТА  (UX-03)
   Ахроматичные оттенки сводим к четырём уровням, акценты не трогаем.
   --------------------------------------------------------------------------- */

  if (csrgb) {

  let fixed = 0;

    if (!(el.textContent || '').trim()) return;
    const directText = [...el.childNodes].some((n) => n.nodeType === 3 && n.nodeValue.trim());
    if (el.children.length && !directText) return;
    if (el.closest('.btn.coral, .btn.teal, .btn.sky, .btn.coral-soft, .btn.teal-soft, .nav')) return;
    const cs = getComputedStyle(el);
    const rgb = uxParseRGB(cs.color);

    if (sat > 0.28) {

      const ACCENTS = uxAccentPalette();
      let acc = ACCENTS[0], accD = 999;
      ACCENTS.forEach((c) => {
        const d = Math.abs(c[0] - rgb[0]) + Math.abs(c[1] - rgb[1]) + Math.abs(c[2] - rgb[2]);

    const key = label.toLowerCase();
    const n = seen.get(key) || 0;
    seen.set(key, n + 1);
    if (n === 0) return;
    const ctx = uxContextOf(b);
    if (!ctx || key.includes(ctx.toLowerCase())) return;
    /* контекст нужен скринридеру, а не глазам: раньше он дописывался в видимую
       подпись, и кнопка «в процессе» превращалась в «в процессе · Выиграть 2 матча» */
    b.setAttribute('aria-label', label + ' · ' + ctx);
    fixed++;
  });
  return fixed;
}

/* ---------------------------------------------------------------------------
   7. СЕКЦИИ: экраны без заголовков получают групповой заголовок (UX-11)
   --------------------------------------------------------------------------- */
function uxSectionize(root, id) {
  if (root.querySelector('.sec')) return 0;
  const def = SCREEN_REGISTRY.find((s) => s.id === id);
  const anchor = root.querySelector('.tbar, .crumbs') || root.firstElementChild;
  const target = [...root.children].find((el) => !el.classList.contains('tbar') && !el.classList.contains('crumbs'));
  if (!target) return 0;
  const sec = document.createElement('div');
  sec.className = 'sec ux-sec';
  sec.innerHTML = `<h2>${(def && def.group) || 'Обзор'}</h2>`;
  target.parentNode.insertBefore(sec, target);
  return 1;
}

/* ---------------------------------------------------------------------------
   8. ХЛЕБНЫЕ КРОШКИ  (UX-32)
   Путь строится по цепочке `back`, которую отдаёт topBar.
   --------------------------------------------------------------------------- */
function uxBackOf(id) {
  const def = SCREEN_REGISTRY.find((s) => s.id === id);
  if (!def) return null;
  let back = def.back || null;
  if (!back) {
    try {
      const html = def.render ? def.render() : '';
      const m = html.match(/class="iconbtn" onclick="go\('([^']+)'\)"/);
      if (m) back = m[1];
    } catch (e) {}
  }
  if (!back) back = NAV_TABS.some((t) => t.id === id) ? null : 'hub';
  return back === id ? null : back;
}
function uxPath(id, depth = 0, acc = []) {
  if (!id || depth > 5) return acc;
  const back = uxBackOf(id);
  if (!back || acc.includes(back)) return [back || 'hub'].filter(Boolean).concat(acc);
  return uxPath(back, depth + 1, [back].concat(acc));
}
function uxCrumbs(root, id) {
  if (root.querySelector('.crumbs')) return 0;
  /* Корневые табы — не «глубина», а сама верхняя точка: крошки от хаба до хаба
     только дублируют заголовок экрана */
  if (NAV_TABS.some((t) => t.id === id)) return 0;
  if (['splash', 'welcome', 'hub'].includes(id)) return 0;
  const chain = [];
  uxPath(id).forEach((pid) => { if (pid !== id && !chain.includes(pid) && pid !== 'hub') chain.push(pid); });
  const path = chain.slice(-2);
  const def = SCREEN_REGISTRY.find((s) => s.id === id);
  if (!def) return 0;
  const parts = path.map((pid) => {
    const d = SCREEN_REGISTRY.find((s) => s.id === pid);
    return `<span class="lnk" onclick="go('${pid}')">${d ? d.title : pid}</span><span class="sep">›</span>`;
  }).join('');
  /* если экран сам печатает свой заголовок крупно — в крошках он лишний */
  const h1 = root.querySelector('.h1');
  const dupTitle = h1 && h1.textContent.trim() === def.title;
  if (dupTitle && !parts) return 0; // остался бы висячий «Хаб ›» без продолжения
  const el = document.createElement('div');
  el.className = 'crumbs';
  el.innerHTML = `<span class="lnk" onclick="go('hub')">Хаб</span><span class="sep">›</span>${parts}${dupTitle ? '' : `<span class="cur">${def.title}</span>`}`;
  if (!dupTitle && !parts) el.innerHTML = `<span class="cur">${def.title}</span>`;
  const tbar = root.querySelector('.tbar');
  if (tbar && tbar.nextSibling) tbar.parentNode.insertBefore(el, tbar.nextSibling);
  else root.insertBefore(el, root.firstChild);
  return 1;
}

/* ---------------------------------------------------------------------------
   9. СВЯЗАННЫЕ ЭКРАНЫ: листья больше не «тупики» (UX-34)
   Группы в реестре — служебные: «Корневые», «QA», «Системные». Наружу
   отдаём только человеческие названия, а на корневых вкладках блок не ставим
   вовсе — он вёл в никуда и дублировал нижнее меню.
   --------------------------------------------------------------------------- */
const UX_GROUP_TITLES = {
  'Настройки': 'Настройки', 'Магазин': 'Магазин', 'Профиль': 'Профиль',
  'Турниры': 'Турниры', 'Онлайн': 'Онлайн-матчи', 'Соц': 'Друзья',
  'Карьера': 'Карьера', 'Прогресс': 'Прогресс', 'Практика': 'Тренировки',
  'Пост-матч': 'Итоги матча', 'Корневые': 'Разделы', 'Онбординг': 'Первый запуск'
};

function uxRelated(root, id) {
  if (root.querySelector('.ux-related')) return 0;
  if (NAV_TABS.some((t) => t.id === id)) return 0;
  // в матче, на тренировке и в онбординге любой блок навигации — шум
  if (['match', 'practice', 'splash', 'welcome'].includes(id)) return 0;
  const def = SCREEN_REGISTRY.find((s) => s.id === id);
  if (!def) return 0;
  const groupTitle = UX_GROUP_TITLES[def.group];
  if (!groupTitle) return 0;
  const siblings = SCREEN_REGISTRY
    .filter((s) => s.group === def.group && s.id !== id && !NAV_TABS.some((t) => t.id === s.id))
    .slice(0, 4);
  if (!siblings.length) return 0;
  // крошки уже дают дорогу назад; если их нет — оставляем якорь на Хаб
  const needHome = !root.querySelector('.crumbs');
  const box = document.createElement('div');
  box.className = 'ux-related';
  box.innerHTML = `
    <div class="ttl">Ещё в разделе · ${groupTitle}</div>
    <div class="lnks">
      ${siblings.map((s) => `<span class="lnk" onclick="go('${s.id}')">${s.title}</span>`).join('')}
      ${needHome ? `<span class="lnk" onclick="go('hub')">${ico('home', 'i i-16')} Хаб</span>` : ''}
    </div>`;
  const sc = root.querySelector('.scroll') || root;
  sc.appendChild(box);
  return 1;
}

/* ---------------------------------------------------------------------------
   10. РАЗГРУЗКА ЭКРАНОВ: > 12 действий → «Ещё N действий» (UX-09)
   --------------------------------------------------------------------------- */
function uxDeclutter(root) {
  const sc = root.querySelector('.scroll') || root;
  const rect = sc.getBoundingClientRect();
  const acts = [...root.querySelectorAll('button, .list-row[onclick], .press[onclick]')]
    .filter((el) => {
      const r = el.getBoundingClientRect();
      return r.top < rect.bottom && r.bottom > rect.top;
    });
  if (acts.length <= 12) return 0;
  let movable = acts
    .slice(8)
    .filter((el) => !el.closest('.ux-more') && !el.classList.contains('nav') && el.tagName === 'BUTTON');
  if (movable.length < 3) return 0;
  /* сначала убираем только вторичные кнопки, при нехватке — строки-действия */
  const ghosts = movable.filter((el) => el.classList.contains('ghost') && el.classList.contains('btn'));
  if (ghosts.length >= 2) movable = ghosts;
  const details = document.createElement('details');
  details.className = 'ux-more';
  details.innerHTML = `<summary>Ещё ${movable.length} действий</summary><div class="inner"></div>`;
  const inner = details.querySelector('.inner');
  movable.forEach((el) => inner.appendChild(el));
  sc.appendChild(details);
  return movable.length;
}

/* ---------------------------------------------------------------------------
   11. ГЛОССАРИЙ: единые термины и русские названия (UX-26, 38)
   --------------------------------------------------------------------------- */
UX.glossary = {
  terms: [
    ['Loading', 'Загрузка'], ['Error', 'Ошибка'], ['Settings', 'Настройки'],
    ['Profile', 'Профиль'], ['Shop', 'Магазин'], ['Friends', 'Друзья'],
    ['Reward', 'Награда'], ['Daily', 'Ежедневно'], ['Weekly', 'Неделя'],
    ['Season', 'Сезон'], ['Continue', 'Продолжить'], ['Close', 'Закрыть'],
    ['Retry', 'Повторить'], ['Search', 'Поиск'], ['Level', 'Уровень'],
    ['Coins', 'Монеты'], ['Ranked', 'Рейтинг'], ['Casual', 'Товарищеский']
  ],
  synonyms: [
    ['Кредиты', 'Монеты'], ['кредитов', 'монет'], ['гемы', 'кристаллы'],
    ['Гемы', 'Кристаллы'], ['очки рейтинга', 'рейтинг'], ['Пропуск сезона', 'Сезонный пропуск']
  ]
};
function uxApplyGlossary(root) {
  let fixed = 0;
  const skip = (el) => el.closest('.ux-nosnap, .pop-en, [data-nogloss]');
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach((node) => {
    const el = node.parentElement;
    if (!el || skip(el)) return;
    let t = node.nodeValue;
    if (!t || !/[А-Яа-яA-Za-z]/.test(t)) return;
    let next = t;
    UX.glossary.terms.forEach(([en, ru]) => {
      const re = new RegExp('\\b' + en + '\\b', 'g');
      if (re.test(next)) { next = next.replace(re, ru); fixed++; }
    });
    UX.glossary.synonyms.forEach(([bad, good]) => {
      if (next.includes(bad)) { next = next.split(bad).join(good); fixed++; }
    });
    if (next !== t) node.nodeValue = next;
  });
  return fixed;
}

/* ---------------------------------------------------------------------------
   12. ФОРМАТЫ ЧИСЕЛ, ДАТ И ДЕНЕГ (UX-39)
   --------------------------------------------------------------------------- */
UX.fmt = {
  num(n) {
    const v = Math.round(Number(n) || 0);
    return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, '\u2009');
  },
  money(n, cur = '₵') { return UX.fmt.num(n) + ' ' + cur; },
  pct(part, all) { return all ? Math.round((part / all) * 100) : 0; },
  date(d = new Date()) {
    const p = (x) => String(x).padStart(2, '0');
    return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear();
  },
  time(d = new Date()) { const p = (x) => String(x).padStart(2, '0'); return p(d.getHours()) + ':' + p(d.getMinutes()); },
  short(n) { return n >= 10000 ? (n / 1000).toFixed(1).replace('.0', '') + 'K' : UX.fmt.num(n); }
};

function uxFormatNumbers(root) {
  let fixed = 0;
  root.querySelectorAll('.wallet .count, .kv .v, .stat-b b, .kpi .v, .mono').forEach((el) => {
    if (el.children.length) return;
    const raw = (el.textContent || '').trim();
    if (!/^\d{4,}$/.test(raw)) return;
    el.textContent = UX.fmt.num(raw);
    fixed++;
  });
  return fixed;
}

/* ---------------------------------------------------------------------------
   13. СОСТОЯНИЕ «ВЫПОЛНЯЕТСЯ» ДЛЯ АСИНХРОННЫХ ДЕЙСТВИЙ (UX-13)
   Кнопка покупки, получения награды и регистрации показывает спиннер,
   блокируется от двойного нажатия и снимает состояние по завершении.
   --------------------------------------------------------------------------- */
UX.busy = function (btn, on) {
  if (!btn) return false;
  if (on) {
    btn.dataset.busy = '1';
    btn.setAttribute('aria-busy', 'true');
    btn.setAttribute('aria-disabled', 'true');
    if (!btn.querySelector('.btn-label') && btn.textContent.trim()) {
      btn.innerHTML = `<span class="btn-label">${btn.textContent.trim()}</span>`;
    }
  } else {
    delete btn.dataset.busy;
    btn.removeAttribute('aria-busy');
    btn.removeAttribute('aria-disabled');
  }
  return on;
};

const UX_ASYNC_RE = /Market\.buy|Quests\.claim|Pass\.claim|Daily\.claim|Cup\.register|Social\.(addFriend|invite|send)|Club\.(join|create)|Notifs\.readAll|Achievements\.check/;

function uxMarkAsync(root) {
  let n = 0;
  root.querySelectorAll('button').forEach((b) => {
    const oc = b.getAttribute('onclick') || '';
    if (UX_ASYNC_RE.test(oc) && !b.dataset.async) { b.dataset.async = '1'; n++; }
  });
  return n;
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-async]');
  if (!btn || btn.dataset.uxBusyCycle) return;
  e.preventDefault();
  e.stopPropagation();
  haptic('light');
  UX.busy(btn, true);
  setTimeout(() => {
    UX.busy(btn, false);
    btn.dataset.uxBusyCycle = '1';
    try { btn.click(); } catch (err) {}
    setTimeout(() => { delete btn.dataset.uxBusyCycle; }, 30);
  }, 320);
}, true);

/* ---------------------------------------------------------------------------
   14. ОТМЕНА ДЕЙСТВИЙ (UX-40)
   Каждое необратимое действие даёт тост с «Отменить» и откатывает состояние.
   --------------------------------------------------------------------------- */
UX.undoCount = function () { return UX.undoStack.length; };

UX.toastAction = function (text, actionLabel, action, ms = 4200, tone = 'ok') {
  const host = $('#toasts');
  if (!host) return null;
  const el = document.createElement('div');
  el.className = 'toast action ' + (tone === 'ok' ? '' : tone);
  el.innerHTML = `
    <span class="tico">${ico(tone === 'err' ? 'x' : tone === 'warn' ? 'warn' : 'check', 'i i-16')}</span>
    <span class="u-minw0 grow">${text}</span>
    <button class="t-act">${actionLabel}</button>
    <span class="t-bar" style="animation-duration:${ms}ms"></span>`;
  host.appendChild(el);
  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 200); };
  el.querySelector('.t-act').addEventListener('click', () => { try { action(); } catch (e) {} kill(); });
  setTimeout(kill, ms);
  return el;
};

UX.undoable = function (text, undoFn, redoFn) {
  const entry = { text, undoFn, at: Date.now() };
  UX.undoStack.push(entry);
  if (UX.undoStack.length > 20) UX.undoStack.shift();
  UX.toastAction(text, 'Отменить', () => {
    try { undoFn(); } catch (e) {}
    haptic('light');
    toast('Действие отменено', 'ok', 1500);
    if (redoFn) redoFn();
  }, 4600);
  return entry;
};

function uxDecoratePopup() {

  if (!titleText) titleText = UX.popTitles[popOpenId] || 'Окно';

  if (t) {
    t.id = 'popTitle';
    t.setAttribute('role', 'heading');

    hd.className = 'pop-hd';
    hd.innerHTML = `
      <div class="u-minw0 grow">
        <div class="ttl h2" id="popTitle">${titleText}</div>
        <div class="sub">${popIdOf(popOpenId)} · закрывается Esc</div>
      </div>
      <button class="x" aria-label="Закрыть окно" onclick="closePop()">${ico('x', 'i i-16')}</button>`;
    dlg.insertBefore(hd, body);
  }

  /* кнопка закрытия для простых модалок */
  if (!dlg.querySelector('.x') && !body) {
    const x = document.createElement('button');
    x.className = 'x islot sm brd ux-dock-x';
    x.setAttribute('aria-label', 'Закрыть окно');
    x.innerHTML = ico('x', 'i i-16');
    x.onclick = () => closePop();
    dlg.style.position = 'relative';
    dlg.appendChild(x);
  }

  /* липкий футер для длинных шторок */
  if (body && !dlg.querySelector('.pop-ft')) {
    const ft = document.createElement('div');
    ft.className = 'pop-ft';
    ft.innerHTML = `<button class="u-full btn ghost sm" onclick="closePop()">Закрыть</button>`;
    dlg.appendChild(ft);
  }

  dlg.setAttribute('role', 'dialog');
  dlg.setAttribute('aria-modal', 'true');
  dlg.setAttribute('aria-labelledby', 'popTitle');

  /* одно главное действие в окне */
  const corals = [...dlg.querySelectorAll('.btn.coral')];
  corals.slice(1).forEach((b) => { b.classList.remove('coral'); b.classList.add('coral-soft'); });
}

function uxScrollFx(root) {
  const sc = root.querySelector('.scroll');
  if (!sc) return;
  const bar = document.createElement('div');
  bar.className = 'ux-progress';
  bar.innerHTML = '<i></i>';
  const host = document.querySelector('#screen');
  if (host && !host.querySelector('.ux-progress')) host.appendChild(bar);
  const fill = bar.querySelector('i');
  const onScroll = () => {
    const max = sc.scrollHeight - sc.clientHeight;
    const p = max > 0 ? sc.scrollTop / max : 0;
    fill.style.width = Math.round(p * 100) + '%';
    sc.classList.toggle('at-top', sc.scrollTop < 6);
  };
  sc.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

let UX_IO = null;
function uxReveal(root) {
  if (!UX.flags.reveal) return 0;
  if (document.body.classList.contains('rm')) return 0;
  const blocks = [...root.querySelectorAll('.scroll > .g, .scroll > .sec, .scroll > .grid2, .scroll > .grid3')];
  if (blocks.length < 3) return 0;
  const budget = blocks.slice(0, 3);           /* бюджет: не больше трёх анимаций */
  budget.forEach((b, i) => {
    b.classList.add('rv');
    b.style.transitionDelay = (i * 40) + 'ms';
  });
  /* наблюдатель пересоздаётся на каждый рендер: root — .scroll конкретного
     экрана, а он после renderScreen предыдущий уже откреплён. С одним
     кэшированным UX_IO блоки ниже первого экрана навечно оставались с
     opacity:0 — на переходах контент «исчезал» */
  if (UX_IO) { UX_IO.disconnect(); UX_IO = null; }
  if ('IntersectionObserver' in window) {
    UX_IO = new IntersectionObserver((entries) => {
      entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('in'); UX_IO.unobserve(en.target); } });
    }, { root: root.querySelector('.scroll'), threshold: 0.08 });
    budget.forEach((b) => UX_IO.observe(b));
  }
  return budget.length;
}

function uxSetSegFades(root) {
  root.querySelectorAll('.seg').forEach((seg) => {
    if (seg.parentElement && seg.parentElement.classList.contains('seg-wrap')) return;
    const wrap = document.createElement('div');
    wrap.className = 'seg-wrap';
    seg.parentNode.insertBefore(wrap, seg);
    wrap.appendChild(seg);
    const upd = () => wrap.classList.toggle('scrollable', seg.scrollWidth - seg.clientWidth > 4);
    upd();
    seg.addEventListener('scroll', upd, { passive: true });
    window.addEventListener('resize', upd, { passive: true });
  });
}

(function uxShortcuts() {

    { keys: 'D', action: 'плотность: компактно → обычно → просторно' },

  ];
  if (typeof SHORTCUTS !== 'undefined') extra.forEach((s) => { if (!SHORTCUTS.some((x) => x.keys === s.keys)) SHORTCUTS.push(s); });

  let gPending = 0;
  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    const now = Date.now();
    if (gPending && now - gPending < 900) {
      gPending = 0;
      const map = { h: 'hub', t: 'tournaments', s: 'shop', p: 'profile', m: 'match-type', q: 'quests' };
      if (map[k]) { e.preventDefault(); go(map[k]); return; }
    }
    if (k === 'g') { gPending = now; return; }
    if (k === 'd') { e.preventDefault(); const order = ['compact', 'normal', 'comfortable']; const cur = order.indexOf(document.documentElement.dataset.density || 'normal'); uxSetDensity(order[(cur + 1) % 3]); renderScreen(CURRENT); return; }
    if (k === 'l') { e.preventDefault(); uxSetLang(S.lang === 'ru' ? 'en' : 'ru'); return; }
    if (k === 'm') { e.preventDefault(); uxToggleMotion(); return; }
    if (k === 'e') { e.preventDefault(); UX.toggles.empty(); return; }
    if (k === 'u') { e.preventDefault(); go('qa-ux'); return; }
  });
})();

(function uxPalette() {
  const extraActions = [
    { label: 'Плотность: компактно', hint: 'плотнее списки', run: () => { uxSetDensity('compact'); renderScreen(CURRENT); } },
    { label: 'Плотность: обычно', hint: 'по умолчанию', run: () => { uxSetDensity('normal'); renderScreen(CURRENT); } },
    { label: 'Плотность: просторно', hint: 'крупнее отступы', run: () => { uxSetDensity('comfortable'); renderScreen(CURRENT); } },
    { label: 'Язык: русский', hint: 'переключить интерфейс', run: () => uxSetLang('ru') },
    { label: 'Язык: English', hint: 'interface language', run: () => uxSetLang('en') },
    { label: 'Анимации вкл/выкл', hint: 'reduced motion', run: () => uxToggleMotion() },
    { label: 'Показать пустые состояния', hint: 'демо-режим', run: () => UX.toggles.empty() },
    { label: 'Показать скелетоны', hint: 'демо-режим', run: () => UX.toggles.skel() },
    { label: 'Имитировать ошибку сети', hint: 'офлайн + retry', run: () => UX.toggles.err() },
    { label: 'UX-метрики', hint: '50 проверок на экране', run: () => go('qa-ux') },
    { label: 'Скопировать отчёт UX', hint: 'JSON в буфер', run: () => { copyText(JSON.stringify(UX.audit(), null, 1)); toast('Отчёт скопирован', 'ok'); } },
    { label: 'История: очистить (с отменой)', hint: 'демо undo', run: () => UX.actions.clearHistory() },
    { label: 'Уведомления: прочитать все', hint: 'с отменой', run: () => UX.actions.markAllRead() },
    { label: 'Сбросить раздел настроек', hint: 'с отменой', run: () => UX.actions.resetSection('game') }
  ];
  if (typeof PALETTE_ACTIONS !== 'undefined') PALETTE_ACTIONS.push(...extraActions);

  const score = (hay, needle) => {
    if (!needle) return 1;
    const h = hay.toLowerCase();
    const n = needle.toLowerCase();
    if (h.includes(n)) return 100 - h.indexOf(n);
    let i = 0, s = 0;
    for (const ch of n) { const pos = h.indexOf(ch, i); if (pos < 0) return 0; s += 1 / (pos + 1); i = pos + 1; }
    return s * 10;
  };
  const buildRaw = buildPaletteItems;
  buildPaletteItems = function (q = '') {
    const items = buildRaw(q);
    if (!q) {
      const recents = UX.recent.slice(0, 3)
        .map((r) => SCREEN_REGISTRY.find((s) => s.id === r.id))
        .filter(Boolean)
        .map((s) => ({ kind: 'screen', id: s.id, label: s.title, group: 'Недавние · ' + s.group, n: SCREEN_REGISTRY.indexOf(s) + 1 }));
      return recents.concat(items).slice(0, 60);
    }
    return items
      .map((it) => ({ it, s: score(it.label + ' ' + (it.group || ''), q) }))
      .filter((x) => x.s > 0)
      .sort((a, b) => b.s - a.s)
      .map((x) => x.it)
      .slice(0, 60);
  };
  window.buildPaletteItems = buildPaletteItems;

  const pickRaw = palettePick;
  palettePick = function (i) {
    const it = Palette.items[i];
    if (it && it.kind === 'screen') UX.recent.unshift({ id: it.id, at: Date.now() });
    return pickRaw(i);
  };
  window.palettePick = palettePick;
})();

/* ---------------------------------------------------------------------------
   25. UX-АУДИТ В ПРИЛОЖЕНИИ: 28 живых проверок текущего экрана (UX-37)
   --------------------------------------------------------------------------- */
UX.audit = function (silent = true) {
  const root = document.querySelector('#screen .screen');
  const rows = [];
  const push = (name, value, ok, target) => rows.push({ name, value, ok, target });
  if (!root) return { rows, score: 0, pass: 0, total: 0 };

  const els = [...root.querySelectorAll('*')].filter((e) => e.offsetParent);
  const leaves = els.filter((e) => !e.children.length && (e.textContent || '').trim());
  const uniq = (a) => [...new Set(a)];
  const fs = uniq(leaves.map((e) => getComputedStyle(e).fontSize));
  const colors = uniq(leaves.map((e) => getComputedStyle(e).color));
  const radii = uniq(els.map((e) => getComputedStyle(e).borderRadius).filter((v) => v !== '0px'));
  const btns = [...root.querySelectorAll('button')].filter((b) => b.offsetParent);
  const coral = btns.filter((b) => b.classList.contains('coral')).length;
  const minH = btns.length ? Math.min(...btns.map((b) => b.getBoundingClientRect().height)) : 44;
  const labels = btns.map((b) => (b.textContent || '').trim()).filter(Boolean);
  const dups = labels.length - new Set(labels).size;
  const iconOnly = btns.filter((b) => !(b.textContent || '').trim() && !b.getAttribute('aria-label')).length;
  const h1 = root.querySelectorAll('.h1, h1').length;
  const secs = root.querySelectorAll('.sec').length;
  const withAction = root.querySelectorAll('[onclick], a[href]').length;
  const longTxt = leaves.filter((e) => (e.textContent || '').trim().length > 120).length;
  const anims = els.filter((e) => { const a = getComputedStyle(e).animationName; return a && a !== 'none'; }).length;

  push('Один H1 на экран', h1, h1 === 1, '1');
  push('Кегли в шкале', fs.length, fs.length <= 9, '≤ 9');
  push('Цвета текста', colors.length, colors.length <= 8, '≤ 8');
  push('Радиусы', radii.length, radii.length <= 10, '≤ 10');
  push('Primary-кнопок', coral, coral <= 1, '≤ 1');
  push('Дублей подписей', dups, dups === 0, '0');
  push('Кнопки без имени', iconOnly, iconOnly === 0, '0');
  push('Мин. высота кнопки', Math.round(minH), minH >= 30, '≥ 30');
  push('Секций с заголовком', secs, secs >= 1, '≥ 1');
  push('Действий на экране', withAction, withAction >= 2, '≥ 2');
  push('Абзацев > 120 симв.', longTxt, longTxt === 0, '0');
  push('Одновременных анимаций', anims, anims <= 3, '≤ 3');
  push('Хлебные крошки', root.querySelectorAll('.crumbs').length, root.querySelectorAll('.crumbs').length <= 1, '≤ 1');

/* ---------------------------------------------------------------------------

UX.contrast = function (fg, bg) {
  const lum = (hex) => {
    const c = String(hex).replace('#', '');
    const n = c.length === 3 ? c.split('').map((x) => x + x).join('') : c;
    const rgb = [0, 2, 4].map((i) => parseInt(n.slice(i, i + 2), 16) / 255)
      .map((v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
    return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
  };
  const a = lum(fg), b = lum(bg);
  return +(((Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05)).toFixed(2));
};
UX.checkThemeContrast = function () {
  const cs = getComputedStyle(document.documentElement);
  const coral = cs.getPropertyValue('--coral').trim() || '#FF7166';
  const bg = cs.getPropertyValue('--bg1').trim() || '#0A1020';
  const ratio = UX.contrast(coral, bg);
  return { accent: coral, bg, ratio, pass: ratio >= 3 };
};

   ----------------------------------------------------------------------------
   1. Platform API        — автодетект платформы/ввода, пул, подсказки, fullscreen
   2. Матчмейкинг         — правила подбора (input/device + 4 «не влияет»)
   3. Экран матча         — сеть, in-match уведомления, fullscreen, recovery
   4. Пауза               — Перезапустить
   5. Пост-матч статистика— длительность, длина розыгрышей, зоны, insight, советы
   6. Хаб                 — незавершённая тренировка, реванш-ссылка
   7. Новые экраны        — Аккаунт, Входящий вызов, Реванш, Галерея виджетов
   8. Состояния           — 8 глобальных состояний (default/loading/empty/error/
                            disabled/success/interrupted/restored)
   9. Уведомления         — 6 типов, deep links, loading/empty/error
  10. Попапы              — недостающие EN-строки (38 из 77)
   ============================================================================ */

/* ---------------------------------------------------------------------------
   1. PLATFORM API (ТЗ §1–3): система сама определяет платформу и тип ввода
   --------------------------------------------------------------------------- */
const Platform = {
  get device() { return PLATFORM.mobile ? 'mobile' : 'desktop'; },
  get input() { return PLATFORM.input; },                 // touch | mouse
  get inputMode() { return PLATFORM.input === 'touch' ? 'swipe' : 'click'; },
  get bucket() { return PLATFORM.input === 'touch' ? 'пул: тач' : 'пул: мышь'; },
  get handedness() { return S.handedness === 'left' ? 'left' : 'right'; },
  get grip() { return S.grip === 2 ? 2 : 1; },
  get hiddenRacket() { return !!S.hideRacket && PLATFORM.mobile; },
  canFullscreen() { return !!PLATFORM.fullscreenAvailable && !PLATFORM.mobile; },
  /* политика пула: что влияет на матчмейкинг, а что нет */
  poolRules() {

      ['Тип ввода', Platform.input === 'touch' ? 'тач / свайп' : 'мышь / клик', 'влияет на рейтинг'],
      ['Тип устройства', Platform.device === 'mobile' ? 'телефон' : 'компьютер', 'влияет на рейтинг'],
      ['Полный экран', Platform.canFullscreen() ? 'доступен' : 'недоступен', 'на пул не влияет'],
      ['Правша / левша', Platform.handedness === 'left' ? 'левша' : 'правша', 'на пул не влияет'],
      ['Хват ракетки', 'Тип ' + Platform.grip, 'на пул не влияет'],
      ['Скрытие ракетки', Platform.hiddenRacket ? 'включено (телефон)' : 'выключено', 'на пул не влияет']
    ];
  },
  hint() {
    return PLATFORM.mobile
      ? 'Свайп по мячу — удар. Короткий свайп = сила, длинный = спин.'
      : 'Мышь: наведи и щёлкни — удар. Удержание = сила, Shift = спин.';
  },
  info() {
    return {
      platform: Platform.device, input: Platform.input, inputMode: Platform.inputMode,
      bucket: Platform.bucket, fullscreen: Platform.canFullscreen(),
      handedness: Platform.handedness, grip: Platform.grip,
      hiddenRacket: PLATFORM.mobile, hiddenRacketOn: Platform.hiddenRacket,
      hint: Platform.hint(), tg: !!TG
    };
  },
  async fullscreen() {
    if (!Platform.canFullscreen()) { toast('Полный экран доступен только на десктопе', 'warn'); return false; }
    try { await document.documentElement.requestFullscreen(); toast('Полный экран · Esc — выход'); return true; }
    catch (e) { toast('Браузер не дал полный экран', 'warn'); return false; }
  },
  /* скрытие ракетки — только mobile; на десктопе настройка не применяется */
  setHiddenRacket(v) {
    if (!PLATFORM.mobile) { toast('Скрытие ракетки доступно только на телефоне', 'warn'); return false; }

/* вставляем EN-строку в окна, где её нет (toast / flash / banner / собственный render) */
const tzOpenPopRaw = openPop;
openPop = function (id, vars) {
  const res = tzOpenPopRaw.apply(this, arguments);
  try {
    const def = POPUP_DEFS[id] || {};
    const en = POP_EN_RENDER[id] || (EN.pop[def.text] || [])[0];

    /* 1) тосты, баннеры, flash — живут в #toasts, не в #overlay */
    if (['toast', 'banner', 'flash', 'frame'].includes(def.kind) && en) {
      const th = document.getElementById('toasts');
      const last = th && th.lastElementChild;
      if (last && !last.querySelector('.pop-en')) {
        const t = document.createElement('div');
        t.className = 'pop-en';
        t.textContent = 'EN · ' + en;
        last.appendChild(t);
      }
      return res;
    }

    /* 2) окна: EN-строка и состояния панели уведомлений */
    const host = $('#overlay');
    const box = host && host.firstElementChild;
    if (!box) return res;
    if (en && !box.querySelector('.pop-en')) {
      const line = document.createElement('p');
      line.className = 'pop-en';
      line.textContent = 'EN · ' + en;
      const anchor = box.querySelector('.btn-row, .t-act, .toast-body');
      if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(line, anchor);
      else (box.querySelector('.pop-custom-body') || box).appendChild(line);
    }
    if (id === 'notifPanel') { tzNpStates(); setTimeout(tzNpStates, 60); setTimeout(tzNpStates, 220); }
  } catch (e) { /* окно не должно падать из-за перевода */ }
  return res;
};

  const keys = Object.keys(THEME_PRESETS);
  for (let i = 0; i < keys.length; i++) {
    const p = THEME_PRESETS[keys[i]];
    const same = Object.keys(p).every((k) => String(p[k]).toLowerCase() === String(THEME[k]).toLowerCase());

function sdRatio() { const a = document.querySelector('.app'); return (a && a.dataset.ratio) || '916'; }

/* ---------- лёгкая синхронизация без перестройки DOM ---------- */
function sdSync() {
  const host = document.getElementById('sdBody');
  if (!host) return;
  SD_COLORS.forEach(([k]) => {
    const hex = document.getElementById('sdHex-' + k);
    const input = hex ? hex.parentElement.querySelector('input[type=color]') : null;
    if (hex) hex.textContent = THEME[k];
    if (input && input.value.toLowerCase() !== String(THEME[k]).toLowerCase()) input.value = THEME[k];
  });
  SD_RANGES.concat(SD_FX).forEach(([k, , , , , unit]) => {
    const val = document.getElementById('sdVal-' + k);
    const input = val ? val.parentElement.querySelector('input[type=range]') : null;
    if (val) val.textContent = THEME[k] + unit;
    if (input && +input.value !== +THEME[k]) input.value = THEME[k];
  });
  const acc = document.getElementById('sdAccentNote');
  if (acc) acc.textContent = THEME.accent;
  const con = document.getElementById('sdContrastNote');
  if (con) con.textContent = sdContrastInfo();

  const preset = sdPresetName();
  host.querySelectorAll('[data-sd-preset]').forEach((b) => b.classList.toggle('on', b.dataset.sdPreset === preset));
  host.querySelectorAll('[data-sd-ratio]').forEach((b) => b.classList.toggle('on', b.dataset.sdRatio === sdRatio()));
  host.querySelectorAll('[data-sd-density]').forEach((b) => b.classList.toggle('on', b.dataset.sdDensity === sdDensity()));
  host.querySelectorAll('[data-sd-quality]').forEach((b) => b.classList.toggle('on', b.dataset.sdQuality === QUALITY));
  host.querySelectorAll('[data-sd-hublayout]').forEach((b) => b.classList.toggle('on', b.dataset.sdHublayout === sdHubLayout()));

  const cIn = document.getElementById('sdContrast'); if (cIn) cIn.checked = sdContrast();
  const mIn = document.getElementById('sdMotion'); if (mIn) mIn.checked = !sdMotionOff();
  const meta = document.getElementById('sdMeta');
  if (meta) meta.textContent = preset === 'custom' ? 'своя тема' : 'пресет · ' + preset;
}

/* ---------- обработчики ---------- */
function sdSetColor(key, value) { THEME[key] = value; applyTheme(); }
function sdSetRange(key, value, unit) {
  THEME[key] = value;
  const val = document.getElementById('sdVal-' + key);
  if (val) val.textContent = value + (unit || '');
  applyTheme();
}
function sdUsePreset(k) { usePreset(k); }
function sdUseRatio(r) { setRatio(r); sdLayout(); }
function sdUseDensity(m) {
  uxSetDensity(m);
  renderScreen(CURRENT || 'hub');
  sdSync();
}
function sdUseQuality(q) {
  QUALITY = SD_QUALITIES.includes(q) ? q : 'high';
  document.documentElement.dataset.quality = QUALITY;
  try { setState({ motionLevel: QUALITY }); } catch (e) {}
  document.body.classList.toggle('lite', QUALITY === 'low');
  if (QUALITY !== 'high') document.body.classList.add('rm');
  else document.body.classList.toggle('rm', !!S.reducedMotion);
  toast('Качество эффектов: ' + SD_LABELS.quality[QUALITY], 'ok', 1500);
  sdSync();
}
function sdUseContrast(on) {
  Store.patch({ highContrast: !!on });
  document.documentElement.dataset.contrast = on ? 'high' : 'normal';
  sdSync();
}
function sdUseMotion(on) {
  Store.patch({ reducedMotion: !on });
  applyGlobalFlags();
  sdSync();
}
function sdUseHubLayout(v) {
  if (!SD_HUB_LAYOUTS.includes(v)) v = 'duo';
  try { localStorage.setItem('ttu-hub-layout', v); } catch (e) {}
  document.documentElement.dataset.hubLayout = v;
  sdSync();
}

/* ---------- сворачивание ---------- */
function toggleStyleDock(force) {
  const dock = document.getElementById('styleDock');
  if (!dock) return;
  const collapsed = force === undefined ? !dock.classList.contains('is-collapsed') : !!force;
  dock.classList.toggle('is-collapsed', collapsed);
  const btn = document.getElementById('sdCollapse');
  if (btn) {
    btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    const span = btn.querySelector('span');
    if (span) span.textContent = collapsed ? 'развернуть' : 'свернуть';
  }
  try { localStorage.setItem('ttu-style-dock', collapsed ? 'collapsed' : 'open'); } catch (e) {}
  sdLayout();
}

/* ---------- расчёт сцены: телефон + док в одной колонке ----------
   Заменяет applyZoom из js5: масштаб телефона учитывает занятую доком высоту,
   поэтому панель видна целиком без прокрутки страницы. */
function sdLayout() {
  const stage = document.querySelector('.stagebox');
  const app = document.querySelector('.app');
  const slot = document.getElementById('phoneSlot');
  const phone = document.getElementById('phone');
  const dock = document.getElementById('styleDock');
  if (!stage || !app || !slot || !phone) return;
  const phH = app.dataset.ratio === '916' ? 693 : 844;
  const phW = 390;
  const stacked = window.innerWidth <= 1180;
  const stageH = stacked ? window.innerHeight : stage.clientHeight;
  let dockH = 0;
  if (!stacked && dock && !dock.classList.contains('is-collapsed')) {
    // доку отдаём не больше трети сцены: телефон остаётся читабельным,
    // нижняя часть панели достижима прокруткой самой сцены
    dockH = Math.min(dock.getBoundingClientRect().height + 18, stageH * 0.34);
  }
  const avail = stageH - 28 - dockH;
  const z = Math.max(0.55, Math.min(1, avail / phH));
  phone.style.setProperty('--zoom', z.toFixed(3));
  slot.style.width = Math.round(phW * z) + 'px';
  slot.style.height = Math.round(phH * z) + 'px';
}

/* ---------- старт ---------- */
(function sdBoot() {
  let saved = 'open';
  try {
    saved = localStorage.getItem('ttu-style-dock') || 'open';
    localStorage.removeItem('ttu-vibe');           // кобальтовая обложка откачена
    document.documentElement.removeAttribute('data-vibe');
  } catch (e) {}
  document.documentElement.dataset.hubLayout = sdHubLayout();
  if (saved === 'collapsed') toggleStyleDock(true);
  renderStyleDock();
  window.addEventListener('resize', sdLayout);
  if (typeof ResizeObserver === 'function' && document.getElementById('styleDock')) {
    new ResizeObserver(() => sdLayout()).observe(document.getElementById('styleDock'));
  }
  // пересчёт после первого кадра: шрифты и перенос строк док до этого не знает
  requestAnimationFrame(() => sdLayout());
})();

window.sdUsePreset = sdUsePreset; window.sdUseRatio = sdUseRatio; window.sdUseDensity = sdUseDensity;

/* ---------- свайп-хелпер (горизонталь) ---------- */
function swipeNode(node, { threshold = 72, onMove, onEnd } = {}) {
  let startX = 0, dx = 0, active = false, pid = null;
  node.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    active = true; startX = e.clientX; dx = 0; pid = e.pointerId;
    try { node.setPointerCapture(pid); } catch (err) {}
    node.classList.add('swiping');
  });
  node.addEventListener('pointermove', (e) => {
    if (!active) return;
    dx = e.clientX - startX;
    if (onMove) onMove(dx);
  });
  const finish = () => {
    if (!active) return;
    active = false;
    node.classList.remove('swiping');
    const dir = Math.abs(dx) >= threshold ? (dx > 0 ? 'right' : 'left') : null;
    if (onEnd) onEnd(dir, dx);
  };
  node.addEventListener('pointerup', finish);
  node.addEventListener('pointercancel', finish);
}

/* Пауза автолистания hero: 10.4 s. Раньше 5.2 s — слайд улетал раньше,
   чем успевался прочесть заголовок. Сам сдвиг замедлен до 840 ms в extra8.css. */
const HERO_DWELL = 10400;
const HeroDeck = {
  i: 0, n: 0, timer: null,
  attach() {
    this.detach();
    const deck = document.getElementById('heroDeck');
    if (!deck) return;
    this.n = deck.querySelectorAll('.hero-slide').length;
    this.i = 0;
    const track = deck.querySelector('.hero-track');
    /* перетаскивание пальцем/мышью */
    let startX = 0, dx = 0, dragging = false;
    track.addEventListener('pointerdown', (e) => {
      dragging = true; startX = e.clientX; dx = 0;
      track.classList.add('dragging'); this.pause();
      try { track.setPointerCapture(e.pointerId); } catch (err) {}
    });
    track.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      dx = e.clientX - startX;
      track.style.transform = `translateX(calc(${-this.i * 100}% + ${dx}px))`;
    });
    const endDrag = () => {
      if (!dragging) return;
      dragging = false;
      track.classList.remove('dragging');
      if (Math.abs(dx) > 56) this.go(this.i + (dx > 0 ? -1 : 1));
      else this.show(this.i);
      this.resume();
    };
    track.addEventListener('pointerup', endDrag);
    track.addEventListener('pointercancel', endDrag);
    /* Полоса точек — единая зона нажатия: тап уходит к ближайшей точке.
       Раньше каждая точка была 6×6 с прозрачным полем 16×34, и соседние поля
       перекрывались, поэтому попасть по нужному слайду было нестабильно. */
    const dotsEl = deck.querySelector('.hero-dots');
    if (dotsEl) dotsEl.addEventListener('click', (e) => {
      const kids = [...dotsEl.querySelectorAll('i')];
      if (!kids.length) return;
      let best = +kids[0].dataset.hd, bd = Infinity;
      kids.forEach((k) => {
        const r = k.getBoundingClientRect();
        const d = Math.abs(e.clientX - (r.left + r.width / 2));
        if (d < bd) { bd = d; best = +k.dataset.hd; }
      });
      this.go(best);
    });
    this.show(0);
    if (!S.reducedMotion && QUALITY !== 'low') this.timer = setInterval(() => {
      if (!document.getElementById('heroDeck')) { this.pause(); return; }
      this.go(this.i + 1, true);
    }, HERO_DWELL);
  },
  detach() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  pause() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  resume() { if (!this.timer && !S.reducedMotion && QUALITY !== 'low' && document.getElementById('heroDeck')) this.timer = setInterval(() => { if (!document.getElementById('heroDeck')) { this.pause(); return; } this.go(this.i + 1, true); }, HERO_DWELL); },
  show(i) {
    const track = document.getElementById('heroTrack');
    if (!track) return;
    track.style.transform = `translateX(${-i * 100}%)`;
    document.querySelectorAll('#heroDots i').forEach((d) => d.classList.toggle('on', +d.dataset.hd === i));
  },
  go(i, auto) {
    if (!this.n) return;
    this.i = ((i % this.n) + this.n) % this.n;
    this.show(this.i);
    if (!auto) this.resume();
  }
};

    this.tickLabel();
    this.timer = setInterval(() => {
      if (!document.getElementById('pushInv')) { this.detach(); return; }
      this.left -= 1;
      if (this.left <= 0) { this.collapse('Приглашение истекло', 'warn'); return; }
      this.tickLabel();
    }, 1000);
    swipeNode(tile, {
      threshold: 84,
      onMove: (dx) => {
        face.style.transform = `translateX(${dx}px)`;
        face.style.opacity = String(Math.max(0.35, 1 - Math.abs(dx) / 260));
      },
      onEnd: (dir, dx) => {
        if (dir === 'right') { this.accept(dx); return; }
        if (dir === 'left') { this.askReply(dx); return; }
        face.style.transition = ''; face.style.transform = ''; face.style.opacity = '';
      }
    });
    /* тап по плитке без свайпа — тоже раскрывает шаблоны */
    face.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      this.toggleReply(e);
    });
  },
  detach() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  tickLabel() {
    const el = document.getElementById('piTimer');
    if (el) el.textContent = `0:${String(Math.max(0, this.left)).padStart(2, '0')}`;
  },
  flyOut(dx) {
    const face = document.querySelector('#piFace');
    if (!face) return;
    face.style.transition = 'transform 240ms var(--ease-out, cubic-bezier(.16,1,.3,1)), opacity 240ms';
    face.style.transform = `translateX(${dx}px)`;
    face.style.opacity = '0';
  },
  accept(dx, e) {
    if (e) e.stopPropagation();
    if (this.gone) return; this.gone = true;
    this.detach();
    this.flyOut(Math.max(360, (dx || 120) * 4));
    toast('Приглашение принято — входим в матч…', 'ok');
    setTimeout(() => this.collapseNow(), 320);
  },
  askReply(dx) {
    if (this.gone) return;
    const tile = document.getElementById('pushInv');
    this.flyOut(Math.min(-360, dx * -4));
    /* плитка улетает влево и возвращается уже с открытыми шаблонами */
    setTimeout(() => {
      const face = document.querySelector('#piFace');
      if (face) { face.style.transition = ''; face.style.transform = ''; face.style.opacity = ''; }
      if (tile) tile.classList.add('reply');
    }, 260);
  },
  toggleReply(e) {
    if (e) e.stopPropagation();
    const tile = document.getElementById('pushInv');
    if (tile) tile.classList.toggle('reply');
  },
  reply(i, e) {
    if (e) e.stopPropagation();
    if (this.gone) return; this.gone = true;
    this.detach();
    toast(`Ответ: «${PUSH_TEMPLATES[i]}»`, i === 3 ? 'ok' : 'warn');
    this.collapseNow();
  },
  collapse(text, kind) {
    if (this.gone) return; this.gone = true;
    this.detach();
    if (text) toast(text, kind);
    this.collapseNow();
  },
  collapseNow() {
    const tile = document.getElementById('pushInv');
    if (tile) tile.classList.add('collapsed');
  }
};

/* ---------- 3. РЕФЕРАЛЬНАЯ ПАНЕЛЬ ----------
   Молния-FAB из угла убрана по просьбе юзера: панель живёт в блоке
   друзей и раскрывается на месте из кнопки «пригласить друга» (морф
   на месте, паттерн V9). Клик по аватарке слева — быстрый повторный
   вызов уже приглашённого друга, без всяких панелей. */
const REF_LINK = 'https://t.me/ttu_bot?start=ref_anton2140';
function initials(name) {
  return String(name || '?').split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase();
}
function hubInvitePanelHtml() {
  return `
  <div class="inv-panel" id="hubInvPanel"><div><div class="ip-card">
    <div class="small mut" style="margin-bottom:6px">Получай <b style="color:var(--gold)">250 ₵</b> и <b style="color:var(--sky)">1 кейс</b> за друга, дошедшего до 3-го матча. Он стартует с бонусом.</div>
    <div class="rp-link"><code>${REF_LINK}</code>
      <button class="btn xs sky" style="width:auto" onclick="copyText('${REF_LINK}','Ссылка-приглашение скопирована')">${ico('share', 'i i-16')} копировать</button>
    </div>
    <div class="u-g6 row mt-s">
      <div class="hs grow"><b>3</b><span>приглашено</span></div>
      <div class="hs grow"><b style="color:var(--gold)">750 ₵</b><span>заработано</span></div>
    </div>
    <div class="small dim" style="margin:9px 0 2px">Кого позвать:</div>
    ${FRIENDS.slice(0, 3).map((f) => `
      <div class="inv-row" onclick="hubInviteFriend('${f.id}')">
        <div class="ava sm">${initials(f.name)}${f.online ? '<span class="st"></span>' : ''}</div>
        <div class="u-minw0 grow"><b class="u-t-xs">${f.name}</b><div class="small dim">${f.online ? 'онлайн · ' + f.device : f.last}</div></div>
        <span class="link">позвать</span>
      </div>`).join('')}
    <div class="inv-row" onclick="go('friends')"><div class="islot sm teal">${ico('users', 'i i-16')}</div>
      <div class="grow"><b class="u-t-xs">Весь список друзей</b><div class="small dim">${FRIENDS.length} · ${FRIENDS.filter((f) => f.online).length} онлайн</div></div>${ico('chev-r', 'i i-16')}</div>
  </div></div></div>`;
}
function hubInviteToggle() {
  const panel = document.getElementById('hubInvPanel');
  if (!panel) return;
  const open = !panel.classList.contains('open');
  panel.classList.toggle('open', open);
  const btn = document.getElementById('hubInviteBtn');
  if (btn) btn.classList.toggle('is-open', open);
  if (open) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function hubInviteFriend(id, e) {
  if (e) e.stopPropagation();
  const f = FRIENDS.find((x) => x.id === id);
  if (!f) return;
  toast(`Приглашение отправлено: ${f.name}`, 'ok');
  const panel = document.getElementById('hubInvPanel');
  if (panel) panel.classList.remove('open');
  const btn = document.getElementById('hubInviteBtn');
  if (btn) btn.classList.remove('is-open');
}

/* ---------- сборка хаба: 4 вертикальные части ----------
   1) hero-карусель + пуш-приглашение  2) старт игры (4 плитки,
   вариант сетки из дока)  3) сводка статистики + сезон  4) друзья + рефералка.
   Турниры с хаба убраны — для них отдельный раздел. */
function hubStartTilesHtml() {
  const tiles = [
    { t: 'Быстрый матч', s: 'casual · ~30 сек', i: 'bolt', a: 'coral', go: "go('match-type')" },
    { t: 'Онлайн', s: PLAYER.rating + ' очков', i: 'users', a: 'sky', go: "go('online-entry')" },
    { t: 'Практика', s: '4 упражнения', i: 'target', a: 'teal', go: "go('practice')" },
    { t: 'Карьера', s: 'Глава 2 · 5/8', i: 'map', a: 'gold', go: "go('career-map')" }
  ];
  return `<div class="hub-start">${tiles.map((x) => `
    <div class="tile press" onclick="${x.go}">
      <div class="ico ${x.a}">${ico(x.i, 'i i-16')}</div>
      <b>${x.t}</b><span>${x.s}</span>

}
function hubStatsHtml() {
  const wins = 128, wr = Math.round((wins / (wins + 47)) * 100);

  <div class="hub-stats">
    <div class="hs"><b style="color:var(--teal)">7</b><span>серия побед</span></div>
    <div class="hs"><b>${wins + 47}</b><span>матчей</span></div>
    <div class="hs"><b style="color:var(--gold)">${wr}%</b><span>винрейт</span></div>
  </div>
  <div class="g pad mt-s">
    <div class="between"><div><b class="u-t-m">Лига Про · дивизион 2</b><div class="small dim">До повышения 160 очков</div></div>
      <div class="ring"><svg width="56" height="56"><circle cx="28" cy="28" r="23" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5"/><circle cx="28" cy="28" r="23" fill="none" stroke="var(--teal)" stroke-width="5" stroke-linecap="round" stroke-dasharray="145" stroke-dashoffset="52"/></svg><b>64%</b></div>
    </div>
    <div class="bar mt-s coral"><i style="width:64%"></i></div>
    <div class="u-between row mt-s"><span class="small dim">Уровень ${S.level}</span><span class="small dim mono">${S.xp} / ${S.xpMax} XP</span></div>
  </div>`;
}
function hubFriendsHtml() {
  const online = FRIENDS.filter((f) => f.online);
  /* Счётчик «N свободны» убран из строки: зелёные точки на аватарках говорят
     то же самое, а текст в тесном ряду сжимался в столбик букв. */
  return `
  <div class="sec"><h2>Друзья</h2><span class="small dim">${online.length} онлайн</span><span class="more" onclick="go('friends')">все друзья</span></div>
  <div class="g pad">
    <div class="row" style="flex-wrap:wrap;gap:8px">
      <div class="row" style="gap:6px;flex:none">
        ${online.map((f) => `<div class="ava sm press" title="${f.name} — позвать снова" aria-label="${f.name} — позвать снова" style="cursor:pointer" onclick="hubInviteFriend('${f.id}')">${initials(f.name)}<span class="st"></span></div>`).join('')}
        <div class="ava sm" style="background:rgba(255,255,255,.08);font-size:10px">+${FRIENDS.length - online.length}</div>
      </div>
      <button class="btn xs coral" id="hubInviteBtn" style="width:auto;margin-left:auto;flex:none;white-space:nowrap" onclick="hubInviteToggle()">${ico('bolt', 'i i-16')} пригласить друга</button>
    </div>
    ${hubInvitePanelHtml()}
  </div>`;
}

/* ---------- вешаем на рендер хаба ---------- */
function hubAfterRender() {
  if (CURRENT !== 'hub') return;
  try { HeroDeck.attach(); } catch (e) {}
  try { PushInvite.attach(); } catch (e) {}
}
const hubRenderScreenRaw = renderScreen;
renderScreen = function (id) {
  const r = hubRenderScreenRaw.apply(this, arguments);
  hubAfterRender();
  return r;
};
window.renderScreen = renderScreen;
window.swipeNode = swipeNode;
window.HERO_SLIDES = HERO_SLIDES;
window.heroDeckHtml = heroDeckHtml;
window.HeroDeck = HeroDeck;
window.pushInviteHtml = pushInviteHtml;
window.PushInvite = PushInvite;
window.hubInviteToggle = hubInviteToggle;
window.hubInviteFriend = hubInviteFriend;
window.hubStartTilesHtml = hubStartTilesHtml;
window.hubStatsHtml = hubStatsHtml;
window.hubFriendsHtml = hubFriendsHtml;
window.initials = initials;
