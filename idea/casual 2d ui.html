:root{
  --bg0:#04050D; --bg1:#0A0D22; --bg2:#141A3E;
  --ink:#FFFFFF; --ink2:rgba(222,230,255,.74); --ink3:rgba(160,174,226,.52);
  --coral:#FF4B3E; --coral2:#FF7A4D; --coralD:#A8121C;
  --cyan:#2EE6FF; --cyan2:#7DF3FF; --cyanD:#0868A8;
  --gold:#FFC93A; --gold2:#FFE680; --goldD:#B86A00;
  --violet:#9F6BFF; --violetD:#5320C9;
  --green:#3BF5A0; --greenD:#0A9B5C;
  --r-common:#93A6CC; --r-rare:#33B6FF; --r-epic:#B061FF; --r-leg:#FFB21E;
  --display:"Unb", "Arial Black", system-ui, sans-serif;
  --body:"Man", -apple-system, "SF Pro Text", Roboto, system-ui, sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --spring2:cubic-bezier(.18,1.25,.4,1);
  --out:cubic-bezier(.16,1,.3,1);
  --in:cubic-bezier(.55,0,1,.45);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --tgt:0px; /* Telegram content safe area, ставится из JS */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--ink);font-family:var(--body);font-weight:600;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* ---------------- desktop frame ---------------- */
#desk{height:100%;display:flex;align-items:center;justify-content:center;gap:40px;
  background:radial-gradient(1000px 700px at 70% 20%,#16123a 0%,transparent 60%),radial-gradient(900px 700px at 10% 100%,#2a0d1b 0%,transparent 60%),#05060d}
#deskPanel{width:250px;max-height:calc(100% - 60px);overflow:auto;padding:22px 18px;border-radius:24px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);scrollbar-width:thin}
.dp-logo{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.dp-logo b{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:-.02em;background:linear-gradient(180deg,#fff,#ffb3a8);-webkit-background-clip:text;color:transparent}
.dp-logo span{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.12em}
.dp-note{font-size:12px;line-height:1.5;color:var(--ink3);margin:0 0 14px}
.dp-h{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:16px 0 8px}
#dpList button,.dp-row button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:10px;font-size:13px;color:var(--ink2);transition:background .2s,color .2s}
#dpList button:hover,.dp-row button:hover{background:rgba(255,255,255,.06);color:#fff}
#dpList button.on{background:linear-gradient(90deg,rgba(255,75,62,.25),rgba(255,75,62,.05));color:#fff}
.dp-row{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.dp-row button{text-align:center;background:rgba(255,255,255,.04)}
.dp-row button.on{background:rgba(46,230,255,.18);color:#fff}
.dp-fps{margin-top:14px;font:12px ui-monospace,monospace;color:var(--green)}
#deviceWrap{position:relative;flex:none}
#device{position:relative;width:390px;height:min(844px,calc(100vh - 40px));border-radius:52px;overflow:hidden;background:var(--bg0);isolation:isolate;
  box-shadow:0 0 0 10px #0d0f1c,0 0 0 11px rgba(255,255,255,.08),0 50px 120px rgba(0,0,0,.7),0 0 160px rgba(80,60,255,.12);transform:translateZ(0)}
body.mobile #desk{display:block;background:var(--bg0)}
body.mobile #deskPanel{display:none}
body.mobile #deviceWrap,body.mobile #device{width:100%;height:100%;border-radius:0;box-shadow:none}
@media (max-width:760px){#desk{display:block;background:var(--bg0)}#deskPanel{display:none}#deviceWrap,#device{width:100%;height:100%;border-radius:0;box-shadow:none}}

/* ---------------- layers ---------------- */
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#screens{position:absolute;inset:0;z-index:2}
#nav{z-index:20}
#sheets{position:absolute;inset:0;z-index:40;pointer-events:none}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
#toasts{position:absolute;left:0;right:0;top:calc(64px + var(--sat) + var(--tgt));z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#flash{position:absolute;inset:0;z-index:65;pointer-events:none;opacity:0;background:#fff;mix-blend-mode:overlay}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;will-change:transform,opacity}
.screen.hidden{visibility:hidden;pointer-events:none}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:calc(110px + var(--sab))}
.scroll::-webkit-scrollbar{display:none}
.safe-top{padding-top:calc(var(--sat) + var(--tgt) + 10px)}

/* ---------------- typography ---------------- */
.h-display{font-family:var(--display);font-weight:900;letter-spacing:-.02em;line-height:.95;text-transform:uppercase}
.h1{font-family:var(--display);font-weight:900;font-size:28px;letter-spacing:-.02em;text-transform:uppercase;line-height:1}
.h2{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:-.01em;text-transform:uppercase}
.h3{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.02em;text-transform:uppercase}
.cap{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:800}
.mut{color:var(--ink2)} .dim{color:var(--ink3)}
.stroke{-webkit-text-stroke:1.5px rgba(0,0,0,.35);paint-order:stroke fill}
.txt-gold{background:linear-gradient(180deg,#FFF6C8 0%,#FFD34D 45%,#FF9A1A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.txt-cyan{background:linear-gradient(180deg,#E6FDFF 0%,#5EEBFF 50%,#1C9BFF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.txt-coral{background:linear-gradient(180deg,#FFE3D6 0%,#FF7A4D 45%,#E8202A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 16px 10px}
.sec-title .h2{display:flex;align-items:center;gap:8px}

/* ---------------- 3D candy buttons ---------------- */
.b3{--c1:#FFE066;--c2:#FFB01F;--c3:#FF8A00;--lip:#A85300;--fg:#3A1A00;--h:56px;
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:var(--h);padding:0 26px;border-radius:18px;
  font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:.01em;text-transform:uppercase;color:var(--fg);
  background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 52%,var(--c3) 100%);
  box-shadow:0 6px 0 var(--lip),0 14px 26px -4px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.7),inset 0 -4px 0 rgba(0,0,0,.12);
  transform:translateY(0);transition:transform .14s var(--spring),box-shadow .14s var(--spring),filter .2s;isolation:isolate;overflow:visible;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.b3::before{content:"";position:absolute;inset:3px 4px 50% 4px;border-radius:14px 14px 40% 40%/14px 14px 12px 12px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.04));z-index:-1;pointer-events:none}
.b3 .shine{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.b3 .shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-18deg);animation:shine 3.4s var(--out) infinite}
@keyframes shine{0%,62%{left:-60%}100%{left:130%}}
.b3.pressed,.b3:active{transform:translateY(5px);box-shadow:0 1px 0 var(--lip),0 6px 12px -4px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.12)}
.b3.coral{--c1:#FF9A6B;--c2:#FF4B3E;--c3:#E01E36;--lip:#7E0A1A;--fg:#fff;text-shadow:0 2px 0 rgba(120,10,20,.45)}
.b3.cyan{--c1:#9BF6FF;--c2:#2EC9FF;--c3:#1A86F0;--lip:#0A3F8A;--fg:#fff;text-shadow:0 2px 0 rgba(10,50,120,.45)}
.b3.green{--c1:#9DFFB9;--c2:#2EE07A;--c3:#10B45A;--lip:#07603A;--fg:#fff;text-shadow:0 2px 0 rgba(5,80,40,.45)}
.b3.violet{--c1:#D3B5FF;--c2:#9F6BFF;--c3:#7337F0;--lip:#3B158C;--fg:#fff;text-shadow:0 2px 0 rgba(50,10,120,.45)}
.b3.dark{--c1:#3A4380;--c2:#252B5C;--c3:#1B2048;--lip:#0B0E26;--fg:#fff;text-shadow:none}
.b3.dark::before{opacity:.25}
.b3.sm{--h:40px;font-size:13px;padding:0 16px;border-radius:13px;box-shadow:0 4px 0 var(--lip),0 8px 16px -4px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.12)}
.b3.sm.pressed,.b3.sm:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip),inset 0 2px 0 rgba(255,255,255,.6)}
.b3.sm::before{border-radius:10px 10px 30% 30%/10px 10px 8px 8px}
.b3.xl{--h:74px;font-size:24px;border-radius:24px;padding:0 34px;box-shadow:0 8px 0 var(--lip),0 20px 40px -6px rgba(0,0,0,.6),inset 0 3px 0 rgba(255,255,255,.7),inset 0 -5px 0 rgba(0,0,0,.14)}
.b3.xl.pressed,.b3.xl:active{transform:translateY(7px);box-shadow:0 1px 0 var(--lip),0 8px 14px -4px rgba(0,0,0,.6),inset 0 3px 0 rgba(255,255,255,.6)}
.b3.xl::before{border-radius:20px 20px 40% 40%/20px 20px 14px 14px}
.b3.block{display:flex;width:100%}
.b3[disabled]{filter:grayscale(.9) brightness(.7);pointer-events:none}
.b3 .ic{width:22px;height:22px}
.b3.xl .ic{width:30px;height:30px}

/* круглая иконка-кнопка */
.ib{position:relative;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;
  background:linear-gradient(180deg,#2C3470,#1A1F4A);box-shadow:0 4px 0 #0A0D26,inset 0 1.5px 0 rgba(255,255,255,.18),0 8px 16px -6px rgba(0,0,0,.6);transition:transform .14s var(--spring),box-shadow .14s}
.ib:active,.ib.pressed{transform:translateY(3px);box-shadow:0 1px 0 #0A0D26,inset 0 1.5px 0 rgba(255,255,255,.18)}
.ib svg{width:22px;height:22px}
.dot{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:linear-gradient(180deg,#FF6A5A,#E0172C);color:#fff;font:900 11px/20px var(--display);text-align:center;box-shadow:0 0 0 2.5px var(--bg1),0 4px 10px rgba(224,23,44,.6);animation:dotpop 2.4s var(--spring) infinite}
@keyframes dotpop{0%,80%,100%{transform:scale(1)}88%{transform:scale(1.25)}}

/* ---------------- panels ---------------- */
.pnl{position:relative;border-radius:22px;background:linear-gradient(180deg,rgba(46,54,118,.78) 0%,rgba(22,26,64,.88) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.05),0 14px 30px -10px rgba(0,0,0,.7)}
.pnl.inset{background:linear-gradient(180deg,rgba(6,8,24,.72),rgba(12,15,40,.6));box-shadow:inset 0 2px 6px rgba(0,0,0,.6),inset 0 -1px 0 rgba(255,255,255,.06)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.08);color:var(--ink2)}
.chip.gold{background:linear-gradient(180deg,rgba(255,201,58,.28),rgba(255,140,0,.18));color:#FFE28A;box-shadow:inset 0 0 0 1px rgba(255,201,58,.35)}
.chip.cyan{background:rgba(46,230,255,.14);color:var(--cyan2);box-shadow:inset 0 0 0 1px rgba(46,230,255,.3)}
.chip.coral{background:rgba(255,75,62,.18);color:#FFB3A6;box-shadow:inset 0 0 0 1px rgba(255,75,62,.35)}
.chip.green{background:rgba(59,245,160,.15);color:#9CFFD0;box-shadow:inset 0 0 0 1px rgba(59,245,160,.3)}
.chip.violet{background:rgba(159,107,255,.18);color:#D9C6FF;box-shadow:inset 0 0 0 1px rgba(159,107,255,.35)}

/* ---------------- progress bars ---------------- */
.bar{position:relative;height:14px;border-radius:8px;background:rgba(0,0,0,.45);box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.06);overflow:hidden}
.bar>i{position:absolute;inset:2px auto 2px 2px;width:calc((100% - 4px) * var(--p,0));border-radius:6px;background:linear-gradient(180deg,#9BF6FF,#2EC9FF 55%,#1A86F0);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 12px rgba(46,201,255,.6);transition:width 1s var(--out)}
.bar>i::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px);animation:barstripes 1s linear infinite}
@keyframes barstripes{to{background-position:17px 0}}
.bar.gold>i{background:linear-gradient(180deg,#FFF0A0,#FFC93A 55%,#FF9500);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 12px rgba(255,180,0,.6)}
.bar.coral>i{background:linear-gradient(180deg,#FFB199,#FF4B3E 55%,#D51B30);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 12px rgba(255,75,62,.6)}
.bar.green>i{background:linear-gradient(180deg,#B8FFD5,#3BF5A0 55%,#10B45A)}
.bar .lbl{position:absolute;inset:0;display:grid;place-items:center;font:900 9.5px/1 var(--display);letter-spacing:.04em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);z-index:2}

/* ---------------- top HUD ---------------- */
.hud{position:relative;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + var(--tgt) + 10px) 12px 6px}
.hud-me{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.lvl-ring{position:relative;width:48px;height:48px;flex:none}
.lvl-ring svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.lvl-ring .av{position:absolute;inset:5px;border-radius:50%;overflow:hidden}
.lvl-ring .lv{position:absolute;right:-5px;bottom:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:8px;display:grid;place-items:center;font:900 11px/1 var(--display);color:#3A1A00;background:linear-gradient(180deg,#FFF0A0,#FFB01F);box-shadow:0 2px 0 #A85300,0 0 0 2px var(--bg1)}
.hud-name{min-width:0}
.hud-name b{display:block;font:900 13px/1.1 var(--display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-name span{display:flex;white-space:nowrap;align-items:center;gap:4px;font-size:11px;color:var(--ink2);margin-top:3px}
.cur{position:relative;display:flex;align-items:center;height:32px;padding:0 6px 0 30px;border-radius:12px;background:rgba(3,5,18,.7);box-shadow:inset 0 2px 4px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.08);font:900 13px/1 var(--display);letter-spacing:-.01em}
.cur .ci{position:absolute;left:-8px;top:50%;width:36px;height:36px;transform:translateY(-50%);filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.cur .plus{width:20px;height:20px;margin-left:7px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(180deg,#5BF79A,#18B85F);box-shadow:0 2px 0 #07603A,inset 0 1px 0 rgba(255,255,255,.6);color:#fff;font:900 15px/1 var(--display)}
.cur .v{min-width:34px;text-align:right}
.bump{animation:bump .42s var(--spring)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.28) translateY(-2px)}100%{transform:scale(1)}}
.bump-ic{animation:bumpic .5s var(--spring)}
@keyframes bumpic{0%{transform:translateY(-50%) scale(1) rotate(0)}30%{transform:translateY(-50%) scale(1.4) rotate(-14deg)}100%{transform:translateY(-50%) scale(1) rotate(0)}}

/* ---------------- bottom nav (CR-style expanding) ---------------- */
#nav{position:absolute;left:0;right:0;bottom:0;padding:0 8px calc(var(--sab) + 8px);display:flex;gap:4px;align-items:flex-end;
  background:linear-gradient(180deg,transparent,rgba(4,5,13,.85) 38%,rgba(4,5,13,.98));transition:transform .45s var(--out)}
#nav.hide{transform:translateY(130%)}
#nav .navbg{position:absolute;left:8px;right:8px;bottom:calc(var(--sab) + 8px);height:66px;border-radius:24px;background:linear-gradient(180deg,#1E2457,#121638);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.12),0 -10px 30px rgba(0,0,0,.4),0 6px 0 #070920}
#nav .tab{position:relative;z-index:1;flex:1;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:flex .45s var(--spring)}
#nav .tab.on{flex:1.65}
#nav .tab .glow{position:absolute;inset:6px 2px;border-radius:18px;background:linear-gradient(180deg,#FFD54A,#FF9A1A);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #A85300,0 0 24px rgba(255,180,30,.45);opacity:0;transform:scale(.6);transition:opacity .25s,transform .45s var(--spring)}
#nav .tab.on .glow{opacity:1;transform:scale(1)}
#nav .tab .ti{position:relative;width:34px;height:34px;transition:transform .45s var(--spring);filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
#nav .tab.on .ti{transform:translateY(-16px) scale(1.42)}
#nav .tab .tl{position:absolute;bottom:9px;font:900 10.5px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:#3A1A00;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .35s var(--spring)}
#nav .tab.on .tl{opacity:1;transform:none;transition-delay:.06s}
#nav .tab:not(.on) .ti{opacity:.62;filter:grayscale(.35) drop-shadow(0 3px 2px rgba(0,0,0,.45))}
#nav .tab .dot{top:6px;right:calc(50% - 26px)}

/* ---------------- toasts ---------------- */
.toast{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:16px;background:linear-gradient(180deg,#2A3170,#171B44);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 12px 28px rgba(0,0,0,.6);font-size:13px;font-weight:800;
  animation:toastIn .55s var(--spring2) both}
.toast.out{animation:toastOut .25s var(--in) both}
.toast .ti{width:30px;height:30px;flex:none}
@keyframes toastIn{from{transform:translateY(-40px) scale(.85);opacity:0}}
@keyframes toastOut{to{transform:translateY(-20px) scale(.9);opacity:0}}

/* ---------------- wipe transition ---------------- */
#wipe{position:absolute;inset:0;z-index:80;pointer-events:none;overflow:hidden;visibility:hidden}
#wipe.on{visibility:visible}
#wipe i{position:absolute;left:-60%;width:220%;height:46%;transform:translateX(-120%) skewY(-12deg);}
#wipe i:nth-child(1){top:-6%;background:linear-gradient(90deg,#FF4B3E,#FF7A4D)}
#wipe i:nth-child(2){top:30%;background:linear-gradient(90deg,#0A0D22,#141A3E);box-shadow:0 0 0 6px #2EE6FF}
#wipe i:nth-child(3){top:66%;background:linear-gradient(90deg,#1A86F0,#2EE6FF)}
#wipe.in i{animation:wipeIn .42s var(--in) forwards}
#wipe.in i:nth-child(2){animation-delay:.05s}
#wipe.in i:nth-child(3){animation-delay:.1s}
#wipe.outw i{transform:translateX(0) skewY(-12deg);animation:wipeOut .5s var(--out) forwards}
#wipe.outw i:nth-child(2){animation-delay:.04s}
#wipe.outw i:nth-child(3){animation-delay:.08s}
@keyframes wipeIn{from{transform:translateX(-120%) skewY(-12deg)}to{transform:translateX(0) skewY(-12deg)}}
@keyframes wipeOut{from{transform:translateX(0) skewY(-12deg)}to{transform:translateX(120%) skewY(-12deg)}}

/* ---------------- entry choreography ---------------- */
.rise{opacity:0;transform:translateY(26px) scale(.96)}
.screen.live .rise{animation:rise .7s var(--spring2) forwards;animation-delay:calc(var(--d,0) * 55ms + 60ms)}
@keyframes rise{to{opacity:1;transform:none}}
.pop{opacity:0;transform:scale(.4)}
.screen.live .pop{animation:popin .6s var(--spring) forwards;animation-delay:calc(var(--d,0) * 70ms + 100ms)}
@keyframes popin{to{opacity:1;transform:none}}

/* ---------------- sheets ---------------- */
.sheet-wrap{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-wrap .scrim{position:absolute;inset:0;background:rgba(2,3,10,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .3s}
.sheet-wrap.open .scrim{opacity:1}
.sheet{position:relative;max-height:88%;display:flex;flex-direction:column;border-radius:30px 30px 0 0;padding:10px 16px calc(var(--sab) + 18px);
  background:linear-gradient(180deg,#252C68 0%,#141838 40%,#0E1130 100%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.16),0 -20px 60px rgba(0,0,0,.6);
  transform:translateY(105%);transition:transform .55s var(--spring2)}
.sheet-wrap.open .sheet{transform:none}
.sheet-wrap.closing .sheet{transition:transform .28s var(--in);transform:translateY(105%)}
.sheet-wrap.closing .scrim{opacity:0}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:0 auto 12px}
.sheet .sbody{overflow-y:auto;scrollbar-width:none}

/* ---------------- rarity frames ---------------- */
.rar{--rc:var(--r-common)}
.rar.rare{--rc:var(--r-rare)} .rar.epic{--rc:var(--r-epic)} .rar.leg{--rc:var(--r-leg)}
.beam{position:relative;isolation:isolate}
.beam::before{content:"";position:absolute;inset:-2px;border-radius:inherit;padding:2px;background:conic-gradient(from var(--ang,0deg),transparent 0 60%,var(--rc) 75%,#fff 80%,var(--rc) 85%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:beam 3.2s linear infinite;z-index:2;pointer-events:none}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes beam{to{--ang:360deg}}

/* ---------------- toggle ---------------- */
.tgl{position:relative;width:54px;height:32px;border-radius:16px;background:rgba(0,0,0,.5);box-shadow:inset 0 2px 4px rgba(0,0,0,.6);transition:background .3s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,#fff,#C9D2F5);box-shadow:0 3px 6px rgba(0,0,0,.4);transition:transform .45s var(--spring)}
.tgl.on{background:linear-gradient(180deg,#2EE07A,#10B45A)}
.tgl.on::after{transform:translateX(22px)}

/* ---------------- tabs pill ---------------- */
.seg{position:relative;display:flex;padding:4px;border-radius:16px;background:rgba(0,0,0,.4);box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.seg button{position:relative;z-index:1;flex:1;height:36px;border-radius:12px;font:900 12px/1 var(--display);text-transform:uppercase;color:var(--ink3);transition:color .3s}
.seg button.on{color:#fff}
.seg .pill{position:absolute;top:4px;bottom:4px;border-radius:12px;background:linear-gradient(180deg,#3A4390,#262D66);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.2),0 3px 0 #0B0E26;transition:left .45s var(--spring),width .45s var(--spring)}

/* ---------------- reduced motion ---------------- */
body.rm *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
body.q-low .b3 .shine,body.q-low .beam::before{display:none}

/* =====================================================================
   SCREENS
   ===================================================================== */

/* ---------- HUB ---------- */
.screen[data-id=hub]{padding-bottom:calc(var(--sab) + 84px)}
.road{display:flex;align-items:center;gap:6px;margin:4px 14px 0;padding:6px 8px;border-radius:18px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.road .bar{flex:1;height:18px}
.road .rb{width:34px;height:34px;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.road .rb.next{opacity:.55;filter:grayscale(.6) drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.hero{position:relative;flex:1;min-height:250px}
.arena-title{position:absolute;top:8px;left:0;right:0;text-align:center;z-index:2;pointer-events:none}
.arena-title b{display:block;font-size:30px;margin-top:4px;background:linear-gradient(180deg,#fff 30%,#9FC6FF);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(10,20,60,.7)) drop-shadow(0 0 24px rgba(46,201,255,.35))}
.hero canvas.demo{position:absolute;inset:40px 0 0;width:100%;height:calc(100% - 40px)}
.side{position:absolute;top:78px;display:flex;flex-direction:column;gap:26px;z-index:3}
.side.l .fab em{left:-4px;transform:none}.side.r .fab em{left:auto;right:-4px;transform:none}
.side.l{left:10px}.side.r{right:10px}
.fab{position:relative;width:50px;height:50px;border-radius:18px;display:grid;place-items:center;padding:12px;
  background:linear-gradient(180deg,rgba(52,62,130,.92),rgba(24,29,70,.95));box-shadow:0 4px 0 #090C24,inset 0 1.5px 0 rgba(255,255,255,.2),0 10px 20px -6px rgba(0,0,0,.6);transition:transform .14s var(--spring)}
.fab.pressed{transform:translateY(3px) scale(.96)}
.fab em{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font:900 9.5px/1 var(--display);font-style:normal;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.7),0 0 6px rgba(0,0,0,.8)}
.fab.free{padding:4px;background:linear-gradient(180deg,#5A3FB0,#2A1C70)}
.fab.free::after{content:"";position:absolute;inset:-4px;border-radius:21px;border:2px solid #FFC93A;animation:freepulse 1.6s var(--out) infinite;pointer-events:none}
@keyframes freepulse{from{transform:scale(1);opacity:1}to{transform:scale(1.35);opacity:0}}
.fab .fchest{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
.playzone{display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 20px;margin-top:-6px;position:relative;z-index:3}
.mode-chip{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px 0 6px;border-radius:16px;background:rgba(5,7,22,.72);box-shadow:inset 0 0 0 1px rgba(255,201,58,.28),0 8px 18px rgba(0,0,0,.4);text-align:left;transition:transform .2s var(--spring)}
.mode-chip.pressed{transform:scale(.96)}
.mode-chip .mi{width:34px;height:34px;padding:6px;border-radius:12px;background:linear-gradient(180deg,rgba(255,201,58,.3),rgba(255,140,0,.15))}
.mode-chip small{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.mode-chip b{display:block;font:900 14px/1.1 var(--display);text-transform:uppercase}
.mode-chip .chev{color:#FFC93A;font-size:14px;margin-left:4px}
.b3.play{width:100%;max-width:330px;animation:breathe 2.6s ease-in-out infinite}
.b3.play .ic,.b3.play svg{width:34px;height:34px}
.b3.play.pressed{animation:none}

.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px 12px 0}

  background:linear-gradient(180deg,rgba(40,48,110,.85),rgba(18,22,56,.92));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 4px 0 #080A22;transition:transform .14s var(--spring)}
.slot.pressed{transform:translateY(3px)}
.slot .sc{position:absolute;top:-10px;left:50%;transform:translateX(-50%)}

.slot.empty{background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);border:0;justify-content:center;font-size:10px;text-align:center;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;font-weight:800}

@keyframes readybob{0%,100%{transform:translateX(-50%) translateY(0) scale(1)}12%{transform:translateX(-50%) translateY(-6px) scale(1.06,.95) rotate(-4deg)}24%{transform:translateX(-50%) translateY(0) rotate(3deg)}36%{transform:translateX(-50%) rotate(0)}}

/* sheet contents */

.mcard .mt{flex:1}.mcard b{display:block;font:900 15px/1.1 var(--display);text-transform:uppercase}.mcard small{display:block;font-size:12px;color:var(--ink2);margin-top:4px}
.srow{display:flex;align-items:center;gap:12px;padding:12px 14px}

.quest{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px}

  -webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);animation:spin 18s linear infinite}

/* ---------- MATCHMAKING ---------- */

.vs-st i{position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:2px;background:linear-gradient(90deg,#FF4B3E calc(var(--a) * 100%),#2EC9FF 0)}

/* ---------- CHEST OPEN ---------- */
.cho{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow:hidden}

.cho-rays{position:absolute;left:50%;top:48%;width:1100px;height:1100px;margin:-550px 0 0 -550px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(220,190,255,.18) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,#000,transparent 50%);mask:radial-gradient(circle,#000,transparent 50%);animation:spin 20s linear infinite;opacity:.25;transition:opacity .6s}

.cho-stage{position:relative;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s,transform .6s var(--spring2)}

.cho-chest.charge{animation:charge .7s linear forwards;filter:brightness(1.4) drop-shadow(0 0 30px #FFE680)}
@keyframes charge{0%{transform:none}20%{transform:translateX(-4px) rotate(-2deg)}40%{transform:translateX(5px) rotate(2deg) scale(1.04)}60%{transform:translateX(-6px) rotate(-3deg) scale(1.08)}80%{transform:translateX(7px) rotate(3deg) scale(1.12)}100%{transform:scale(1.16)}}
.cho.opened .ch-lid{transform:translateY(-90px) rotate(-28deg);opacity:0;transition:transform .7s cubic-bezier(.2,1.4,.4,1),opacity .7s .2s}
.cho.opened .cho-stage{transform:translateY(160px) scale(.7);opacity:.5}
.cho-taps{display:flex;gap:10px;margin-top:20px}
.cho-taps i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.12);box-shadow:inset 0 2px 3px rgba(0,0,0,.5);transition:all .3s var(--spring)}
.cho-taps i.on{background:#FFC93A;box-shadow:0 0 14px #FFC93A;transform:scale(1.25)}
.cho.opened .cho-taps{opacity:0}
.cho-card{position:absolute;left:0;right:0;top:22%;display:grid;place-items:center;perspective:900px;z-index:3;pointer-events:none}
.lcard{width:200px;height:270px;border-radius:24px;transform:translateY(240px) scale(.3) rotate(-10deg);opacity:0;transition:transform .5s cubic-bezier(.2,1.3,.4,1),opacity .2s}
.lcard.in{transform:none;opacity:1}
.lc-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.lcard.flip .lc-in{transform:rotateY(180deg)}
.lc-back,.lc-front{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.lc-back{display:grid;place-items:center;padding:60px;background:repeating-linear-gradient(45deg,#2A1C70 0 10px,#24186A 10px 20px);box-shadow:inset 0 0 0 4px #4A3A9E,0 20px 40px rgba(0,0,0,.6)}
.lc-front{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;padding:16px 12px;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 30%,color-mix(in srgb,var(--rc) 55%,#1A1F4A),#10132E 75%);box-shadow:inset 0 0 0 3px var(--rc),inset 0 0 40px color-mix(in srgb,var(--rc) 40%,transparent),0 0 50px color-mix(in srgb,var(--rc) 50%,transparent),0 20px 40px rgba(0,0,0,.6)}
.lc-r{font:900 10px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:8px;background:var(--rc);color:#10132E}
.lc-art{flex:1;display:grid;place-items:center;filter:drop-shadow(0 12px 16px rgba(0,0,0,.5));animation:bob 2.4s ease-in-out infinite}
.lc-n{font:900 30px/1 var(--display);text-shadow:0 3px 0 rgba(0,0,0,.4)}
.lc-t{font-size:12px;font-weight:800;color:var(--ink2);margin-top:6px;text-align:center}
.lc-foil{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,rgba(160,255,255,.2) 50%,transparent 62%);background-size:250% 100%;animation:foil 2.4s ease-in-out infinite;mix-blend-mode:overlay;pointer-events:none}

.sg{aspect-ratio:3/4;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;background:radial-gradient(100% 70% at 50% 30%,color-mix(in srgb,var(--rc) 45%,#1A1F4A),#10132E);box-shadow:inset 0 0 0 2px var(--rc);opacity:0;animation:popin .5s var(--spring) forwards;animation-delay:calc(var(--d) * 90ms)}

.prod{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 4px}

/* ---------- PASS ---------- */
.pass-hero{position:relative;margin:4px 14px 0;height:200px;border-radius:26px;overflow:hidden;padding:16px;

.pc{position:relative;height:84px;margin:0 6px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(180deg,rgba(40,48,110,.85),rgba(18,22,56,.92));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 0 #080A22;transition:transform .14s var(--spring)}

.pc.ready{animation:readyp 1.4s ease-in-out infinite}
.pc.ready::after{content:"Забрать";position:absolute;bottom:-8px;font:900 9px/1 var(--display);text-transform:uppercase;padding:4px 8px;border-radius:7px;background:linear-gradient(180deg,#5BF79A,#18B85F);box-shadow:0 2px 0 #07603A}
@keyframes readyp{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 0 #080A22,0 0 0 0 rgba(59,245,160,.6)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 0 #080A22,0 0 0 6px rgba(59,245,160,0),0 0 22px rgba(59,245,160,.5)}}
.pc.claimed .pca,.pc.claimed b{opacity:.35;filter:grayscale(.6)}
.pcc{position:absolute;top:6px;right:6px;width:24px;height:24px;padding:4px;border-radius:50%;background:linear-gradient(180deg,#5BF79A,#18B85F);box-shadow:0 3px 0 #07603A;animation:popin .4s var(--spring) both}
.pc.future .pca{opacity:.55}
.pcl{position:absolute;top:6px;right:6px;width:22px;height:22px;padding:3px;border-radius:8px;background:rgba(0,0,0,.55)}
.pc.locked .pca{opacity:.5;filter:grayscale(.3)}

/* ---------- RANKS ---------- */
.rk-body{padding-top:6px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;padding:20px 14px 0;height:300px}
.pod{display:flex;flex-direction:column;align-items:center;flex:1;max-width:112px}
.pd-av{position:relative;opacity:0;transform:translateY(-60px) scale(.6)}
.rk-body.go .pd-av{animation:podav .6s cubic-bezier(.3,1.6,.5,1) forwards}
.pod.p1 .pd-av{animation-delay:.75s!important}.pod.p2 .pd-av{animation-delay:.55s!important}.pod.p3 .pd-av{animation-delay:.6s!important}
@keyframes podav{to{opacity:1;transform:none}}
.crown{position:absolute;top:-30px;left:50%;width:38px;height:38px;transform:translateX(-50%) rotate(-8deg);filter:drop-shadow(0 4px 6px rgba(0,0,0,.5)) drop-shadow(0 0 12px rgba(255,201,58,.6));animation:bob 2.4s ease-in-out infinite}
.pd-n{font:900 11.5px/1.1 var(--display);text-transform:uppercase;margin-top:8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pd-r{display:flex;align-items:center;gap:3px;font:900 11px/1 var(--display);color:#FFE28A;margin-top:4px}
.pd-col{width:100%;margin-top:10px;border-radius:16px 16px 4px 4px;display:flex;justify-content:center;padding-top:12px;transform-origin:bottom;transform:scaleY(0);
  background:linear-gradient(180deg,var(--pc1),var(--pc2));box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -20px 30px rgba(0,0,0,.25)}
.rk-body.go .pd-col{animation:podcol .7s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes podcol{to{transform:scaleY(1)}}
.pd-col span{font:900 34px/1 var(--display);color:rgba(255,255,255,.9);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.pod.p1{--pc1:#FFE066;--pc2:#E08A00}.pod.p1 .pd-col{height:130px;animation-delay:.25s!important}
.pod.p2{--pc1:#E6EEFF;--pc2:#7B8BB0}.pod.p2 .pd-col{height:96px;animation-delay:.1s!important}
.pod.p3{--pc1:#F0B888;--pc2:#9A5426}.pod.p3 .pd-col{height:74px;animation-delay:.15s!important}
.lb{display:flex;flex-direction:column;gap:8px;padding:14px 14px 0}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:18px;background:linear-gradient(180deg,rgba(40,48,110,.7),rgba(18,22,56,.85));box-shadow:inset 0 1px 0 rgba(255,255,255,.1);opacity:0;transform:translateX(40px)}
.rk-body.go .lrow{animation:lrow .5s var(--spring2) forwards;animation-delay:calc(var(--d,0) * 50ms + .9s)}
@keyframes lrow{to{opacity:1;transform:none}}
.lp{width:30px;text-align:center;font:900 14px/1 var(--display);color:var(--ink3)}
.ln{flex:1;min-width:0}.ln b{display:block;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ln small{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.lch{font:900 10px/1 var(--display)}.lch.up{color:#3BF5A0}.lch.dn{color:#FF6A5A}
.lr{display:flex;align-items:center;gap:5px;font:900 13px/1 var(--display)}
.lrow.me{background:linear-gradient(100deg,rgba(255,75,62,.4),rgba(40,20,60,.9));box-shadow:inset 0 0 0 1.5px rgba(255,122,77,.6)}
.lrow.sticky{position:sticky;bottom:-26px;background:linear-gradient(100deg,#7A2430,#2A1440)!important;margin:12px 14px 0;z-index:5;box-shadow:inset 0 0 0 1.5px rgba(255,122,77,.6),0 -10px 30px rgba(0,0,0,.6),0 10px 20px rgba(0,0,0,.4)}
.lrow.sticky .lp{width:auto;min-width:30px;font-size:12px;color:#FFB3A6}

/* ---------- PROFILE ---------- */
.pf-hero{position:relative;margin:4px 14px 0;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;overflow:hidden;
  background:radial-gradient(80% 100% at 100% 0%,rgba(46,201,255,.28),transparent 60%),linear-gradient(180deg,rgba(46,54,118,.85),rgba(22,26,64,.92))}
.pf-av{position:relative}
.pf-av .avatar{box-shadow:0 0 0 3px #7DF3FF,0 0 24px rgba(46,201,255,.5)}
.pf-lv{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);min-width:30px;height:24px;padding:0 6px;border-radius:9px;display:grid;place-items:center;font:900 12px/1 var(--display);color:#3A1A00;background:linear-gradient(180deg,#FFF0A0,#FFB01F);box-shadow:0 2px 0 #A85300}
.pf-id{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;padding-right:40px}
.pf-id .h2{font-size:16px}.pf-id .dim{font-size:12px}
.pf-id .chip svg{width:14px;height:14px}
.pf-set{position:absolute;top:12px;right:12px;width:40px;height:40px}
.pf-league{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(0,0,0,.3)}
.pf-league .pfl-b{margin:-18px 0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));animation:bob 3s ease-in-out infinite}
.pf-league b{margin-left:auto;font:900 26px/1 var(--display)}
.pf-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:12px 14px 0}
.pst{padding:12px;display:flex;flex-direction:column;gap:8px;min-height:92px;justify-content:space-between}
.pst b{font:900 28px/1 var(--display)}
.pst.ring{align-items:center;justify-content:center;gap:4px;position:relative}
.pst.ring svg{position:absolute;top:8px;width:60px;height:60px;transform:rotate(-90deg)}
.pst.ring b{font-size:15px;margin-top:22px;position:relative}
.pst.ring .cap{margin-top:22px}
.chart{margin:12px 14px 0;padding:14px}
.ch-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.ch-h b{margin-left:auto;font:900 20px/1 var(--display)}
.ch-h em{font:900 11px/1 var(--display);font-style:normal;padding:4px 6px;border-radius:7px;color:#9CFFD0;background:rgba(59,245,160,.14)}
.ch-wrap{touch-action:none;cursor:crosshair}
.chsvg{width:100%;height:120px;overflow:visible}
.chsvg .ch-line{stroke-dasharray:900;stroke-dashoffset:900}
.chsvg .ch-area{opacity:0}
.chart.go .ch-line{transition:stroke-dashoffset 1.6s cubic-bezier(.16,1,.3,1);stroke-dashoffset:0}
.chart.go .ch-area{transition:opacity 1s .6s;opacity:1}
.chsvg .ch-dot{filter:drop-shadow(0 0 6px #2EC9FF);transition:cx .08s,cy .08s}
.skills{margin:12px 14px 0;padding:14px}
.sk-wrap{display:grid;place-items:center}
.rdsvg{width:230px;height:230px;overflow:visible}
.rd-shape{transform-origin:90px 90px;transform:scale(0)}
.skills.go .rd-shape{transition:transform 1s cubic-bezier(.3,1.5,.5,1);transform:scale(1)}
.rd-dot{opacity:0}.skills.go .rd-dot{transition:opacity .4s .8s;opacity:1}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px}
.ac{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 4px;border-radius:18px;background:rgba(0,0,0,.25)}
.aci{width:52px;height:52px;padding:12px;border-radius:16px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08)}
.ac.got .aci{background:linear-gradient(180deg,#FFE066,#FFA41B);box-shadow:0 4px 0 #A85300,inset 0 2px 0 rgba(255,255,255,.6),0 0 20px rgba(255,180,0,.35)}
.ac small{font-size:10.5px;font-weight:800;color:var(--ink2)}
.ac:not(.got) small{color:var(--ink3)}
.eq .icard{padding-bottom:14px}

/* ---------- SPLASH ---------- */
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sp-logo{position:relative;display:flex;flex-direction:column;align-items:center}
.sp-ball{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#FFE6C8 60%,#F2B880);box-shadow:0 0 30px rgba(255,255,255,.6);animation:spball 1.1s cubic-bezier(.5,0,.5,1) both}
@keyframes spball{0%{transform:translateY(-320px)}45%{transform:translateY(0) scale(1.2,.8)}60%{transform:translateY(-70px) scale(.95,1.05)}80%{transform:translateY(0) scale(1.1,.9)}90%{transform:translateY(-12px)}100%{transform:none}}
.sp-paddles{position:absolute;top:-20px;display:flex;gap:90px;opacity:0;animation:popin .5s var(--spring) .9s forwards}
.sp-paddles>span:first-child{transform:scaleX(-1)}
.sp-t1{font:900 15px/1 var(--display);letter-spacing:.4em;text-transform:uppercase;color:var(--ink2);margin-top:30px}
.sp-t2{display:flex;font:900 38px/1 var(--display);text-transform:uppercase;letter-spacing:-.03em;margin-top:10px}
.sp-t2 .ch{display:inline-block;opacity:0;transform:translateY(40px) scale(.6);animation:chdrop .5s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(1s + var(--i) * 45ms);background:linear-gradient(180deg,#FFE3D6,#FF7A4D 45%,#E8202A);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #5A0A10)}
.sp-bar{width:220px;margin-top:60px;opacity:0;animation:fadeto .4s 1.4s forwards}
.sp-tip{margin-top:12px;font-size:12px;color:var(--ink3);text-align:center;height:16px;opacity:0;animation:fadeto .4s 1.6s forwards}
@keyframes fadeto{to{opacity:1}}
</style>
</head>

/* ---------- синтез звука (WebAudio, без файлов) ---------- */
const Sfx = (() => {
  let ctx = null, master = null, noiseBuf = null;
  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = .55;
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
      master.connect(comp); comp.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * .5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return true;
    } catch (e) { return false; }
  }
  const ok = () => S.sfx && ensure();
  function tone(freq, dur, { type = 'sine', vol = .3, slide = 0, delay = 0, attack = .004 } = {}) {
    const t = ctx.currentTime + delay; const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, { f = 2000, q = 1, vol = .3, type = 'bandpass', delay = 0, sweep = 0 } = {}) {
    const t = ctx.currentTime + delay; const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
    if (sweep) fl.frequency.exponentialRampToValueAtTime(f * sweep, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .02);
  }
  return {
    unlock: ensure,
    tap() { if (!ok()) return; tone(880, .06, { type: 'triangle', vol: .18, slide: 1.4 }); },
    soft() { if (!ok()) return; tone(520, .07, { type: 'sine', vol: .14, slide: 1.2 }); },
    tab() { if (!ok()) return; tone(660, .08, { type: 'triangle', vol: .16, slide: 1.5 }); tone(990, .06, { type: 'sine', vol: .08, delay: .03 }); },
    paddle(p = 1) { if (!ok()) return; noise(.05, { f: 2600 * p, q: 2.5, vol: .5 }); tone(1150 * p, .07, { type: 'sine', vol: .28, slide: .6 }); },
    table() { if (!ok()) return; noise(.03, { f: 3800, q: 3, vol: .32 }); tone(720, .06, { type: 'sine', vol: .22, slide: .7 }); },
    net() { if (!ok()) return; noise(.12, { f: 900, q: .8, vol: .3, type: 'lowpass' }); },
    whoosh() { if (!ok()) return; noise(.32, { f: 500, q: .9, vol: .35, sweep: 6 }); },
    smash() { if (!ok()) return; noise(.08, { f: 3000, q: 1.5, vol: .7 }); tone(160, .3, { type: 'sine', vol: .5, slide: .4 }); noise(.4, { f: 600, q: .7, vol: .3, sweep: 5, delay: .02 }); },
    coin(i = 0) { if (!ok()) return; const b = 1320 * Math.pow(1.06, i % 6); tone(b, .09, { type: 'square', vol: .06 }); tone(b * 1.5, .16, { type: 'triangle', vol: .12, delay: .05 }); },
    gem(i = 0) { if (!ok()) return; tone(1760 * Math.pow(1.05, i % 5), .2, { type: 'sine', vol: .14 }); tone(2640, .14, { type: 'sine', vol: .06, delay: .04 }); },
    impact() { if (!ok()) return; tone(110, .45, { type: 'sine', vol: .7, slide: .35 }); noise(.25, { f: 400, q: .6, vol: .45, type: 'lowpass' }); },
    point() { if (!ok()) return; [784, 988, 1318].forEach((f, i) => tone(f, .22, { type: 'triangle', vol: .2, delay: i * .07 })); },
    lose() { if (!ok()) return; [440, 370, 294].forEach((f, i) => tone(f, .26, { type: 'triangle', vol: .18, delay: i * .1 })); },
    win() { if (!ok()) return; [523, 659, 784, 1046, 1318].forEach((f, i) => { tone(f, .35, { type: 'triangle', vol: .2, delay: i * .09 }); tone(f / 2, .35, { type: 'sine', vol: .1, delay: i * .09 }); }); },
    tick() { if (!ok()) return; tone(1400, .03, { type: 'square', vol: .05 }); },
    count(n) { if (!ok()) return; tone(n ? 660 : 1320, n ? .18 : .45, { type: 'triangle', vol: .28 }); },

/* ---------- числовой тикер с «подпрыгиванием» ---------- */
function tickNumber(el, from, to, dur = 900, { prefix = '', suffix = '', onTick } = {}) {
  if (!el) return Promise.resolve();
  return new Promise((res) => {
    const t0 = performance.now(); let last = from;
    const step = (now) => {
      const t = clamp((now - t0) / dur, 0, 1); const v = Math.round(lerp(from, to, easeOut(t)));
      if (v !== last) { el.textContent = prefix + fmt(v) + suffix; last = v; onTick && onTick(v); }
      if (t < 1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
}
function bump(el, cls = 'bump') { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* ---------- роутер с хореографией переходов ---------- */
const Router = {
  screens: {}, cur: null, stack: [], busy: false,
  TABS: ['shop', 'pass', 'hub', 'ranks', 'profile'],
  def(id, d) { this.screens[id] = d; },
  async go(id, { mode = 'auto', data = null, replace = false } = {}) {
    if (this.busy) return; const d = this.screens[id]; if (!d) return;
    if (Sheet.cur) Sheet.close(true);
    this.busy = true;
    const prev = this.cur; const prevD = prev && this.screens[prev];
    const host = $('#screens');
    if (mode === 'auto') mode = (this.TABS.includes(id) && this.TABS.includes(prev)) ? 'tab' : (d.full || (prevD && prevD.full) ? 'wipe' : 'push');
    if (mode === 'wipe') await Wipe.cover();
    const el = document.createElement('section'); el.className = 'screen'; el.dataset.id = id;
    el.innerHTML = d.render(data);
    const oldEl = host.querySelector('.screen.current');
    host.appendChild(el);
    if (prevD && prevD.leave) try { prevD.leave(); } catch (e) { console.error(e); }
    BG.mood(d.mood || 'arena');
    Nav.show(!d.full); Nav.set(this.TABS.includes(id) ? id : null);
    if (mode === 'tab' && oldEl) {
      const dir = this.TABS.indexOf(id) > this.TABS.indexOf(prev) ? 1 : -1;
      el.animate([{ transform: `translateX(${dir * 38}%)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 480, easing: 'cubic-bezier(.16,1,.3,1)' });
      oldEl.animate([{ transform: 'none', opacity: 1 }, { transform: `translateX(${-dir * 24}%) scale(.96)`, opacity: 0 }], { duration: 340, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' });
      Sfx.tab();
    } else if (mode === 'push' && oldEl) {
      el.animate([{ transform: 'translateY(6%) scale(.97)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 460, easing: 'cubic-bezier(.16,1,.3,1)' });
      oldEl.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(1.03)' }], { duration: 260, fill: 'forwards' });
    }
    el.classList.add('current'); if (oldEl) oldEl.classList.remove('current');
    requestAnimationFrame(() => el.classList.add('live'));
    if (replace && this.stack.length) this.stack[this.stack.length - 1] = id;
    else if (this.TABS.includes(id)) this.stack = [id];
    else this.stack.push(id);
    this.cur = id;
    try { d.mount && d.mount(el, data); } catch (e) { console.error(e); }
    TGX.back(this.stack.length > 1 && !this.TABS.includes(id));
    Dev.mark(id);
    setTimeout(() => { if (oldEl) oldEl.remove(); }, mode === 'wipe' ? 0 : 500);
    if (mode === 'wipe') await Wipe.reveal();
    this.busy = false;
  },
  back() {
    if (Sheet.cur) { Sheet.close(); return; }
    const d = this.screens[this.cur]; if (d && d.onBack) { d.onBack(); return; }
    if (this.stack.length > 1) { this.stack.pop(); const id = this.stack.pop(); this.go(id); }
    else if (this.cur !== 'hub') this.go('hub');
  }
};

const Wipe = {

    const w = this.el || (this.el = $('#wipe'));

  return { coin, gem, star, trophy, badge, chest, CHEST, paddle, avatar, icon, navIcon };
})();

/* ==== fx.js ==== */
/* =====================================================================
   FX — единый canvas-слой VFX поверх интерфейса:
   искры, кольца ударной волны, конфетти, звёздочки, полёт монет к кошельку,
   тряска камеры. Цикл крутится только пока есть частицы.
   ===================================================================== */
const FX = (() => {
  let cv, ctx, W = 0, H = 0, dpr = 1, running = false, q = 1;
  const P = [];
  const sprites = {};
  function sprite(name, svg, px = 64) {
    const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent((svg.includes('xmlns=') ? svg : svg.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ')).replace(/width="\d+" height="\d+"/, `width="${px}" height="${px}"`));
    sprites[name] = img;
  }
  function init() {
    cv = $('#fx'); ctx = cv.getContext('2d');
    resize(); window.addEventListener('resize', resize);
    sprite('coin', Art.coin(64)); sprite('gem', Art.gem(64)); sprite('star', Art.star(64));
    setQuality(S.quality);
  }
  function resize() {
    const r = $('#device').getBoundingClientRect(); dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr;
  }
  function setQuality(qq) { q = qq === 'low' ? .35 : qq === 'mid' ? .65 : 1; }
  const n = (k) => Math.max(1, Math.round(k * q));
  function pt(el) {
    const d = $('#device').getBoundingClientRect(); const r = el.getBoundingClientRect();
    return { x: r.left - d.left + r.width / 2, y: r.top - d.top + r.height / 2 };
  }
  function loop() {
    if (!P.length) { running = false; ctx.clearRect(0, 0, cv.width, cv.height); return; }
    running = true; requestAnimationFrame(loop);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const now = performance.now();
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i]; const t = (now - p.t0) / p.life;
      if (t >= 1) { P.splice(i, 1); p.done && p.done(); continue; }
      if (t < 0) continue;
      draw(p, t);
    }
  }
  function add(p) { p.t0 = p.t0 || performance.now(); P.push(p); if (!running) loop(); }

  function draw(p, t) {
    const k = p.kind;
    if (k === 'spark') {
      p.vx *= .94; p.vy = p.vy * .94 + p.g; p.x += p.vx; p.y += p.vy;
      const a = 1 - t; ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = p.c; ctx.globalAlpha = a; ctx.lineWidth = p.w * (1 - t * .6); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * p.len, p.y - p.vy * p.len); ctx.stroke();
    } else if (k === 'dot') {
      p.vx *= .96; p.vy = p.vy * .96 + p.g; p.x += p.vx; p.y += p.vy;
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = (1 - t) * p.a;
      const r = p.r * (1 - t * .5); const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      g.addColorStop(0, '#fff'); g.addColorStop(.3, p.c); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
    } else if (k === 'ring') {
      const e = easeOut(t); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = (1 - t) * .9;
      ctx.strokeStyle = p.c; ctx.lineWidth = p.w * (1 - t) + .5;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r0 + (p.r1 - p.r0) * e, (p.r0 + (p.r1 - p.r0) * e) * (p.sy || 1), 0, 0, 7); ctx.stroke();
    } else if (k === 'confetti') {
      p.vx *= .985; p.vy = p.vy * .985 + p.g; p.x += p.vx + Math.sin((performance.now() + p.ph) / 180) * .6; p.y += p.vy; p.rot += p.vr;
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = t > .8 ? (1 - t) * 5 : 1;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.rot * 2.3));
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    } else if (k === 'twinkle') {
      ctx.globalCompositeOperation = 'lighter'; const s = Math.sin(t * Math.PI) * p.r; ctx.globalAlpha = Math.sin(t * Math.PI);
      ctx.fillStyle = p.c; ctx.beginPath();
      ctx.moveTo(p.x, p.y - s); ctx.quadraticCurveTo(p.x, p.y, p.x + s, p.y); ctx.quadraticCurveTo(p.x, p.y, p.x, p.y + s);
      ctx.quadraticCurveTo(p.x, p.y, p.x - s, p.y); ctx.quadraticCurveTo(p.x, p.y, p.x, p.y - s); ctx.fill();
    } else if (k === 'fly') {
      // фаза 1: разлёт, фаза 2: самонаведение по кривой Безье к цели
      const sp = sprites[p.sprite]; let x, y, s;
      const t1 = .28;
      if (t < t1) { const e = easeOut(t / t1); x = p.x0 + p.bx * e; y = p.y0 + p.by * e; s = .6 + .5 * e; }
      else {
        const u = easeInOut((t - t1) / (1 - t1)); const sx = p.x0 + p.bx, sy = p.y0 + p.by;
        const cx = (sx + p.tx) / 2 + p.cx, cy = Math.min(sy, p.ty) - 80 + p.cy;
        x = (1 - u) * (1 - u) * sx + 2 * (1 - u) * u * cx + u * u * p.tx; y = (1 - u) * (1 - u) * sy + 2 * (1 - u) * u * cy + u * u * p.ty; s = 1.1 - .45 * u;
      }
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      const sz = p.size * s;
      if (sp && sp.complete && sp.naturalWidth) { ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 10 + p.ph) * .3); ctx.drawImage(sp, -sz / 2, -sz / 2, sz, sz); ctx.restore(); }
      if (Math.random() < .5 * q) add({ kind: 'dot', x, y, vx: 0, vy: 0, g: 0, r: 7, c: p.sprite === 'gem' ? '#2EE6FF' : '#FFC93A', a: .6, life: 300 });
    } else if (k === 'text') {
      const e = easeOutBack(Math.min(1, t * 3)); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = t > .7 ? (1 - t) / .3 : 1;
      ctx.save(); ctx.translate(p.x, p.y - t * 40); ctx.scale(e, e);
      ctx.font = `900 ${p.size}px Unb, Arial Black`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(p.s, 0, 0); ctx.fillStyle = p.c; ctx.fillText(p.s, 0, 0); ctx.restore();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- публичные эффекты ---------- */
  function burst(x, y, { c = ['#FFC93A', '#FF7A4D', '#fff'], count = 22, speed = 9, g = .12, ring = true, size = 1 } = {}) {
    for (let i = 0; i < n(count); i++) {
      const a = Math.random() * Math.PI * 2, s = speed * (.4 + Math.random() * .8);
      add({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g, c: pick(c), w: rnd(2, 3.4) * size, len: rnd(1.6, 3), life: rnd(380, 700) });
    }
    for (let i = 0; i < n(count / 2); i++) {
      const a = Math.random() * Math.PI * 2, s = speed * .5 * Math.random();
      add({ kind: 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: g * .5, r: rnd(6, 12) * size, c: pick(c), a: .8, life: rnd(400, 800) });
    }
    if (ring) { add({ kind: 'ring', x, y, r0: 6, r1: 70 * size, w: 6, c: c[0], life: 520 }); add({ kind: 'ring', x, y, r0: 4, r1: 44 * size, w: 3, c: '#fff', life: 380 }); }
  }
  function twinkles(x, y, r = 60, count = 10, c = '#FFF6C8') {
    for (let i = 0; i < n(count); i++) add({ kind: 'twinkle', x: x + rnd(-r, r), y: y + rnd(-r, r), r: rnd(5, 11), c, life: rnd(500, 900), t0: performance.now() + rnd(0, 600) });
  }
  function confetti(x, y, count = 90, spread = 1) {
    const cols = ['#FF4B3E', '#FFC93A', '#2EE6FF', '#3BF5A0', '#9F6BFF', '#fff', '#FF7AD9'];
    for (let i = 0; i < n(count); i++) {
      const a = -Math.PI / 2 + rnd(-1.2, 1.2) * spread, s = rnd(6, 15);
      add({ kind: 'confetti', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: .22, c: pick(cols), w: rnd(6, 10), h: rnd(10, 16), rot: rnd(0, 6), vr: rnd(-.25, .25), ph: rnd(0, 1000), life: rnd(1800, 2800) });
    }
  }
  function rain(count = 80) { for (let i = 0; i < n(count); i++) add({ kind: 'confetti', x: rnd(0, W), y: rnd(-120, -10), vx: rnd(-1, 1), vy: rnd(2, 5), g: .05, c: pick(['#FFC93A', '#FFF6C8', '#FF9A1A', '#fff']), w: rnd(5, 9), h: rnd(9, 14), rot: rnd(0, 6), vr: rnd(-.2, .2), ph: rnd(0, 1000), life: rnd(2400, 3400), t0: performance.now() + rnd(0, 900) }); }
  function ring(x, y, c = '#2EE6FF', r1 = 80, w = 6, sy = 1) { add({ kind: 'ring', x, y, r0: 4, r1, w, c, sy, life: 500 }); }
  function text(x, y, s, c = '#FFC93A', size = 22) { add({ kind: 'text', x, y, s, c, size, life: 1100 }); }

  /* полёт монет/гемов: возвращает промис, onHit на каждую долетевшую */
  function fly(from, to, { sprite = 'coin', count = 10, size = 30, onHit, stagger = 45 } = {}) {
    return new Promise((res) => {
      const N = Math.max(3, n(count)); let hit = 0;
      for (let i = 0; i < N; i++) {
        const a = Math.random() * Math.PI * 2, r = rnd(20, 70);
        add({
          kind: 'fly', sprite, x0: from.x, y0: from.y, bx: Math.cos(a) * r, by: Math.sin(a) * r - 20, tx: to.x, ty: to.y, cx: rnd(-60, 60), cy: rnd(-40, 20),
          size, ph: rnd(0, 6), life: rnd(820, 1000), t0: performance.now() + i * stagger,
          done: () => { hit++; onHit && onHit(hit, N); if (hit === N) res(); }
        });
      }
    });
  }

  /* тряска: двигаем слой экранов, затухающе */
  let shakeT = 0, shakeA = 0, shakeD = 1, shaking = false;
  function shake(amp = 10, dur = 400) {
    if (S.rm) return; shakeA = Math.max(shakeA, amp); shakeD = dur; shakeT = performance.now();
    if (!shaking) { shaking = true; requestAnimationFrame(sh); }
  }
  function sh(now) {
    const el = $('#screens'); const t = (now - shakeT) / shakeD;
    if (t >= 1) { el.style.transform = ''; shaking = false; shakeA = 0; return; }
    const a = shakeA * Math.pow(1 - t, 2);
    el.style.transform = `translate(${rnd(-a, a)}px,${rnd(-a, a)}px) rotate(${rnd(-a, a) * .04}deg)`;
    requestAnimationFrame(sh);
  }
  return { init, resize, burst, twinkles, confetti, rain, ring, text, fly, shake, pt, setQuality, get W() { return W; }, get H() { return H; } };
})();

/* =====================================================================
   WALLET — изменения валют всегда видимы: монеты летят в счётчик,
   счётчик подпрыгивает, иконка крутится, играет звук на каждую монету.
   ===================================================================== */
const Wallet = {
  add(kind, amount, fromPt, { count } = {}) {
    const target = $(`.screen.current [data-cur="${kind}"]`) || $(`[data-cur="${kind}"]`);
    const startVal = S[kind]; S[kind] += amount; save();
    if (!target) return Promise.resolve();
    const v = target.querySelector('.v'), ic = target.querySelector('.ci');
    const to = FX.pt(ic || target);
    const N = count || clamp(Math.round(Math.abs(amount) / 12), 6, 16);
    return FX.fly(fromPt, to, {
      sprite: kind === 'gems' ? 'gem' : 'coin', count: N,
      onHit: (i, total) => {
        const val = Math.round(startVal + amount * (i / total)); v.textContent = fmt(val);
        bump(v); ic && bump(ic, 'bump-ic'); kind === 'gems' ? Sfx.gem(i) : Sfx.coin(i); if (i % 3 === 0) haptic('soft');
        if (i === total) { v.textContent = fmt(S[kind]); FX.burst(to.x, to.y, { c: kind === 'gems' ? ['#2EE6FF', '#fff'] : ['#FFC93A', '#fff'], count: 10, speed: 5, size: .6 }); }
      }
    });
  },
  spend(kind, amount, toPt) {
    if (S[kind] < amount) { toast('Не хватает ' + (kind === 'gems' ? 'гемов' : 'монет'), kind === 'gems' ? 'gem' : 'coin'); Sfx.error(); haptic('error'); return false; }
    const src = $(`.screen.current [data-cur="${kind}"]`);
    const startVal = S[kind]; S[kind] -= amount; save();
    if (src) {
      const v = src.querySelector('.v');
      tickNumber(v, startVal, S[kind], 600); bump(v);
      FX.fly(FX.pt(src.querySelector('.ci') || src), toPt, { sprite: kind === 'gems' ? 'gem' : 'coin', count: 8, size: 26, stagger: 30 });
    }
    return true;
  }
};

/* ==== bg.js ==== */
/* =====================================================================
   BG — WebGL-фон «арена»: объёмные прожекторы, пыль в лучах, боке,
   пол со световым пятном, плёночное зерно. Настроение (палитра)
   плавно перетекает при смене экрана. Фолбэк — CSS-градиенты.
   ===================================================================== */
const BG = (() => {
  let gl, prog, cv, u = {}, start = performance.now(), raf = 0, scale = .5, ok = false;
  const MOODS = {
    arena:  { a: [1.0, .29, .24], b: [.18, .9, 1.0], base: [.035, .04, .11], floor: .55, beams: 1 },
    battle: { a: [1.0, .25, .2], b: [.15, .55, 1.0], base: [.02, .02, .06], floor: .25, beams: 1.3 },
    gold:   { a: [1.0, .78, .22], b: [1.0, .45, .15], base: [.07, .04, .06], floor: .8, beams: 1.4 },
    lose:   { a: [.45, .5, .7], b: [.3, .35, .5], base: [.03, .03, .05], floor: .2, beams: .5 },
    violet: { a: [.62, .42, 1.0], b: [.18, .9, 1.0], base: [.04, .03, .12], floor: .5, beams: 1 },
    shop:   { a: [.23, .96, .63], b: [1.0, .79, .23], base: [.03, .05, .09], floor: .5, beams: .8 }
  };
  let cur = structuredClone(MOODS.arena), tgt = MOODS.arena;
  const FS = `precision mediump float;
  uniform vec2 R; uniform float T; uniform vec3 CA, CB, BASE; uniform float FLOOR, BEAMS;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
  float beam(vec2 uv, vec2 o, float ang, float w){vec2 d=uv-o; float a=atan(d.x,-d.y)-ang; float fall=smoothstep(1.6,.0,length(d)); return exp(-a*a/(w*w))*fall;}
  void main(){
    vec2 uv=gl_FragCoord.xy/R; vec2 p=uv; p.x=(p.x-.5)*R.x/R.y+.5;
    vec3 col=BASE*(1.2-uv.y*.6);
    float t=T*.25;
    float b1=beam(p,vec2(.05,1.12),.55+sin(t*1.1)*.18,.13);
    float b2=beam(p,vec2(.95,1.12),-.55+sin(t*.9+2.)*.18,.13);
    float b3=beam(p,vec2(.5,1.2),sin(t*.7)*.25,.08)*.6;
    float dust=n(p*vec2(6.,3.)+vec2(0.,-T*.08))*n(p*14.+T*.05);
    col+=CA*b1*(.32+dust*.55)*BEAMS + CB*b2*(.32+dust*.55)*BEAMS + mix(CA,CB,.5)*b3*.35*BEAMS;
    float fl=exp(-pow((p.x-.5)*2.2,2.)-pow((uv.y-.16)*5.,2.));
    col+=mix(CB,CA,.35)*fl*.22*FLOOR;
    for(int i=0;i<10;i++){float fi=float(i); vec2 c=vec2(fract(h(vec2(fi,1.))+T*.004*(1.+fi*.1)), .25+.7*h(vec2(fi,7.)));
      c.x=(c.x-.5)*R.x/R.y+.5; float d=length(p-c); float r=.015+.03*h(vec2(fi,3.));
      col+=mix(CA,CB,h(vec2(fi,9.)))*smoothstep(r,r*.3,d)*.09*(.6+.4*sin(T+fi));}
    col*=1.-.55*pow(length((uv-vec2(.5,.55))*vec2(1.1,.9)),1.8);
    col+=(h(gl_FragCoord.xy+fract(T)*100.)-.5)*.025;
    gl_FragColor=vec4(col,1.);
  }`;
  const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  function init() {
    cv = $('#bg');
    try {
      gl = cv.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'low-power' });
      if (!gl) throw 0;
      const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; };
      prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
      const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const a = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
      ['R', 'T', 'CA', 'CB', 'BASE', 'FLOOR', 'BEAMS'].forEach((k) => (u[k] = gl.getUniformLocation(prog, k)));
      ok = true;
    } catch (e) { ok = false; cv.style.background = 'radial-gradient(120% 60% at 15% 0%,rgba(255,75,62,.25),transparent 60%),radial-gradient(120% 60% at 85% 0%,rgba(46,230,255,.22),transparent 60%),#05060F'; }
    resize(); window.addEventListener('resize', resize);
    setQuality(S.quality);
    if (ok) frame();
  }
  function resize() { const r = $('#device').getBoundingClientRect(); const d = Math.min(2, devicePixelRatio || 1); cv.width = Math.max(1, r.width * d * scale); cv.height = Math.max(1, r.height * d * scale); if (ok) gl.viewport(0, 0, cv.width, cv.height); }
  function setQuality(q) { scale = q === 'high' ? .5 : q === 'mid' ? .35 : .22; resize(); }
  let paused = false;
  function frame() {
    raf = requestAnimationFrame(frame);
    if (paused) return;
    const k = .04;
    for (const key of ['a', 'b', 'base']) for (let i = 0; i < 3; i++) cur[key][i] = lerp(cur[key][i], tgt[key][i], k);
    cur.floor = lerp(cur.floor, tgt.floor, k); cur.beams = lerp(cur.beams, tgt.beams, k);
    gl.uniform2f(u.R, cv.width, cv.height); gl.uniform1f(u.T, (performance.now() - start) / 1000);
    gl.uniform3fv(u.CA, cur.a); gl.uniform3fv(u.CB, cur.b); gl.uniform3fv(u.BASE, cur.base);
    gl.uniform1f(u.FLOOR, cur.floor); gl.uniform1f(u.BEAMS, cur.beams);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  return { init, resize, setQuality, mood(m) { tgt = MOODS[m] || MOODS.arena; }, pause(p) { paused = p; } };
})();

/* ==== engine.js ==== */
/* =====================================================================
   ENGINE — настольный теннис в псевдо-3D на canvas 2D.
   Мир в метрах: x — ширина (±0.7625), y — длина (0 у игрока … 2.74),
   z — высота над столом. Камера с наклоном/рысканьем, проекция руками.
   mode 'demo' — ИИ против ИИ (живой фон хаба), 'play' — игрок пальцем.
   ===================================================================== */
const TT = (() => {
  const L = 2.74, HW = .7625, NY = L / 2, NET_H = .1525, G = 9.8, BR = .02, VIS_BR = .046;
  const PY = -.3, OY = L + .3; // плоскости ударов
  const FLOOR = -.76;

  class Game {
    constructor(canvas, opt = {}) {

    drawBall() {
      const c = this.ctx; const b = this.ball; const P = (x, y, z) => this.project(x, y, z);
      if (!b.live && this.state !== 'serve-p' && this.state !== 'serve-o') return;
      // тень
      const overTable = Math.abs(b.x) <= HW && b.y >= 0 && b.y <= L;
      const sz = overTable ? 0 : FLOOR; const sp = P(b.x, b.y, sz); const hgt = Math.max(0, b.z - sz);
      const sr = VIS_BR * sp.s * (1 + hgt * .8);
      c.fillStyle = `rgba(0,0,10,${clamp(.55 - hgt * .5, .12, .55)})`; c.beginPath(); c.ellipse(sp.x, sp.y, sr * 1.2, sr * .5, 0, 0, 7); c.fill();
      // след
      const col = b.by === 'p' ? this.colP : this.colO; const perfect = this.lastShot && this.lastShot.perfect && b.by === 'p';
      if (this.trail.length > 2 && S.quality !== 'low') {
        c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
        for (let i = 1; i < this.trail.length; i++) {
          const p0 = P(this.trail[i - 1].x, this.trail[i - 1].y, this.trail[i - 1].z), p1 = P(this.trail[i].x, this.trail[i].y, this.trail[i].z);
          const k = i / this.trail.length; c.strokeStyle = perfect ? `rgba(255,200,60,${k * .9})` : hexA(col, k * .7);
          c.lineWidth = VIS_BR * p1.s * 1.6 * k; c.beginPath(); c.moveTo(p0.x, p0.y); c.lineTo(p1.x, p1.y); c.stroke();
        }
        c.restore();
      }
      const p = P(b.x, b.y, b.z); const r = Math.max(3, VIS_BR * p.s);
      const gl = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3.2); gl.addColorStop(0, perfect ? 'rgba(255,210,80,.55)' : 'rgba(255,255,255,.35)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = gl; c.beginPath(); c.arc(p.x, p.y, r * 3.2, 0, 7); c.fill();
      const g = c.createRadialGradient(p.x - r * .35, p.y - r * .4, r * .1, p.x, p.y, r);
      g.addColorStop(0, '#FFFFFF'); g.addColorStop(.6, '#FFF3E0'); g.addColorStop(1, '#F2B880');
      c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, r, 0, 7); c.fill();
    }
    drawPaddle(Pd, planeY, col, far) {
      const c = this.ctx; const p = this.project(Pd.x, planeY, Pd.z);
      const r = (far ? .1 : .085) * p.s * (far ? 1.25 : 1.05);
      c.save(); c.translate(p.x, p.y); c.rotate(Pd.ang + (far ? Math.PI : 0) * 0);
      if (Pd.flash > .05) { c.globalCompositeOperation = 'lighter'; const g = c.createRadialGradient(0, 0, 0, 0, 0, r * 2.4); g.addColorStop(0, hexA(col, Pd.flash * .8)); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.beginPath(); c.arc(0, 0, r * 2.4, 0, 7); c.fill(); c.globalCompositeOperation = 'source-over'; }
      // ручка
      const hx = far ? 0 : 0, hy = far ? -r * .95 : r * .9;
      c.fillStyle = '#B8743A'; c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = 1;
      roundRect(c, hx - r * .2, far ? hy - r * .9 : hy - r * .1, r * .4, r * 1.0, r * .15); c.fill(); c.stroke();
      // накладка
      c.fillStyle = '#2A1408'; c.beginPath(); c.ellipse(0, 0, r * 1.04, r * 1.1, 0, 0, 7); c.fill();
      const g = c.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r * 1.1); g.addColorStop(0, lighten(col)); g.addColorStop(.5, col); g.addColorStop(1, darken(col));
      c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, r, r * 1.06, 0, 0, 7); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = Math.max(1, r * .08); c.beginPath(); c.ellipse(0, 0, r * .78, r * .84, 0, 3.6, 4.6); c.stroke();
      c.restore();
    }
    screenOfPaddle() { return this.project(this.pp.x, PY, this.pp.z); }
  }
  function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
  function lighten(hex) { const n = parseInt(hex.slice(1), 16); const f = (v) => Math.min(255, v + 90); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; }
  function darken(hex) { const n = parseInt(hex.slice(1), 16); const f = (v) => Math.max(0, v * .45 | 0); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; }
  return { Game, L, NY, HW };
})();

/* ==== ui.js ==== */
/* =====================================================================
   UI — общие блоки: верхний HUD, кнопки-ярлыки, 3D-наклон карточек,
   «держи, чтобы купить», сегмент-табы со скользящей плашкой.
   ===================================================================== */
const UI = {
  hud({ back = false, title = '' } = {}) {
    const L = leagueOf(S.rating); const p = S.xp / S.xpMax; const C = 2 * Math.PI * 21;
    const left = back
      ? `<button class="ib" data-act="back" aria-label="Назад">${Art.icon('back', { c: '#fff' })}</button><div class="h2" style="flex:1;margin-left:4px">${title}</div>`
      : `<div class="hud-me" data-act="profile">
          <div class="lvl-ring">
            <svg class="ring" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="4.5"/>
            <circle cx="24" cy="24" r="21" fill="none" stroke="url(#xpg)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}"/>
            <defs><linearGradient id="xpg"><stop offset="0" stop-color="#7DF3FF"/><stop offset="1" stop-color="#2E8BFF"/></linearGradient></defs></svg>
            <div class="av">${Art.avatar('me', 38)}</div><div class="lv">${S.level}</div>
          </div>
          <div class="hud-name"><b>${S.name.split(' ')[0]}</b><span>${Art.badge(L, 14)}${L.n}</span></div>
        </div>`;
    return `<div class="hud">${left}
      <div class="cur" data-cur="coins"><span class="ci">${Art.coin(36)}</span><span class="v num">${fmt(S.coins)}</span><button class="plus" data-act="buy-coins" aria-label="Купить монеты">+</button></div>
      <div class="cur" data-cur="gems"><span class="ci">${Art.gem(34)}</span><span class="v num">${fmt(S.gems)}</span><button class="plus" data-act="buy-gems" aria-label="Купить гемы">+</button></div>
    </div>`;
  },
  bindHud(el) {
    el.addEventListener('click', (e) => {
      const a = e.target.closest('[data-act]'); if (!a) return;
      const k = a.dataset.act;
      if (k === 'back') Router.back();
      if (k === 'profile') Router.go('profile');
      if (k === 'buy-coins' || k === 'buy-gems') { Router.go('shop'); setTimeout(() => { const g = $('.screen.current #gemPacks'); g && g.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 520); }
    });
  },

  /* 3D-наклон карточки: указатель или гироскоп, со светом-бликом */
  tilt(el, max = 10) {
    if (S.rm) return;
    el.style.transformStyle = 'preserve-3d';
    let raf = 0, tx = 0, ty = 0, cx = 0, cy = 0;
    const tick = () => { cx = lerp(cx, tx, .15); cy = lerp(cy, ty, .15); el.style.transform = `perspective(700px) rotateX(${cy}deg) rotateY(${cx}deg)`; el.style.setProperty('--mx', (50 + cx * 4) + '%'); el.style.setProperty('--my', (50 - cy * 4) + '%'); if (Math.abs(cx - tx) + Math.abs(cy - ty) > .05) raf = requestAnimationFrame(tick); else raf = 0; };
    const go = () => { if (!raf) raf = requestAnimationFrame(tick); };
    el.addEventListener('pointermove', (e) => { const r = el.getBoundingClientRect(); tx = ((e.clientX - r.left) / r.width - .5) * 2 * max; ty = -((e.clientY - r.top) / r.height - .5) * 2 * max; go(); });
    el.addEventListener('pointerleave', () => { tx = 0; ty = 0; go(); });
    el.addEventListener('pointerup', () => { tx = 0; ty = 0; go(); });
  },

  /* держи, чтобы подтвердить (защита от случайной покупки) */
  hold(btn, ms, onDone) {
    let t0 = 0, raf = 0, done = false; const fill = btn.querySelector('.hold-fill');
    const frame = (now) => {
      const p = clamp((now - t0) / ms, 0, 1); fill.style.transform = `scaleX(${p})`;
      if (Math.floor(p * 10) !== Math.floor((p - .016) * 10)) { Sfx.hold(p); haptic('select'); }
      if (p >= 1) { done = true; btn.classList.remove('holding'); onDone(); return; }
      raf = requestAnimationFrame(frame);
    };
    const start = (e) => { if (done) return; t0 = performance.now(); btn.classList.add('holding'); raf = requestAnimationFrame(frame); };
    const stop = () => { cancelAnimationFrame(raf); if (!done) { fill.style.transition = 'transform .3s'; fill.style.transform = 'scaleX(0)'; setTimeout(() => (fill.style.transition = ''), 300); btn.classList.remove('holding'); } };
    btn.addEventListener('pointerdown', start); btn.addEventListener('pointerup', stop); btn.addEventListener('pointerleave', stop); btn.addEventListener('pointercancel', stop);
  },

  seg(el, onChange) {
    const pill = el.querySelector('.pill'); const btns = $$('button', el);
    const place = (b) => { pill.style.left = b.offsetLeft + 'px'; pill.style.width = b.offsetWidth + 'px'; };
    requestAnimationFrame(() => place(el.querySelector('button.on') || btns[0]));
    el.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b || b.classList.contains('on')) return; btns.forEach((x) => x.classList.toggle('on', x === b)); place(b); Sfx.tab(); haptic('select'); onChange && onChange(b.dataset.v); });
  },

  /* сплит-текст для побуквенной анимации */
  split(s, cls = 'ch') { return [...s].map((c, i) => `<span class="${cls}" style="--i:${i}">${c === ' ' ? '&nbsp;' : c}</span>`).join(''); }
};

/* таймер-строка */
function fmtLeft(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return h ? `${h}ч ${String(m).padStart(2, '0')}м` : `${m}:${String(ss).padStart(2, '0')}`;
}

    const g = this.game = new TT.Game(cv, { mode: 'play', cam: { y: -1.1, z: 1.8, pitch: 38, f: 1.14, cy: .48 }, diff: MODE.diff, spd: .42, assist: S.assist, colO: o.c[0] === '#FFC93A' ? '#FFC93A' : o.c[0] });
    const rallyEl = el.querySelector('.m-rally'), rallyN = rallyEl.querySelector('b');
