    const showBanner = (html, cls = '', ms = 1000) => { banner.className = 'm-banner ' + cls; banner.innerHTML = html; void banner.offsetWidth; banner.classList.add('on'); clearTimeout(this.bt); this.bt = setTimeout(() => banner.classList.remove('on'), ms); };
    const setServer = () => { $$('.srv', el).forEach((s) => s.classList.toggle('on', s.dataset.srv === st.server)); serveEl.classList.toggle('on', st.server === 'p'); };
    const nextServe = () => {
      if (st.over) return;
      const total = st.p + st.o; const deuce = st.p >= 6 && st.o >= 6;
      st.server = deuce ? (total % 2 ? 'o' : 'p') : (Math.floor(total / 2) % 2 ? 'o' : 'p');
      setServer();
      const mp = (a, b) => (a >= 6 && a > b);
      if (mp(st.p, st.o) || mp(st.o, st.p)) { showBanner('<b>Матчбол</b>', 'mp', 1300); el.querySelector('.m-vig').classList.add('mp'); Sfx.rise(.5); haptic('warning'); }
      else el.querySelector('.m-vig').classList.remove('mp');
      g.serve(st.server);
    };
    g.on = (ev, d) => {
      if (ev === 'hit') {
        if (d.by === 'p') {
          st.hits++; serveEl.classList.remove('on');
          if (d.perfect) {
            st.perfect++; Sfx.smash(); haptic('heavy'); FX.shake(9, 300); flash('#FFE680', .35, 300);
            FX.burst(d.x, d.y, { c: ['#FFC93A', '#FFF6C8', '#FF7A4D'], count: 40, speed: 13, size: 1.3 }); FX.text(d.x, d.y - 40, 'ИДЕАЛЬНО!', '#FFD54A', 26);
          } else {
            Sfx.paddle(1 + d.power * .2); haptic(d.power > .6 ? 'medium' : 'light');
            FX.burst(d.x, d.y, { c: ['#FF7A4D', '#fff'], count: 14, speed: 7, size: .8, ring: true });
            if (d.power > .7) { st.smash++; FX.text(d.x, d.y - 36, 'СМЭШ!', '#FF9A6B', 20); Sfx.whoosh(); }
          }
        } else {
          Sfx.paddle(.85); FX.burst(d.x, d.y, { c: [g.colO, '#fff'], count: 8, speed: 4, size: .5, ring: false });
          if (d.smash) FX.text(d.x, d.y + 30, '!', '#7DF3FF', 26);
        }
        if (g.rally >= 3) { rallyEl.classList.add('on'); rallyN.textContent = '×' + g.rally; bump(rallyN); rallyEl.classList.toggle('fire', g.rally >= 10); }
      }
      if (ev === 'bounce') { Sfx.table(); FX.ring(d.x, d.y, 'rgba(255,255,255,.9)', 26, 3, .42); }
      if (ev === 'net') { Sfx.net(); FX.text(d.x, d.y - 20, 'СЕТКА', '#fff', 18); haptic('rigid'); }
      if (ev === 'touch') { const t = el.querySelector('.m-tut'); if (t) { t.classList.add('out'); setTimeout(() => t.remove(), 400); S.tutorial = false; save(); } }
      if (ev === 'point') {
        st.maxRally = Math.max(st.maxRally, d.rally); rallyEl.classList.remove('on', 'fire');
        const win = d.winner === 'p'; win ? st.p++ : st.o++;
        const sc = el.querySelector(win ? '#scP' : '#scO'); sc.textContent = win ? st.p : st.o; sc.classList.remove('flip'); void sc.offsetWidth; sc.classList.add('flip');
        const reason = { out: 'Аут', net: 'Сетка', own: 'Своя сторона', double: '', miss: '' }[d.reason] || '';
        if (win) {
          Sfx.point(); haptic('success');
          const sp = FX.pt(sc); FX.burst(sp.x, sp.y, { c: ['#FF7A4D', '#FFC93A', '#fff'], count: 24, speed: 9 });
          FX.confetti(FX.W * .5, FX.H * .62, 40, .6);
          showBanner(`<b>Очко!</b>${reason ? `<small>${reason} у соперника</small>` : ''}`, 'win');
        } else {
          Sfx.lose(); haptic('error'); FX.shake(6, 260);
          el.querySelector('.m-vig').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 600 });
          el.querySelector('.m-vig').style.setProperty('--vc', 'rgba(255,40,40,.45)');
          showBanner(`<b>${reason || 'Мимо'}</b><small>очко сопернику</small>`, 'lose');
        }
        const done = (a, b) => a >= 7 && a - b >= 2 || a >= 11;
        if (done(st.p, st.o) || done(st.o, st.p)) { st.over = true; return this.finish(st.p > st.o); }
        setTimeout(nextServe, 1250);
      }
    };
    el.querySelector('[data-act=pause]').addEventListener('click', () => this.pause());
    setServer();
    setTimeout(() => nextServe(), 500);
  },
  pause() {
    const g = this.game; if (!g) return; g.paused = true;
    Sheet.open(`<div class="h1" style="margin:4px 4px 6px">Пауза</div><p class="dim" style="margin:0 4px 16px;font-size:12.5px">Матч сохранён — соперник ждёт 60 секунд.</p>
      <div style="display:grid;gap:12px"><button class="b3 green block" data-a="resume"><span class="shine"></span>${Art.icon('play', { c: '#fff' })}Продолжить</button>
      <button class="b3 dark block" data-a="settings">${Art.icon('gear', { c: '#fff' })}Настройки</button>
      <button class="b3 coral block sm" data-a="quit">Сдаться</button></div>`, {
      onOpen: (w) => w.addEventListener('click', (e) => {
        const a = e.target.closest('[data-a]'); if (!a) return;
        if (a.dataset.a === 'resume') { Sheet.close(); g.paused = false; g.last = performance.now(); }
        if (a.dataset.a === 'settings') openSettings();
        if (a.dataset.a === 'quit') { Sheet.close(); this.st.over = true; this.finish(false, true); }
      })
    });
    const w = Sheet.cur; const obs = new MutationObserver(() => { if (!document.body.contains(w)) { obs.disconnect(); if (g && !this.st.over) { g.paused = false; g.last = performance.now(); } } }); obs.observe($('#sheets'), { childList: true });
  },
  async finish(win, quit = false) {
    const g = this.game; const st = this.st;
    g.slowUntil = performance.now() + 900;

    const el = $('.screen.current .match'); if (!el) return;
    const b = document.createElement('div'); b.className = 'm-final ' + (win ? 'win' : 'lose'); b.innerHTML = `<b class="h-display">${win ? 'Победа' : 'Поражение'}</b>`; el.appendChild(b);

    await sleep(1500);
    Router.go('result', { data: { win, me: st.p, op: st.o, opp: BATTLE.opp, stats: { hits: st.hits, perfect: st.perfect, smash: st.smash, maxRally: st.maxRally, acc: Math.round(68 + Math.random() * 20) } } });

    el.querySelector('[data-act=again]').addEventListener('click', () => Router.go('mm'));
    (async () => {
      await sleep(150); res.classList.add('t1');
      if (d.win) { Sfx.win(); FX.rain(70); } else Sfx.lose();
      await sleep(650); if (!this.alive) return; res.classList.add('t2');
      // звёзды-медали: штамп с ударом
      for (const [i, m] of this.medals.entries()) {
        await sleep(330); if (!this.alive) return;
        const md = el.querySelector(`.md[data-i="${i}"]`); md.classList.add('on');
        if (m.on) { const p = FX.pt(md.querySelector('.mds')); setTimeout(() => { FX.burst(p.x, p.y, { count: 26, speed: 10, size: 1.1 }); FX.twinkles(p.x, p.y, 40, 6); Sfx.impact(); haptic('heavy'); FX.shake(5, 200); }, 180); }
        else { setTimeout(() => Sfx.soft(), 180); }
      }
      await sleep(500); if (!this.alive) return; res.classList.add('t3');
      await sleep(450);
      // рейтинг
      const r0 = S.rating; S.rating += this.delta; if (d.win) { S.wins++; S.streak++; } else { S.losses++; S.streak = 0; }
      const L = leagueOf(S.rating), N = nextLeague(S.rating);
      tickNumber(el.querySelector('#rRating'), r0, S.rating, 900, { onTick: () => Sfx.tick() });
      el.querySelector('#rBar').style.setProperty('--p', N ? (S.rating - L.min) / (N.min - L.min) : 1);
      await sleep(900); if (!this.alive) return;
      // опыт
      const add = d.win ? 180 : 60; const x0 = S.xp; S.xp += add; let lvlUp = false;
      tickNumber(el.querySelector('#rXp'), x0, Math.min(S.xp, S.xpMax), 800);
      el.querySelector('#rXpBar').style.setProperty('--p', Math.min(1, S.xp / S.xpMax));
      if (S.xp >= S.xpMax) { S.xp -= S.xpMax; lvlUp = true; }
      save();
      await sleep(900); if (!this.alive) return;
      if (d.win) {
        const lc = el.querySelector('.lcoin'); Wallet.add('coins', 90, FX.pt(lc));
        const empty = S.chests.findIndex((c) => !c); if (empty >= 0) { S.chests[empty] = { id: 'c' + Date.now(), kind: 'silver', state: 'locked' }; save(); }
        const lch = el.querySelector('.lc'); lch.classList.add('drop');
      }
      res.classList.add('t4');
      if (lvlUp) { await sleep(1200); if (this.alive) LevelUp.show(S.level + 1); }
    })();
  },
  leave() { this.alive = false; },
  onBack() { Router.go('hub'); }
});

      lc.classList.add('flip'); Sfx.reveal(['common', 'rare', 'epic', 'leg'].indexOf(it.r)); haptic(it.r === 'leg' ? 'heavy' : 'medium');

      setTimeout(() => { FX.burst(p.x, p.y, { c: col, count: it.r === 'leg' ? 60 : 30, speed: it.r === 'leg' ? 16 : 10, size: it.r === 'leg' ? 1.6 : 1 }); if (it.r === 'leg') { FX.rain(60); flash('#FFE680', .6); FX.shake(10, 400); } FX.twinkles(p.x, p.y, 90, 10); }, 220);

  summary(el) {
    this.phase = 'sum';

      await sleep(300); Router.go('hub');

});

  const l = i + 1;
  const f = l % 5 === 0 ? { k: 'chest', kind: 'silver', n: 1 } : l % 2 ? { k: 'coins', n: 50 + l * 10 } : { k: 'gems', n: 2 + (l >> 1) };
  const p = l % 5 === 0 ? { k: 'chest', kind: l % 10 === 0 ? 'epic' : 'gold', n: 1 } : l % 3 === 0 ? { k: 'card', n: 1, col: ['#FF4B3E', '#9F6BFF', '#2EC9FF'][l % 3] } : { k: 'gems', n: 5 + l };
  return { l, f, p };
});
Router.def('pass', {
  mood: 'violet',
  render() {
    const cell = (r, lane, l) => {
      const claimed = S.claimed[lane].includes(l); const reached = l <= S.passLvl; const locked = lane === 'p' && !S.premium;
      const st = claimed ? 'claimed' : reached && !locked ? 'ready' : 'future';
      const art = r.k === 'coins' ? Art.coin(38) : r.k === 'gems' ? Art.gem(36) : r.k === 'chest' ? Art.chest(r.kind, 50) : Art.paddle(r.col, 46);

        <span class="pca">${art}</span><b class="num">${r.k === 'chest' || r.k === 'card' ? '' : '×' + r.n}</b>
        ${claimed ? `<span class="pcc">${Art.icon('check', { c: '#fff', sw: 3 })}</span>` : ''}${locked ? `<span class="pcl">${Art.icon('lock', { c: '#FFE28A' })}</span>` : ''}</button>`;

      <div class="track">
        <div class="tline"><i style="height:${(S.passLvl - .5) / PASS.length * 100}%"></i></div>
        ${PASS.map((r, i) => `<div class="trow ${r.l === S.passLvl ? 'cur' : ''} ${r.l <= S.passLvl ? 'reached' : ''}" style="--d:${Math.min(i, 10) + 3}">

  mount(el) {

    el.addEventListener('click', (e) => {
      const a = e.target.closest('[data-act=premium]'); if (a) return this.buyPremium(a);
      const c = e.target.closest('.pc'); if (!c) return;
      const l = +c.dataset.l, lane = c.dataset.lane; const r = PASS[l - 1][lane];
      if (c.classList.contains('locked')) { toast('Нужен премиум-пропуск', 'crown'); c.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-6deg)' }, { transform: 'rotate(6deg)' }, { transform: 'rotate(0)' }], { duration: 300 }); return; }

      onOpen: (w) => w.querySelector('[data-a=pay]').addEventListener('click', async () => {
        Sheet.close(); await sleep(250); S.premium = true; save(); Sfx.win(); haptic('success'); flash('#FFE680', .6); FX.rain(90);

});

Router.def('ranks', {
  mood: 'gold',
  data(tab) {
    const base = PEOPLE.map((p, i) => ({ ...p, key: 'p' + i }));
    let list = tab === 'friends' ? base.filter((_, i) => [0, 1, 3, 5].includes(i)) : tab === 'club' ? base.filter((_, i) => [0, 2, 4].includes(i)) : base;
    const meRow = { n: S.name, s: 'Ты', r: S.rating, key: 'me', me: true, club: S.club };
    if (tab === 'world') { list = list.sort((a, b) => b.r - a.r).map((x, i) => ({ ...x, pos: i + 1 })); list.push({ ...meRow, pos: 1284 }); }
    else list = list.concat([meRow]).sort((a, b) => b.r - a.r).map((x, i) => ({ ...x, pos: i + 1 }));

  body(tab) {

        <b class="pd-n">${p.s}</b><span class="pd-r num">${Art.trophy(14)}${fmt(p.r)}</span>
        <div class="pd-col"><span class="num">${p.pos}</span></div></div>`).join('')}</div>
      <div class="lb">${rest.map((p, i) => `<div class="lrow ${p.me ? 'me' : ''}" style="--d:${i}">

      ${tab === 'world' && me ? `<div class="lrow me sticky"><span class="lp num">${fmt(me.pos)}</span>${Art.avatar('me', 40)}<span class="ln"><b>Ты</b><small>топ 4% · ${S.club}</small></span><span class="lch up">▲38</span><span class="lr num">${Art.badge(leagueOf(S.rating), 18)}${fmt(S.rating)}</span></div>` : ''}`;
  },
  render() {
    return `${UI.hud()}<div class="scroll">
      <div class="pg-head rise" style="--d:0"><div class="h1">Рейтинг</div><span class="chip gold">${Art.icon('clock', { c: '#FFE28A' })} Сезон: 12д</span></div>
      <div class="seg rise" style="--d:1;margin:0 14px" id="rkSeg"><span class="pill"></span><button class="on" data-v="world">Мир</button><button data-v="friends">Друзья</button><button data-v="club">Клуб</button></div>
      <div id="rkBody" class="rk-body">${this.body('world')}</div></div>`;
  },
  mount(el) {
    UI.bindHud(el); this.anim(el);
    UI.seg(el.querySelector('#rkSeg'), (v) => { const b = el.querySelector('#rkBody'); b.classList.remove('go'); b.innerHTML = this.body(v); void b.offsetWidth; this.anim(el); });
  },

Router.def('profile', {
  mood: 'arena',
  render() {
    const L = leagueOf(S.rating); const total = S.wins + S.losses; const wr = Math.round(S.wins / total * 100);
    // рейтинг за 30 дней
    let r = S.rating - 240; const pts = [...Array(30)].map((_, i) => (r += Math.sin(i * 1.3) * 22 + 9 + (i > 24 ? 6 : 0)));
    pts[29] = S.rating; this.pts = pts;
    const sk = [['Подача', .72], ['Атака', .86], ['Защита', .58], ['Вращение', .8], ['Реакция', .66]]; this.sk = sk;
    const ach = [['Первая победа', 'trophy', 1], ['Серия 7', 'fire', 1], ['Снайпер', 'target', 1], ['Марафонец', 'clock', 0], ['Турнирный боец', 'crown', 0], ['Коллекционер', 'gift', 0]];
    const eq = (k) => SHOP.find((x) => x.id === S.equipped[k]) || null;
    return `${UI.hud()}<div class="scroll">
      <div class="pf-hero pnl rise" style="--d:0">
        <div class="pf-av">${Art.avatar('me', 92, { round: false })}<span class="pf-lv">${S.level}</span></div>
        <div class="pf-id"><b class="h2">${S.name}</b><span class="dim">${S.nick}</span><span class="chip cyan" style="margin-top:8px">${Art.icon('shield', { c: '#7DF3FF' })} ${S.club}</span></div>
        <button class="ib pf-set" data-act="settings" aria-label="Настройки">${Art.icon('gear', { c: '#fff' })}</button>
        <div class="pf-league"><span class="pfl-b">${Art.badge(L, 74)}</span><span class="cap">${L.n}</span><b class="num txt-gold">${fmt(S.rating)}</b></div>
      </div>
      <div class="pf-stats">
        <div class="pnl pst rise" style="--d:1"><span class="cap">Матчи</span><b class="num" data-n="${total}">0</b></div>
        <div class="pnl pst rise" style="--d:2"><span class="cap">Победы</span><b class="num txt-gold" data-n="${S.wins}">0</b></div>
        <div class="pnl pst ring rise" style="--d:3"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="25" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="7"/><circle class="wr" cx="30" cy="30" r="25" fill="none" stroke="url(#wrg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="157" data-o="${157 * (1 - wr / 100)}"/><defs><linearGradient id="wrg"><stop offset="0" stop-color="#3BF5A0"/><stop offset="1" stop-color="#2EC9FF"/></linearGradient></defs></svg><b class="num">${wr}%</b><span class="cap">Винрейт</span></div>
      </div>
      <div class="pnl chart rise" style="--d:4"><div class="ch-h"><span class="cap">Рейтинг · 30 дней</span><b class="num" id="chVal">${fmt(S.rating)}</b><em class="up">+${Math.round(S.rating - pts[0])}</em></div>
        <div class="ch-wrap" id="chWrap">${this.chart(pts)}</div></div>
      <div class="pnl skills rise" style="--d:5"><span class="cap">Стиль игры</span><div class="sk-wrap">${this.radar(sk)}</div></div>
      <div class="sec-title rise" style="--d:6"><span class="h2">${Art.icon('trophy')}Достижения</span><span class="dim" style="font-size:11.5px">3 / 6</span></div>
      <div class="ach">${ach.map(([t, i, got], k) => `<div class="ac ${got ? 'got' : ''} pop" style="--d:${k + 6}"><span class="aci">${Art.icon(i, { c: got ? '#3A1A00' : 'rgba(255,255,255,.35)', fill: got ? '#3A1A00' : 'transparent' })}</span><small>${t}</small></div>`).join('')}</div>
      <div class="sec-title rise" style="--d:8"><span class="h2">${Art.icon('paddle', { c: '#FFB3A6' })}Экипировка</span></div>
      <div class="grid3 eq">${['rubber', 'blade', 'trail'].map((k, i) => { const it = eq(k) || SHOP[0]; return `<div class="icard rar ${it.r} rise" style="--d:${9 + i}"><span class="ic-art">${ItemArt.of(it, 56)}</span><span class="ic-n">${it.n}</span><span class="ic-t">${it.t}</span></div>`; }).join('')}</div>
    </div>`;
  },
  chart(pts) {
    const W = 330, H = 120, min = Math.min(...pts) - 10, max = Math.max(...pts) + 10;
    const X = (i) => 6 + i / (pts.length - 1) * (W - 12), Y = (v) => H - 8 - (v - min) / (max - min) * (H - 20);
    let d = `M${X(0)},${Y(pts[0])}`; for (let i = 1; i < pts.length; i++) { const x0 = X(i - 1), x1 = X(i), y0 = Y(pts[i - 1]), y1 = Y(pts[i]); const cx = (x0 + x1) / 2; d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; }
    this.cX = X; this.cY = Y;
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="chsvg"><defs><linearGradient id="chg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2EC9FF" stop-opacity=".45"/><stop offset="1" stop-color="#2EC9FF" stop-opacity="0"/></linearGradient>
      <filter id="chgl"><feGaussianBlur stdDeviation="3"/></filter></defs>
      ${[0, 1, 2, 3].map((k) => `<line x1="0" x2="${W}" y1="${10 + k * 34}" y2="${10 + k * 34}" stroke="rgba(255,255,255,.06)" stroke-dasharray="3 5"/>`).join('')}
      <path class="ch-area" d="${d} L${X(pts.length - 1)},${H} L${X(0)},${H}Z" fill="url(#chg)"/>
      <path d="${d}" fill="none" stroke="#2EC9FF" stroke-width="5" opacity=".5" filter="url(#chgl)" class="ch-line"/>
      <path d="${d}" fill="none" stroke="#9BF6FF" stroke-width="2.6" stroke-linecap="round" class="ch-line"/>
      <line class="ch-cur" x1="0" x2="0" y1="0" y2="${H}" stroke="rgba(255,255,255,.35)" stroke-dasharray="3 3" opacity="0"/>
      <circle class="ch-dot" cx="${X(pts.length - 1)}" cy="${Y(pts[pts.length - 1])}" r="5" fill="#fff" stroke="#2EC9FF" stroke-width="3"/></svg>`;
  },
  radar(sk) {
    const c = 90, R = 66, n = sk.length; const pt = (i, r) => [c + Math.sin(i / n * 6.283) * r, c - Math.cos(i / n * 6.283) * r];
    const ring = (k) => sk.map((_, i) => pt(i, R * k).join(',')).join(' ');
    return `<svg viewBox="0 0 180 180" class="rdsvg">${[.25, .5, .75, 1].map((k) => `<polygon points="${ring(k)}" fill="none" stroke="rgba(255,255,255,${k === 1 ? .14 : .07})"/>`).join('')}
      ${sk.map((_, i) => { const [x, y] = pt(i, R); return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.07)"/>`; }).join('')}
      <polygon class="rd-shape" points="${sk.map(([, v], i) => pt(i, R * v).join(',')).join(' ')}" fill="rgba(255,75,62,.3)" stroke="#FF7A4D" stroke-width="2.4" stroke-linejoin="round"/>
      ${sk.map(([l, v], i) => { const [x, y] = pt(i, R + 16); const [dx, dy] = pt(i, R * v); return `<circle cx="${dx}" cy="${dy}" r="3.5" fill="#fff" class="rd-dot"/><text x="${x}" y="${y + 3}" text-anchor="middle" fill="rgba(222,230,255,.75)" font-size="9" font-weight="800" font-family="Man">${l}</text>`; }).join('')}</svg>`;
  },
  mount(el) {
    UI.bindHud(el);
    el.querySelector('[data-act=settings]').addEventListener('click', openSettings);
    setTimeout(() => {
      $$('[data-n]', el).forEach((b) => tickNumber(b, 0, +b.dataset.n, 1100));
      const wr = el.querySelector('.wr'); wr.style.transition = 'stroke-dashoffset 1.3s cubic-bezier(.16,1,.3,1)'; wr.style.strokeDashoffset = wr.dataset.o;
      el.querySelector('.chart').classList.add('go'); el.querySelector('.skills').classList.add('go');
    }, 450);
    // скраб по графику
    const wrap = el.querySelector('#chWrap'); const svg = wrap.querySelector('svg'); const val = el.querySelector('#chVal');
    const dot = svg.querySelector('.ch-dot'), cur = svg.querySelector('.ch-cur'); const pts = this.pts;
    const scrub = (e) => { const r = svg.getBoundingClientRect(); const t = clamp((e.clientX - r.left) / r.width, 0, 1); const i = Math.round(t * (pts.length - 1)); const x = this.cX(i), y = this.cY(pts[i]);
      dot.setAttribute('cx', x); dot.setAttribute('cy', y); cur.setAttribute('x1', x); cur.setAttribute('x2', x); cur.setAttribute('opacity', 1); if (val.textContent !== fmt(pts[i])) { val.textContent = fmt(Math.round(pts[i])); haptic('select'); } };
    wrap.addEventListener('pointerdown', (e) => { scrub(e); wrap.setPointerCapture(e.pointerId); });
    wrap.addEventListener('pointermove', (e) => { if (e.buttons || e.pointerType === 'touch') scrub(e); });
    wrap.addEventListener('pointerup', () => { const i = pts.length - 1; dot.setAttribute('cx', this.cX(i)); dot.setAttribute('cy', this.cY(pts[i])); cur.setAttribute('opacity', 0); val.textContent = fmt(S.rating); });
  }
});

/* ---------- FPS-метр для dev-панели ---------- */
